<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var t = localStorage.getItem("joetsu-theme");
    if(t !== "dark" && t !== "light"){
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上越行程表（暫）｜新潟・長岡花火・越後湯澤・秩父・川越・東京</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="shared.css">
<style>
  :root{
    /* page-specific extra tokens (base tokens live in shared.css) */
    --air:#2F6FA8;         /* 空色 sora-iro — flight */
    --rail:#A13D2C;        /* 蘇芳色 suou — shinkansen / train */
    --bus:#4C7A4A;         /* 抹茶色 matcha — bus */
    --boat:#2E6B7A;        /* 藍緑 ai-midori — boat / river ride */
    --cable:#C17B4A;       /* 珊瑚色-ish terracotta — cablecar */
    --walk:#7A7280;        /* 鼠色 nezumi — on foot */
    --car:#6B4C7A;         /* 江戸紫 edo-murasaki — self-drive / taxi */
    --branch2:#A65D2E;     /* 秩父・川越・東京 branch — page-specific, not in shared.css */
    --radius:14px;
  }

  /* ---------- Header ---------- */
  header.hero{
    color:var(--ink);
    padding:34px 20px 22px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  #heroBg{
    background:
      radial-gradient(1200px 300px at 10% -20%, rgba(110,134,184,0.18), transparent 60%),
      linear-gradient(180deg, #FFFFFB 0%, #F3F5FA 100%);
  }
  :root[data-theme="dark"] #heroBg{
    background:
      radial-gradient(1200px 300px at 10% -20%, rgba(185,199,232,0.10), transparent 60%),
      linear-gradient(180deg,#1C1C1C 0%, #20232B 100%);
  }
  header.hero > *{ position:relative; z-index:1; }
  header.hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 18px, transparent 18px 30px);
    opacity:.7;
    z-index:2;
  }
  .eyebrow{
    letter-spacing:.35em;
    font-size:11px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
    font-family:"JetBrains Mono",monospace;
  }
  h1.title{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:clamp(28px,6vw,42px);
    margin:0 0 6px;
    letter-spacing:.04em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:clamp(9.5px, 3.2vw, 14px);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding:0 4px;
  }
  .header-badges{ margin-top:14px; }
  .header-badges .countdown-wrap.compact{ margin:0; }
  .countdown-wrap.compact{
    display:inline-flex;
    flex-direction:row;
    align-items:center;
    flex-wrap:nowrap;
    white-space:nowrap;
    gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    margin:14px auto 0;
    box-shadow:0 1px 4px rgba(0,0,0,.06);
    text-align:left;
  }
  .countdown-wrap.compact .countdown-label{
    margin-bottom:0;
    font-size:13px;
    color:var(--ink);
  }
  .countdown-wrap.compact .countdown{ gap:3px; }
  .countdown-wrap.compact .cd-unit{ flex-direction:row; align-items:baseline; gap:2px; min-width:auto; }
  .countdown-wrap.compact .cd-num{ font-size:13px; color:var(--ink); perspective:120px; min-width:1.4em; }
  .countdown-wrap.compact .cd-label{ font-size:9px; color:var(--ink-soft); margin-top:0; }
  .countdown-wrap.compact .cd-sep{ font-size:12px; color:var(--ink-soft); transform:none; }
  .countdown-wrap.compact .cd-done{ font-size:12px; color:var(--accent-text); }
  .countdown-wrap.compact .cd-forex{ font-size:12px; gap:4px; }
  .countdown-wrap.compact .forex-badge{ font-size:12px; gap:4px; }
  .countdown-wrap.compact .cd-forex-eq{ font-size:10px; }

  /* ---------- Day nav ---------- */
  nav.daynav{
    position:sticky; top:0; z-index:20;
    background:var(--card);
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    border-bottom:1px solid var(--line);
    padding:0 8px;
  }
  .daytabs-scroll{
    display:flex;
    justify-content:center;
    overflow-x:auto;
    flex:1;
    min-width:0;
    scrollbar-width:none;
  }
  .daytabs-scroll::-webkit-scrollbar{display:none;}
  .daytab{
    flex:0 0 auto;
    background:transparent;
    border:none;
    color:var(--ink-soft);
    padding:12px 16px 10px;
    cursor:pointer;
    text-align:center;
    border-bottom:3px solid transparent;
    font-family:"Noto Sans TC",sans-serif;
    position:relative;
  }
  .daytab .num{
    display:block;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    letter-spacing:.1em;
    color:var(--ink-soft);
    opacity:.7;
  }
  .daytab .lbl{
    display:block;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    margin-top:2px;
  }
  .daytab.active{
    color:var(--ink);
    border-bottom-color:var(--accent-text);
  }
  .daytab.active .num{color:var(--accent-text); opacity:1;}
  .daytab:hover{color:var(--ink);}

  .util-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
  }
  .util-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--gold);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    font-size:13px;
    font-weight:700;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    text-decoration:none;
    transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  .util-btn:hover{ transform:translateY(-1px); box-shadow:0 3px 8px rgba(110,134,184,.25); }
  .util-btn.active{
    background:#5A6FA0;
    color:#FFFFFF;
    border-color:#5A6FA0;
  }

  /* ---------- Day page ---------- */
  main{max-width:640px; margin:0 auto; padding:18px 16px 60px;}
  .day-page{display:none;}
  .day-page.active{display:block; animation:fadeIn .4s cubic-bezier(.2,.8,.3,1);}
  @keyframes fadeIn{from{opacity:0; transform:translateY(10px) scale(.995);} to{opacity:1; transform:translateY(0) scale(1);}}

  .day-page.active.slide-next{ animation:slideInFromRight .32s cubic-bezier(.2,.8,.3,1); }
  .day-page.active.slide-prev{ animation:slideInFromLeft .32s cubic-bezier(.2,.8,.3,1); }
  @keyframes slideInFromRight{
    from{ opacity:0; transform:translateX(36px); }
    to{ opacity:1; transform:translateX(0); }
  }
  @keyframes slideInFromLeft{
    from{ opacity:0; transform:translateX(-36px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .day-page.exit-next{ animation:slideOutLeft .18s ease forwards; }
  .day-page.exit-prev{ animation:slideOutRight .18s ease forwards; }
  @keyframes slideOutLeft{
    from{ opacity:1; transform:translateX(0); }
    to{ opacity:0; transform:translateX(-28px); }
  }
  @keyframes slideOutRight{
    from{ opacity:1; transform:translateX(0); }
    to{ opacity:0; transform:translateX(28px); }
  }
  .day-page.shake-boundary{ animation:shakeBoundary .35s ease; }
  @keyframes shakeBoundary{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-10px); }
    50%{ transform:translateX(8px); }
    75%{ transform:translateX(-5px); }
  }

  .day-head{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:12px;
    margin:6px 0 18px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  .day-head .dnum{
    font-family:"Shippori Mincho",serif;
    font-size:34px;
    font-weight:700;
    color:var(--accent-text);
    line-height:1;
  }
  .day-head .dmeta{flex:1; min-width:0;}
  .day-head .ddate{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .day-head .dtitle{
    font-size:19px;
    font-weight:700;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hotel-info{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:#6E5F87;
    margin-top:4px;
  }

  /* day route map */
  .daymap-wrap{ margin:0 0 20px; }
  .daymap-label{
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .daymap{
    height:220px;
    border-radius:14px;
    border:1px solid var(--line);
    overflow:hidden;
    box-shadow:0 1px 2px rgba(35,35,35,.06);
    background:#F0F2F7;
    position:relative;
    isolation:isolate;
    z-index:0;
  }
  #quake-map{ height:400px; }
  .daypin{
    width:24px; height:24px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:11px;
    font-family:"JetBrains Mono",monospace;
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1);
    cursor:pointer;
  }
  .daypin:hover{ transform:scale(1.25); }
  .dayarrow{
    width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    line-height:1;
    text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    pointer-events:none;
  }
  .day-popup{ font-family:"Noto Sans TC",sans-serif; font-size:12.5px; font-weight:600; color:var(--ink); }

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:"";
    position:absolute; left:9px; top:6px; bottom:6px; width:2px;
    background:var(--line);
  }
  .row{position:relative; margin-bottom:16px;}
  .row .dot{
    position:absolute; left:-26px; top:5px;
    width:11px; height:11px; border-radius:50%;
    border:2px solid var(--card);
    box-shadow:0 0 0 1.5px var(--line);
    background:var(--accent);
  }

  .row.row-transit{ margin-bottom:8px; counter-increment:transitleg; }
  .row.row-transit .dot{
    width:16px; height:16px;
    left:-28.5px; top:2px;
    background:var(--card);
    border:2px solid var(--line);
    box-shadow:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .row.row-transit .dot::after{
    content:counter(transitleg);
    font-family:"JetBrains Mono",monospace;
    font-size:8.5px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .transit{
    background:none;
    border:none;
    border-radius:0;
    padding:2px 0;
    box-shadow:none;
    margin-left:2px;
  }
  .transit .leg{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:8px;
    font-size:12.5px;
  }
  .transit .stop{font-weight:600; min-width:0; color:var(--ink-soft);}
  .stop-link{
    color:inherit;
    text-decoration:none;
    border-bottom:1px dotted var(--line);
  }
  .stop-link:hover, .stop-link:active{
    color:var(--accent-text);
    border-bottom-color:var(--accent-text);
  }
  .transit .stop.right{text-align:right;}
  .transit .time{font-family:"JetBrains Mono",monospace; color:var(--ink-soft); font-size:11.5px;}
  .transit .mid{
    position:relative;
    width:48px;
    height:16px;
    flex:0 0 auto;
    overflow:hidden;
  }
  .transit .mid::before{
    content:"";
    position:absolute;
    top:50%; left:0; right:0;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px);
  }
  .transit .mid-icon{
    position:absolute;
    top:50%; left:-14px;
    transform:translateY(-50%);
    font-size:12px;
    animation:midTravel 2.6s linear infinite;
  }
  @keyframes midTravel{
    0%{ left:-14px; opacity:0; }
    12%{ opacity:1; }
    88%{ opacity:1; }
    100%{ left:100%; opacity:0; }
  }
  .transit .meta{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:5px;
  }
  .chip{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    background:#F0F2F7;
    color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .chip.price{color:#6E5F87; border-color:#E0D0E5; background:#F5EFF7;}
  .chip.transfer{color:var(--accent-text); border-color:#c9d3e8; background:#EDF1FA;}
  .line-tag{
    font-size:12px; font-weight:700;
  }

  /* activity card */
  .activity{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:var(--radius);
    padding:12px 14px;
    box-shadow:0 2px 6px rgba(35,35,35,.08), 0 1px 2px rgba(35,35,35,.05);
  }
  .activity.clickable{ cursor:pointer; }
  .activity-head{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .activity .num{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:16px;
    color:var(--accent-text);
    width:20px;
    flex:0 0 auto;
  }
  .activity .ic{font-size:18px; flex:0 0 auto;}
  .activity .txt{font-size:14.5px; font-weight:500; line-height:1.5; flex:1;}
  .activity .txt .time{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-left:6px;
  }
  .chevron{
    flex:0 0 auto;
    color:var(--ink-soft);
    font-size:13px;
    margin-left:4px;
    transition:transform .2s ease;
  }
  .activity.open .chevron{ transform:rotate(180deg); }
  .activity-detail{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .25s ease, opacity .2s ease, margin-top .25s ease;
  }
  .activity.open .activity-detail{
    max-height:640px;
    opacity:1;
    margin-top:10px;
  }
  .activity-detail p{
    margin:0 0 6px;
    font-size:13px;
    line-height:1.6;
    color:var(--ink-soft);
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .activity-detail p.tip{
    color:var(--ink);
    border-top:none;
    padding-top:0;
    margin-bottom:0;
  }
  .activity-detail p.tip::before{
    content:"💡 ";
  }
  .activity-detail p.souvenir{
    color:#6E5F87;
    border-top:1px dashed var(--line);
    margin-top:6px;
    margin-bottom:0;
  }
  .activity-detail p.info-links{
    border-top:1px dashed var(--line);
    padding-top:10px;
    margin-top:6px;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .activity-detail p.info-links .pack-link{ margin-left:0; }
  .maplink{
    display:inline-flex;
    align-items:center;
    gap:3px;
    margin-left:8px;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    font-weight:600;
    color:var(--accent-text);
    background:#EDF1FA;
    border:1px solid #c9d3e8;
    border-radius:999px;
    padding:2px 9px;
    text-decoration:none;
    vertical-align:middle;
  }
  .maplink:hover{background:#DDE5F5;}

  /* note / info card */
  .note{
    background:#F5EFF7;
    border:1px dashed #D8C5E8;
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:13px;
    color:#5A4A70;
  }
  .note b{color:#3D3050;}

  .section-label{
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;
    letter-spacing:.15em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:22px 0 8px 0;
    counter-reset:transitleg;
  }
  .row:first-child .section-label{margin-top:0;}

  @media(max-width:480px){
    .transit .leg{font-size:12.5px;}
    .day-head{ flex-wrap:nowrap; }
    header.hero{ padding:26px 16px 18px; }
    .countdown-wrap.compact{ padding:5px 12px; }
  }

  /* ---------- Bottom mobile nav ---------- */
  .bottom-nav{
    display:none;
    position:fixed;
    left:14px; right:14px; bottom:18px;
    z-index:60;
    height:62px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    box-shadow:0 16px 40px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.2), 0 0 0 1px rgba(255,255,255,.04);
    align-items:stretch;
    overflow:hidden;
  }
  @media(max-width:700px){
    nav.daynav, .util-bar{ display:none; }
    .bottom-nav{ display:flex; }
    body{ padding-bottom:92px; }
    .app-toast{ bottom:96px; }
  }
  .bn-btn{
    flex:0 0 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    background:none;
    border:none;
    color:var(--ink);
    font-size:11px;
    cursor:pointer;
  }
  .bn-btn .bn-icon{
    font-size:16px;
    font-weight:700;
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--paper);
  }
  .bn-btn:active{ background:var(--paper); }
  .bn-btn:disabled{ opacity:.3; }
  .bn-current{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    color:var(--ink);
    cursor:pointer;
    min-width:0;
    padding:0 8px;
  }
  .bn-current-num{
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    color:var(--accent-text);
    font-weight:700;
  }
  .bn-current-theme{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
  }

  .more-sheet{
    display:none;
    position:fixed;
    inset:0;
    z-index:70;
  }
  .more-sheet.open{ display:block; }
  .more-sheet-backdrop{
    position:absolute;
    inset:0;
    background:rgba(15,20,30,.55);
    backdrop-filter:blur(2px);
  }
  .more-sheet-panel{
    position:absolute;
    left:0; right:0; bottom:0;
    max-height:78vh;
    overflow-y:auto;
    background:var(--card);
    border-radius:24px 24px 0 0;
    padding:10px 20px 32px;
    box-shadow:0 -12px 32px rgba(0,0,0,.25);
  }
  .more-sheet-handle{
    width:64px; height:22px;
    margin:2px auto 0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    touch-action:none;
  }
  .more-sheet-handle::after{
    content:"";
    width:40px; height:4px;
    background:var(--line);
    border-radius:999px;
  }
  .more-sheet-handle:active{ cursor:grabbing; }
  .more-sheet-head{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    margin:2px 0 14px;
  }
  .more-sheet-close{
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:15px;
    cursor:pointer;
  }
  .more-sheet-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:"JetBrains Mono",monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:20px 0 12px;
  }
  .more-sheet-title::before{
    content:"";
    width:14px; height:2px;
    background:var(--gold);
    border-radius:2px;
  }
  .more-sheet-title:first-of-type{ margin-top:0; }
  .more-sheet-days{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
  }
  .more-sheet-day{
    display:flex;

    cursor:pointer;

  .more-sheet-day.active{
    border-color:var(--accent);

  .more-sheet-day .n{

    font-weight:700;

  .more-sheet-day[data-branch="tokyo"] .n{ color:#A65D2E; }
  .more-sheet-day .t{ font-size:11.5px; margin-top:6px; line-height:1.3; color:var(--ink-soft); }
  .more-sheet-day.active .t{ color:var(--ink); font-weight:700; }
  .more-sheet-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
  }
  .more-sheet-item{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--gold);
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
    color:var(--ink);
    font-size:12.5px;
    font-weight:700;
    text-decoration:none;
    transition:transform .15s ease, background .15s ease;
  }
  .more-sheet-item:active{ transform:scale(.95); }
  .more-sheet-item:hover{ background:var(--paper); }
  .more-sheet-item .msi-icon{ font-size:14px; line-height:1; }

  /* ---------- Packing list ---------- */
  .pack-progress{
    display:flex; align-items:center; gap:10px;
    margin:0 0 20px;
  }
  .pack-bar{
    flex:1; height:8px; border-radius:999px;
    background:var(--line); overflow:hidden;
  }
  .pack-fill{
    height:100%; width:0%;
    background:var(--accent);
    border-radius:999px;
    transition:width .25s ease;
  }
  .pack-count{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .pack-reset{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 12px;
    cursor:pointer;
  }
  .pack-reset:hover{ border-color:var(--accent); color:var(--accent-text); }

  .pack-group{ margin-bottom:22px; }
  .pack-cat{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .pack-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:9px;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(35,35,35,.08), 0 1px 2px rgba(35,35,35,.05);
    transition:background .15s ease, border-color .15s ease;
  }
  .pack-item:hover{ border-color:var(--gold); }
  .pack-item input[type=checkbox]{
    width:22px; height:22px;
    accent-color:var(--accent);
    flex:0 0 auto;
    cursor:pointer;
  }
  .pack-text{ font-size:14px; }
  .pack-link{
    display:inline-block;
    margin-left:6px;
    font-size:12px;
    font-weight:700;
    color:var(--accent-text);
    text-decoration:underline;
  }
  .pack-item.done{
    background:var(--paper);
    border-color:#2F8F4E;
    opacity:.7;
  }
  .pack-item.done .pack-text{
    color:var(--ink-soft);
    text-decoration:line-through;
  }
  .pack-item.just-checked{ animation: packPop .4s ease; }
  @keyframes packPop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.035); }
    100%{ transform:scale(1); }
  }
  .pack-item.just-checked input[type=checkbox]{ animation: packCheckPop .4s ease; }
  @keyframes packCheckPop{
    0%{ transform:scale(1) rotate(0deg); }
    40%{ transform:scale(1.35) rotate(-8deg); }
    70%{ transform:scale(1.1) rotate(4deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }

  .app-toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%, 16px);
    background:var(--btn-solid);
    color:var(--btn-solid-fg);
    font-size:13px;
    font-weight:700;
    padding:10px 20px;
    border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:300;
  }
  .app-toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }

  .pack-confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:200;
    overflow:hidden;
  }
  .pack-confetti span{
    position:absolute;
    top:35%;
    width:8px; height:8px;
    border-radius:2px;
    opacity:0;
    animation: confettiBurst 1.3s ease-out forwards;
  }
  @keyframes confettiBurst{
    0%{ opacity:1; transform:translate(0,0) rotate(0deg); }
    100%{ opacity:0; transform:translate(var(--dx), 160px) rotate(var(--rot)); }
  }

  /* ---------- Weather ---------- */
  .wx-note{
    font-size:12.5px;
    color:var(--ink-soft);
    background:#F5EFF7;
    border:1px dashed #D8C5E8;
    border-radius:var(--radius);
    padding:10px 14px;
    margin:0 0 20px;
    line-height:1.6;
  }
  .wx-city{ margin-bottom:22px; }
  .wx-city-head{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:15px;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .wx-body{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .wx-loading, .wx-error{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:20px 0;
  }
  .spin-icon{ display:inline-block; animation:spin 1.6s linear infinite; }
  .wx-current{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
    padding-bottom:12px;
    border-bottom:1px dashed var(--line);
  }
  .wx-current .wx-icon{ font-size:28px; display:inline-block; }

  .wx-anim-sun{ animation: wxSpin 9s linear infinite; }
  @keyframes wxSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .wx-anim-cloud, .wx-anim-cloud-sun{ animation: wxDrift 3.5s ease-in-out infinite; }
  @keyframes wxDrift{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(4px); }
  }
  .wx-anim-rain{ animation: wxRainBounce 1.2s ease-in-out infinite; }
  @keyframes wxRainBounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(3px); }
  }
  .wx-anim-storm{ animation: wxFlicker 1.6s ease-in-out infinite; }
  @keyframes wxFlicker{
    0%,100%{ opacity:1; filter:brightness(1); }
    46%{ opacity:1; filter:brightness(1); }
    48%{ opacity:.7; filter:brightness(1.6); }
    50%{ opacity:1; filter:brightness(1); }
    52%{ opacity:.8; filter:brightness(1.4); }
    54%{ opacity:1; filter:brightness(1); }
  }
  .wx-anim-snow{ animation: wxSway 2.4s ease-in-out infinite; }
  @keyframes wxSway{
    0%,100%{ transform:rotate(-8deg) translateY(0); }
    50%{ transform:rotate(8deg) translateY(2px); }
  }
  .wx-current .wx-temp{
    font-family:"JetBrains Mono",monospace;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
  }
  .wx-current .wx-desc{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .wx-pager{
    display:flex;
    align-items:stretch;
    gap:8px;
    margin:14px 0 4px;
  }
  .wx-pager-btn{
    flex:0 0 auto;
    align-self:center;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink);
    font-size:14px;
    font-weight:700;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
  }
  .wx-pager-btn:hover:not(:disabled){ background:var(--paper); }
  .wx-pager-btn:disabled{ opacity:.3; cursor:default; }
  .wx-daycols{
    flex:1;
    min-width:0;
    display:flex;
    gap:8px;
    overflow:hidden;
    justify-content:center;
  }
  .wx-daycol{
    flex:0 0 auto;
    width:84px;
    text-align:center;
    background:#F0F2F7;
    border-radius:12px;
    padding:10px 2px 8px;
  }
  .wx-daycol-label{ font-size:11px; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .wx-p-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:7px 2px;
    border-top:1px solid rgba(0,0,0,.06);
  }
  .wx-p-row:first-of-type{ border-top:none; }
  .wx-p-name{ font-size:9.5px; color:var(--ink-soft); }
  .wx-p-icon{ font-size:18px; display:inline-block; line-height:1.1; }
  .wx-p-temp{ font-size:13px; font-weight:700; color:var(--ink); }
  .wx-p-pop{ font-size:9.5px; color:var(--accent-text); }
  .wx-p-na{ font-size:11px; color:var(--ink-soft); padding:12px 0; }

  /* ---------- Flight info ---------- */
  .flight-day{ margin-bottom:20px; }
  .flight-day-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .flight-date{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
  }
  .flight-note{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:var(--accent-text);
    background:#EDF1FA;
    border:1px solid #c9d3e8;
    border-radius:999px;
    padding:2px 9px;
  }
  .flight-item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .flight-item-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .flight-no{
    font-family:"JetBrains Mono",monospace;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    flex:0 0 auto;
    min-width:64px;
  }
  .flight-airline{ font-size:12.5px; color:var(--ink-soft); flex:1; }
  .flight-pax{
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
    font-weight:700;
    color:var(--accent-text);
    flex:0 0 auto;
  }
  .flight-route{
    display:flex;
    align-items:center;
    gap:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .flight-leg{ flex:1; min-width:0; }
  .flight-leg.right{ text-align:right; }
  .flight-time{
    display:inline-block;
    font-family:"JetBrains Mono",monospace;
    font-size:16px;
    font-weight:700;
    color:#FFB627;
    background:#1A1D22;
    padding:2px 8px;
    border-radius:5px;
    text-shadow:0 0 3px rgba(255,182,39,.5);
    letter-spacing:.02em;
  }
  .flight-airport{
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.4;
    margin-top:4px;
  }
  .flight-arrow{
    flex:0 0 auto;
    width:52px;
    height:16px;
    position:relative;
    overflow:hidden;
  }
  .flight-arrow::before{
    content:"";
    position:absolute;
    top:50%; left:0; right:0;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px);
  }
  .flight-arrow .plane{
    position:absolute;
    top:50%; left:-14px;
    transform:translateY(-50%);
    font-size:13px;
    color:var(--accent-text);
    animation:flyAcross 2.8s linear infinite;
  }
  @keyframes flyAcross{
    0%{ left:-14px; opacity:0; }
    12%{ opacity:1; }
    88%{ opacity:1; }
    100%{ left:100%; opacity:0; }
  }
  .flight-time .flight-tz{
    font-family:"Noto Sans TC",sans-serif;
    font-size:10.5px;
    font-weight:400;
    color:#8A9099;
    text-shadow:none;
    margin-left:5px;
  }
  .flight-link{
    display:block;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-size:12px;
    font-weight:700;
    color:var(--accent-text);
    text-decoration:none;
  }
  .flight-link:hover{ text-decoration:underline; }
  .flight-pending{
    font-size:13px;
    color:var(--ink-soft);
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:12px;
    padding:14px;
    line-height:1.6;
  }

  /* ---------- Driving info ---------- */
  .drv-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .drv-title{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:14.5px;

    border-bottom:1px solid var(--line);
  }
  .drv-list{
    margin:0;
    padding-left:1.2em;
  }
  .drv-list li{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.7;
    margin-bottom:4px;
  }
  .drv-list li b{ color:var(--ink); }

  /* ---------- Contacts ---------- */
  .contact-block{ margin-bottom:22px; }

    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 14px;
    margin-bottom:8px;
    box-shadow:0 2px 6px rgba(35,35,35,.08), 0 1px 2px rgba(35,35,35,.05);
  }
  .contact-name{
    flex:1;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .contact-phone{
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
    color:var(--accent-text);
    text-decoration:none;
    font-weight:600;
  }
  .contact-phone:hover{ text-decoration:underline; }
  .fb-icon{
    flex:0 0 auto;
    width:30px;
    height:30px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#1877F2;
    color:#fff;
    font-family:Georgia,"Times New Roman",serif;

    font-size:16px;

  .lodging-card{

    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
  }

    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;

  .lodging-name{

  .quake-item:active{ transform:scale(.98); }
  .quake-item.selected{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent), 0 4px 12px rgba(110,134,184,.22);

  .quake-item-time{

    min-width:52px;

  .quake-item-place{ font-size:14px; font-weight:700; color:var(--ink); }

  /* ---------- Micro-interactions ---------- */
  .util-btn, .daytab, .cta, .pack-reset, .maplink, .pack-link, .addr-copy-mini, .fb-icon{
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .util-btn:active, .cta:active, .pack-reset:active, .daytab:active, .addr-copy-mini:active, .fb-icon:active{
    transform:scale(.94);
  }
  .maplink:hover, .pack-link:hover{ transform:translateY(-1px); }
  .activity{ transition:box-shadow .2s ease, border-color .2s ease; }
  .activity.clickable:hover{ box-shadow:0 4px 14px rgba(35,35,35,.14), 0 2px 4px rgba(35,35,35,.08); }

  /* ---------- Scroll reveal ---------- */
  .reveal{
    opacity:0;
    transform:translateY(18px);
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.7,.3,1);
  }
  .reveal.revealed{
    opacity:1;
    transform:translateY(0);
  }

function renderRow(item){
  if(item.type==="section"){
    return `<div class="section-label">${item.label}</div>`;
  }
  if(item.type==="note"){
    return `<div class="row"><div class="note">${item.text}</div></div>`;
  }
  if(item.type==="activity"){
    const ic = (TAG[item.tag]||{icon:"・"}).icon;
    const mapUrl = item.map ? (MAP_URL_OVERRIDE[item.map] || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map)}`) : "";
    const mapLink = mapUrl ? `<a class="maplink" href="${mapUrl}" target="_blank" rel="noopener">📍 地圖</a>` : "";
    const info = item.map ? INFO[item.map] : null;
    const detail = info ? `<div class="activity-detail">
        <p>${info.intro}</p>
        <p class="tip">${info.tip}</p>
        ${info.souvenir ? `<p class="souvenir">${info.souvenir}</p>` : ""}
        ${info.links ? `<p class="info-links">${info.links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener" class="pack-link">🔗 ${l.label} →</a>`).join("")}</p>` : ""}
      </div>` : "";
    const clickable = info ? " clickable" : "";
    const chevron = info ? `<span class="chevron">▾</span>` : "";
    return `<div class="row">
      <span class="dot" style="background:var(--accent)"></span>
      <div class="activity${clickable}">
        <div class="activity-head">
          <span class="ic">${ic}</span>
          <div class="txt">${item.text}${item.time? `<span class="time">${item.time}</span>`:""}${mapLink}</div>
          ${chevron}
        </div>
        ${detail}
      </div>
    </div>`;
  }
  // transit
  const m = MODE[item.mode] || MODE.rail;
  const chips = [];
  if(item.price) chips.push(`<span class="chip price">${item.price}</span>`);
  if(item.transfer) chips.push(`<span class="chip transfer">${item.transfer}</span>`);
  const timeFrom = item.ft ? `<span class="time">${item.ft}</span>` : "";
  const timeTo = item.tt ? `<span class="time">${item.tt}</span>` : "";
  const gmapsUrl = (name)=> MAP_URL_OVERRIDE[name] || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
  const fromLink = `<a class="stop-link" href="${gmapsUrl(item.from)}" target="_blank" rel="noopener">${item.from}</a>`;
  const toLink = `<a class="stop-link" href="${gmapsUrl(item.to)}" target="_blank" rel="noopener">${item.to}</a>`;
  return `<div class="row row-transit">
    <span class="dot" style="border-color:${m.color}"></span>
    <div class="transit">
      <div class="leg">
        <span class="stop">${fromLink}${timeFrom? " "+timeFrom : ""}</span>
        <span class="mid"><span class="mid-icon">${m.icon}</span></span>
        <span class="stop right">${toLink}${timeTo? " "+timeTo : ""}</span>
      </div>
      <div class="meta">
        <span class="chip line-tag" style="color:${m.color}">${item.line}</span>
        ${chips.join("")}
      </div>
    </div>
  </div>`;
}

const WMO = {
  0:["☀️","晴朗"],1:["🌤","晴時多雲"],2:["⛅","多雲"],3:["☁️","陰天"],
  45:["🌫","有霧"],48:["🌫","有霧（霜）"],
  51:["🌦","毛毛雨"],53:["🌦","毛毛雨"],55:["🌧","毛毛雨（強）"],
  61:["🌧","小雨"],63:["🌧","中雨"],65:["🌧","大雨"],
  66:["🌧","凍雨"],67:["🌧","凍雨（強）"],
  71:["🌨","小雪"],73:["🌨","中雪"],75:["❄️","大雪"],
  80:["🌦","陣雨"],81:["🌧","陣雨"],82:["⛈","強陣雨"],
  95:["⛈","雷雨"],96:["⛈","雷雨（冰雹）"],99:["⛈","雷雨（強冰雹）"]
};
function wmoInfo(code){ return WMO[code] || ["🌡","—"]; }
function wmoAnimClass(code){
  if(code === 0) return "wx-anim-sun";
  if(code === 1 || code === 2) return "wx-anim-cloud-sun";
  if(code === 3 || code === 45 || code === 48) return "wx-anim-cloud";
  if([95,96,99,82].includes(code)) return "wx-anim-storm";
  if([71,73,75].includes(code)) return "wx-anim-snow";
  if(code >= 51) return "wx-anim-rain";
  return "";
}

const WX_PERIODS = [
  { key:"morning",   label:"上午", hours:[6,7,8,9,10,11] },
  { key:"afternoon", label:"下午", hours:[12,13,14,15,16,17] },
  { key:"evening",   label:"晚上", hours:[18,19,20,21,22,23] }
];
const wxState = {}; // { [cityKey]: { current, days: [...], idx } }

function wxAggregatePeriod(hourly, dayIdx, hours){
  const temps=[], pops=[], codes=[];
  hours.forEach(h=>{
    const idx = dayIdx*24 + h;
    if(hourly.temperature_2m[idx] !== undefined){
      temps.push(hourly.temperature_2m[idx]);
      pops.push(hourly.precipitation_probability[idx]);
      codes.push(hourly.weather_code[idx]);
    }
  });
  if(!temps.length) return null;
  const avgTemp = Math.round(temps.reduce((a,b)=>a+b,0)/temps.length);
  const maxPop = Math.max(...pops);
  const worstCode = Math.max(...codes); // heuristic: higher WMO code ≈ more severe weather
  return { avgTemp, maxPop, worstCode };
}

function wxDayColumnWidth(){ return 92; } // 84px column + 8px gap — matches .wx-daycol width in CSS

function renderWeatherDay(key){
  const state = wxState[key];
  if(!state) return;
  const el = document.getElementById("wx-"+key);
  if(!el) return;

  const containerWidth = el.clientWidth || el.parentElement.clientWidth || 320;
  const PAGER_BTNS_WIDTH = 34*2 + 8*2;
  const daycolsWidth = Math.max(0, containerWidth - PAGER_BTNS_WIDTH);
  const visible = Math.max(1, Math.min(state.days.length, Math.floor(daycolsWidth / wxDayColumnWidth())));
  if(state.idx > state.days.length - visible) state.idx = Math.max(0, state.days.length - visible);

  const slice = state.days.slice(state.idx, state.idx + visible);
  const dayCols = slice.map(day=>{
    const periods = WX_PERIODS.map(p=>{
      const agg = day.periods[p.key];
      if(!agg) return `<div class="wx-p-row"><span class="wx-p-name">${p.label}</span><span class="wx-p-na">－</span></div>`;
      const [icon] = wmoInfo(agg.worstCode);
      const animClass = wmoAnimClass(agg.worstCode);
      return `<div class="wx-p-row">
        <span class="wx-p-name">${p.label}</span>
        <span class="wx-p-icon ${animClass}">${icon}</span>
        <span class="wx-p-temp">${agg.avgTemp}°</span>
        <span class="wx-p-pop mono">${agg.maxPop}%</span>
      </div>`;
    }).join("");
    return `<div class="wx-daycol">
      <div class="wx-daycol-label mono">${day.label}</div>
      ${periods}
    </div>`;
  }).join("");

  el.innerHTML = `
    <div class="wx-current">
      <span class="wx-icon ${wmoAnimClass(state.current.weather_code)}">${wmoInfo(state.current.weather_code)[0]}</span>
      <span class="wx-temp">${Math.round(state.current.temperature_2m)}°C</span>
      <span class="wx-desc">${wmoInfo(state.current.weather_code)[1]}・濕度${state.current.relative_humidity_2m}%</span>
    </div>
    <div class="wx-pager">
      <button type="button" class="wx-pager-btn" data-dir="prev" ${state.idx<=0?"disabled":""}>◀</button>
      <div class="wx-daycols">${dayCols}</div>
      <button type="button" class="wx-pager-btn" data-dir="next" ${state.idx+visible>=state.days.length?"disabled":""}>▶</button>
    </div>
  `;

  el.querySelectorAll(".wx-pager-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const dir = btn.dataset.dir;
      if(dir === "next") state.idx = Math.min(state.days.length - visible, state.idx + visible);
      else state.idx = Math.max(0, state.idx - visible);
      renderWeatherDay(key);
    });
  });
}

window.addEventListener("resize", (()=>{
  let t = null;
  return ()=>{
    clearTimeout(t);
    t = setTimeout(()=>{
      Object.keys(wxState).forEach(key=>{
        if(document.getElementById("wx-"+key)) renderWeatherDay(key);
      });
    }, 200);
  };
})());

async function loadWeather(){
  for(const c of WEATHER_CITIES){
    const el = document.getElementById("wx-"+c.key);
    if(!el || el.dataset.loaded) continue;
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lng}&current=temperature_2m,weather_code,relative_humidity_2m&hourly=temperature_2m,weather_code,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=10`;
      const res = await fetch(url);
      if(!res.ok) throw new Error("fetch failed");
      const data = await res.json();
      el.dataset.loaded = "1";

      const hourly = data.hourly;
      const dayCount = Math.floor(hourly.time.length / 24);
      const days = [];
      for(let d=0; d<dayCount; d++){
        const dateObj = new Date(hourly.time[d*24]);
        const label = (dateObj.getMonth()+1)+"/"+dateObj.getDate();
        const periods = {};
        WX_PERIODS.forEach(p=>{ periods[p.key] = wxAggregatePeriod(hourly, d, p.hours); });
        days.push({ label, periods });
      }

      wxState[c.key] = { current: data.current, days, idx: 0 };
      renderWeatherDay(c.key);
    }catch(err){
      el.innerHTML = `<div class="wx-error">天氣資料載入失敗，請確認網路連線後重新整理頁面。</div>`;
    }
  }
}

const SHINDO_MAP = {
  10:"震度1", 20:"震度2", 30:"震度3", 40:"震度4",
  45:"震度5弱", 50:"震度5強", 55:"震度6弱", 60:"震度6強", 70:"震度7"
};

function shindoColor(scale){
  if(scale >= 55) return "#7A1F1F"; // 震度6弱以上
  if(scale >= 45) return "#A13D2C"; // 震度5弱・5強
  if(scale >= 30) return "#33518A"; // 震度3・4
  return "#8FA3CC"; // 震度1・2
}
function formatQuakeTime(t){
  // P2P quake API time format: "2026/08/05 12:34:56.789" — show "08/05<br>12:34"
  const m = String(t).match(/^\d{4}\/(\d{2}\/\d{2}) (\d{2}:\d{2})/);
  return m ? `${m[1]}<br>${m[2]}` : t;
}

async function loadQuakes(){
  const mapEl = document.getElementById("quake-map");
  if(!mapEl || mapEl.dataset.loaded) return;
  mapEl.dataset.loaded = "1";
  try{
    const res = await fetch("https://api.p2pquake.net/v2/history?codes=551&limit=100");
    if(!res.ok) throw new Error("fetch failed");
    const data = await res.json();

    // bounding box covering this trip's route: Niigata/Nagaoka/Echigo-Yuzawa
    // down through Chichibu/Kawagoe/Tokyo
    const inRoute = (hp)=> hp && typeof hp.latitude==="number" && typeof hp.longitude==="number"
      && hp.latitude >= 35.2 && hp.latitude <= 38.3
      && hp.longitude >= 138.3 && hp.longitude <= 140.3;

    const valid = data.filter(q => inRoute(q.earthquake.hypocenter));
    valid.sort((a,b)=> new Date(b.earthquake.time) - new Date(a.earthquake.time)); // most recent first

    const listEl = document.getElementById("quake-list");
    if(listEl){
      if(!valid.length){
        listEl.innerHTML = `<div class="quake-empty">近期沿線地區沒有偵測到地震資訊。</div>`;
      } else {
        listEl.innerHTML = valid.map((q,i)=>{
          const eq = q.earthquake;
          const hp = eq.hypocenter;
          const color = shindoColor(eq.maxScale);
          const shindo = SHINDO_MAP[eq.maxScale] || "—";
          const tsunami = eq.domesticTsunami && eq.domesticTsunami!=="None" && eq.domesticTsunami!=="Unknown"
            ? `<span class="quake-tsunami">⚠ 有海嘯資訊</span>` : "";
          return `<div class="quake-item" data-idx="${i}" style="--quake-c:${color}">
            <div class="quake-item-time mono">${formatQuakeTime(eq.time)}</div>
            <div class="quake-item-body">
              <div class="quake-item-place">${hp.name}</div>
              <div class="quake-item-meta">最大<span class="quake-item-shindo">${shindo}</span>・M${hp.magnitude}・深度${hp.depth}km ${tsunami}</div>
            </div>
          </div>`;
        }).join("");
      }
    }

    const map = L.map(mapEl, {
      scrollWheelZoom:true, doubleClickZoom:true, touchZoom:true,
      boxZoom:true, keyboard:true, zoomControl:true
    }).setView([36.8, 139.3], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      subdomains: 'abc', maxZoom: 19
    }).addTo(map);

    if(!valid.length){
      return; // no recent quakes along the route — just show the base map
    }

    const latlngs = [];
    const quakeMarkers = [];
    valid.forEach(q=>{
      const eq = q.earthquake;
      const hp = eq.hypocenter;
      const color = shindoColor(eq.maxScale);
      const radius = 6 + Math.max(0, (Number(hp.magnitude)||3) - 3) * 3;
      const shindo = SHINDO_MAP[eq.maxScale] || "—";
      const tsunami = eq.domesticTsunami && eq.domesticTsunami!=="None" && eq.domesticTsunami!=="Unknown"
        ? `<br><span class="quake-tsunami">⚠ 有海嘯資訊</span>` : "";
      const marker = L.circleMarker([hp.latitude, hp.longitude], {
        radius, color, fillColor:color, fillOpacity:0.55, weight:2
      }).addTo(map).bindPopup(
        `<span class="day-popup">${hp.name}<br>最大${shindo}・M${hp.magnitude}，深度${hp.depth}km<br>${eq.time}${tsunami}</span>`
      );
      quakeMarkers.push(marker);
      latlngs.push([hp.latitude, hp.longitude]);
    });
    if(latlngs.length > 1) map.fitBounds(latlngs, {padding:[24,24]});

    if(listEl){
      listEl.addEventListener("click", (e)=>{
        const item = e.target.closest(".quake-item");
        if(!item) return;
        const idx = Number(item.dataset.idx);
        const marker = quakeMarkers[idx];
        if(!marker) return;
        map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 9), { duration:0.6 });
        setTimeout(()=> marker.openPopup(), 620);
        document.querySelectorAll(".quake-item.selected").forEach(el=>el.classList.remove("selected"));
        item.classList.add("selected");
      });
    }
  }catch(err){
    mapEl.innerHTML = `<div class="wx-error">地震資料載入失敗，請確認網路連線後重新整理頁面。</div>`;
  }
}

(function initScrollReveal(){
  const selector = ".row, .pack-item";
  const els = document.querySelectorAll(selector);
  if(!("IntersectionObserver" in window)){
    els.forEach(el=>el.classList.add("revealed"));
    return;
  }
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("revealed");
        observer.unobserve(entry.target);
      }
    });
  }, {threshold:0.12, rootMargin:"0px 0px -30px 0px"});
  els.forEach(el=>{
    el.classList.add("reveal");
    observer.observe(el);
  });
})();

function dayStops(day){
  const stops = [];
  const push = (name)=>{
    const c = COORDS[name];
    if(!c) return;
    const last = stops[stops.length-1];
    if(last){
      const dLat = last.lat - c[0], dLng = last.lng - c[1];
      const closeEnough = Math.sqrt(dLat*dLat + dLng*dLng) < 0.003; // ~300m
      if(last.name===name || closeEnough) return;
    }
    stops.push({name, lat:c[0], lng:c[1]});
  };
  day.items.forEach(item=>{
    if(item.type==="transit"){ push(item.from); push(item.to); }
    else if(item.type==="activity" && item.map){ push(item.map); }
  });
  return stops;
}

const dayMaps = {}; // idx -> leaflet map instance

function buildDayMap(idx){
  if(dayMaps[idx]) { dayMaps[idx].invalidateSize(); return; }
  const el = document.getElementById("daymap-"+idx);
  if(!el) return;
  const stops = dayStops(days[idx]);
  if(stops.length < 2){ el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:12px;">（無足夠地點資料）</div>`; return; }

  const seen = {};
  stops.forEach(s=>{
    const key = s.lat.toFixed(4)+","+s.lng.toFixed(4);
    const count = seen[key] || 0;
    seen[key] = count + 1;
    if(count > 0){
      const angle = count * 2.4;
      const radius = 0.0007 * count;
      s.lat += radius * Math.cos(angle);
      s.lng += radius * Math.sin(angle) / Math.cos(s.lat * Math.PI/180);
    }
  });

  const isTokyoLeg = idx >= 6;
  const color = isTokyoLeg ? "#A65D2E" : "#33518A";

  const map = L.map(el, {
    scrollWheelZoom:true,
    doubleClickZoom:true,
    touchZoom:true,
    boxZoom:true,
    keyboard:true,
    zoomControl:true
  }).setView([stops[0].lat, stops[0].lng], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    subdomains: 'abc', maxZoom: 19
  }).addTo(map);

  const latlngs = stops.map(s=>[s.lat,s.lng]);

  stops.forEach((s,i)=>{
    const isStart = i===0, isEnd = i===stops.length-1;
    const ring = isStart ? "0 0 0 3px #2F8F4E, 0 1px 4px rgba(0,0,0,.35)" : isEnd ? "0 0 0 3px #8C7FB0, 0 1px 4px rgba(0,0,0,.35)" : "0 1px 4px rgba(0,0,0,.35)";
    const size = (isStart||isEnd) ? 28 : 24;
    const icon = L.divIcon({
      className:"",
      html:`<div class="daypin" style="background:${color};width:${size}px;height:${size}px;box-shadow:${ring}">${isStart?"起":isEnd?"終":i+1}</div>`,
      iconSize:[size,size], iconAnchor:[size/2,size/2]
    });
    const label = isStart ? `起點：${s.name}` : isEnd ? `終點：${s.name}` : `${i+1}. ${s.name}`;
    L.marker([s.lat,s.lng], {icon}).addTo(map).bindPopup(`<span class="day-popup">${label}</span>`);
  });

  for(let i=0;i<stops.length-1;i++){
    const a = stops[i], b = stops[i+1];
    const midLat = (a.lat+b.lat)/2, midLng = (a.lng+b.lng)/2;
    const angle = Math.atan2(b.lng-a.lng, b.lat-a.lat) * 180/Math.PI;
    const arrowIcon = L.divIcon({
      className:"",
      html:`<div class="dayarrow" style="color:${color};transform:rotate(${angle}deg)">▲</div>`,
      iconSize:[16,16], iconAnchor:[8,8]
    });
    L.marker([midLat,midLng], {icon:arrowIcon, interactive:false}).addTo(map);
  }

  for(let i=0;i<stops.length-1;i++){
    const a = stops[i], b = stops[i+1];
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], {color, weight:3, opacity:0.85}).addTo(map);
  }

  map.fitBounds(latlngs, {padding:[24,24]});

  dayMaps[idx] = map;
}

const EXTRA_PAGES = ["contacts","flights","driving","weather","quake","packing"];
const EXTRA_PAGE_META = {
  contacts: {icon:"📇", label:"聯絡資訊"},
  flights:  {icon:"✈️", label:"航班資訊"},
  driving:  {icon:"🚗", label:"租車自駕"},
  weather:  {icon:"🌤", label:"天氣預報"},
  quake:    {icon:"🌏", label:"地震資訊"},
  packing:  {icon:"🧳", label:"行李清單"}
};

// ---- Bottom mobile nav + "more" sheet ----
function buildMoreSheet(){
  const dayGrid = days.map((d,i)=>`
    <div class="more-sheet-day" data-page="${i}" ${i>=6?'data-branch="tokyo"':""}>
      <div class="n mono">${String(i+1).padStart(2,"0")}</div>
      <div class="t">${d.theme}</div>
    </div>`).join("");
  const itemGrid = EXTRA_PAGES.map(p=>`
    <div class="more-sheet-item" data-page="${p}">
      <span class="msi-icon">${EXTRA_PAGE_META[p].icon}</span>
      <span>${EXTRA_PAGE_META[p].label}</span>
    </div>`).join("") + `
    <a class="more-sheet-item" href="https://jschang0512.github.io/splitbill/" target="_blank" rel="noopener">
      <span class="msi-icon">💰</span>
      <span>旅費分帳</span>
    </a>`;
  document.getElementById("moreSheetDays").innerHTML = dayGrid;
  document.getElementById("moreSheetGrid").innerHTML = itemGrid;
}

function openMoreSheet(){ document.getElementById("moreSheet").classList.add("open"); }
function closeMoreSheet(){ document.getElementById("moreSheet").classList.remove("open"); }

(function initSheetDrag(){
  const panel = document.querySelector(".more-sheet-panel");
  const handle = document.querySelector(".more-sheet-handle");
  if(!panel || !handle) return;
  let startY = 0, dragY = 0, dragging = false;

  function start(y){ dragging = true; startY = y; panel.style.transition = "none"; }
  function move(y){
    if(!dragging) return;
    dragY = Math.max(0, y - startY);
    panel.style.transform = `translateY(${dragY}px)`;
  }
  function end(){
    if(!dragging) return;
    dragging = false;
    panel.style.transition = "transform .25s ease";
    if(dragY > 90){
      panel.style.transform = "translateY(100%)";
      setTimeout(()=>{ closeMoreSheet(); panel.style.transform = ""; }, 200);
    } else {
      panel.style.transform = "";
    }
    dragY = 0;
  }

  handle.addEventListener("touchstart", e=>start(e.touches[0].clientY), {passive:true});
  handle.addEventListener("touchmove", e=>move(e.touches[0].clientY), {passive:true});
  handle.addEventListener("touchend", end);
  handle.addEventListener("mousedown", e=>{
    start(e.clientY);
    const onMove = ev=>move(ev.clientY);
    const onUp = ()=>{ end(); document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
})();
document.getElementById("moreSheetClose").addEventListener("click", closeMoreSheet);

function updateBottomNav(page, isExtra){
  const numEl = document.getElementById("bnCurrentNum");
  const themeEl = document.getElementById("bnCurrentTheme");
  const prevBtn = document.getElementById("bnPrev");
  const nextBtn = document.getElementById("bnNext");
  if(!numEl) return;
  if(isExtra){
    numEl.textContent = "EXTRA";
    themeEl.textContent = EXTRA_PAGE_META[page].icon + " " + EXTRA_PAGE_META[page].label;
    prevBtn.disabled = true;
    nextBtn.disabled = true;
  } else {
    const idx = Number(page);
    numEl.textContent = "DAY " + String(idx+1).padStart(2,"0");
    themeEl.textContent = days[idx].theme;
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= days.length-1;
  }
  document.querySelectorAll(".more-sheet-day").forEach(d=>{
    d.classList.toggle("active", !isExtra && d.dataset.page === page);
  });
}

document.getElementById("bnPrev").addEventListener("click", ()=>{
  const btn = document.querySelector(".daytab.active");
  if(!btn) return;
  const idx = Number(btn.dataset.page);
  if(idx > 0) switchDayWithTransition(String(idx-1), "prev");
});
document.getElementById("bnNext").addEventListener("click", ()=>{
  const btn = document.querySelector(".daytab.active");
  if(!btn) return;
  const idx = Number(btn.dataset.page);
  if(idx < days.length-1) switchDayWithTransition(String(idx+1), "next");
});
document.getElementById("bnCurrent").addEventListener("click", ()=>{ buildMoreSheet(); openMoreSheet(); });
document.getElementById("bnMore").addEventListener("click", ()=>{ buildMoreSheet(); openMoreSheet(); });
document.getElementById("moreSheetBackdrop").addEventListener("click", closeMoreSheet);
document.getElementById("moreSheet").addEventListener("click", (e)=>{
  const dayCard = e.target.closest(".more-sheet-day");
  const itemCard = e.target.closest(".more-sheet-item");
  if(dayCard){ activatePage(dayCard.dataset.page); closeMoreSheet(); }
  else if(itemCard){ activatePage(itemCard.dataset.page); closeMoreSheet(); }
});

function activatePage(page, {jump=true, dir=null}={}){
  const isExtra = EXTRA_PAGES.includes(page);
  const btn = isExtra ? document.querySelector(`.util-btn[data-page="${page}"]`)
                       : document.querySelector(`.daytab[data-page="${page}"]`);
  const el = (page==="packing") ? document.getElementById("page-packing")
           : (page==="weather") ? document.getElementById("page-weather")
           : (page==="flights") ? document.getElementById("page-flights")
           : (page==="driving") ? document.getElementById("page-driving")
           : (page==="contacts") ? document.getElementById("page-contacts")
           : (page==="quake") ? document.getElementById("page-quake")
           : document.getElementById("day-"+page);
  if(!btn || !el) return;
  document.querySelectorAll(".daytab").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".util-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".day-page").forEach(p=>p.classList.remove("active","slide-next","slide-prev","exit-next","exit-prev"));
  btn.classList.add("active");
  el.classList.add("active");
  el.querySelectorAll(".reveal:not(.revealed)").forEach(r=>r.classList.add("revealed"));
  if(dir === "next") el.classList.add("slide-next");
  else if(dir === "prev") el.classList.add("slide-prev");
  updateBottomNav(page, isExtra);

  if(page==="weather") loadWeather();
  else if(page==="quake") loadQuakes();
  else if(!isExtra) buildDayMap(Number(page));

  if(!isExtra) btn.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
  if(jump) window.scrollTo({top:0, behavior:"smooth"});
}

function switchDayWithTransition(newPage, dir){
  const current = document.querySelector(".day-page.active");
  if(current && dir){
    current.classList.add(dir === "next" ? "exit-next" : "exit-prev");
    setTimeout(()=>{ activatePage(newPage, {dir}); }, 160);
  } else {
    activatePage(newPage, {dir});
  }
}

document.getElementById("dayNav").addEventListener("click",(e)=>{
  const btn = e.target.closest(".daytab");
  if(!btn) return;
  activatePage(btn.dataset.page);
});

document.getElementById("utilBar").addEventListener("click",(e)=>{
  const btn = e.target.closest(".util-btn");
  if(!btn) return;
  activatePage(btn.dataset.page);
});

// ---- Packing list persistence ----
const PACK_KEY = "joetsu-packing-v1";
function loadPackState(){
  try{ return JSON.parse(localStorage.getItem(PACK_KEY)) || {}; }catch(e){ return {}; }
}
function savePackState(state){
  try{ localStorage.setItem(PACK_KEY, JSON.stringify(state)); }catch(e){}
}
function refreshPackProgress(){
  const boxes = document.querySelectorAll("#page-packing input[type=checkbox]");
  const total = boxes.length;
  const checked = document.querySelectorAll("#page-packing input[type=checkbox]:checked").length;
  const fill = document.getElementById("packFill");
  const count = document.getElementById("packCount");
  if(fill) fill.style.width = (total? (checked/total*100) : 0) + "%";
  if(count) count.textContent = checked + " / " + total;
  if(total > 0 && checked === total){
    packCelebrate();
  } else {
    packUncelebrate();
  }
}

let packCelebrated = false;
let toastTimer = null;
function showToast(msg){
  let el = document.getElementById("appToast");
  if(!el){
    el = document.createElement("div");
    el.id = "appToast";
    el.className = "app-toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.classList.remove("show"); }, 1600);
}

function fireConfetti(originYPercent){
  const colors = ["#6E86B8","#D9A73B","#33518A","#F0DDB0"];
  const container = document.createElement("div");
  container.className = "pack-confetti";
  for(let i=0;i<28;i++){
    const bit = document.createElement("span");
    bit.style.left = (45 + Math.random()*10) + "%";
    bit.style.top = (originYPercent || 35) + "%";
    bit.style.background = colors[i % colors.length];
    bit.style.animationDelay = (Math.random()*0.15) + "s";
    bit.style.setProperty("--dx", (Math.random()*220-110) + "px");
    bit.style.setProperty("--rot", (Math.random()*520-260) + "deg");
    container.appendChild(bit);
  }
  document.body.appendChild(container);
  setTimeout(()=>{ container.remove(); }, 1600);
}
function packCelebrate(){
  if(packCelebrated) return;
  packCelebrated = true;
  fireConfetti(35);
}
function packUncelebrate(){ packCelebrated = false; }

(function initAddrCopy(){
  document.querySelectorAll(".addr-copy-mini").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const text = btn.dataset.val || "";
      const done = ()=>{
        btn.textContent = "✓";
        btn.classList.add("copied");
        showToast("已複製");
        setTimeout(()=>{ btn.textContent = "📋"; btn.classList.remove("copied"); }, 1400);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(()=>{
          const ta = document.createElement("textarea");
          ta.value = text; document.body.appendChild(ta); ta.select();
          try{ document.execCommand("copy"); done(); }catch(err){}
          document.body.removeChild(ta);
        });
      } else {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); done(); }catch(err){}
        document.body.removeChild(ta);
      }
    });
  });
})();

(function initPacking(){
  const state = loadPackState();
  document.querySelectorAll("#page-packing input[type=checkbox]").forEach(box=>{
    const key = box.dataset.key;
    if(state[key]) box.checked = true;
    box.addEventListener("change", ()=>{
      const s = loadPackState();
      s[key] = box.checked;
      savePackState(s);
      const item = box.closest(".pack-item");
      item.classList.toggle("done", box.checked);
      if(box.checked){
        item.classList.remove("just-checked");
        void item.offsetWidth;
        item.classList.add("just-checked");
      }
      refreshPackProgress();
    });
    if(box.checked) box.closest(".pack-item").classList.add("done");
  });
  document.querySelectorAll("#page-packing .pack-link").forEach(a=>{
    a.addEventListener("click", e=>e.stopPropagation());
  });
  refreshPackProgress();
  const resetBtn = document.getElementById("packReset");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    savePackState({});
    document.querySelectorAll("#page-packing input[type=checkbox]").forEach(box=>{
      box.checked = false;
      box.closest(".pack-item").classList.remove("done");
    });
    refreshPackProgress();
  });
})();

function pageFromHash(){
  const m = location.hash.match(/day-(\d+)/);
  if(location.hash === "#packing") return "packing";
  if(location.hash === "#weather") return "weather";
  if(location.hash === "#flights") return "flights";
  if(location.hash === "#driving") return "driving";
  if(location.hash === "#contacts") return "contacts";
  if(location.hash === "#quake") return "quake";
  return m ? m[1] : 0;
}
activatePage(pageFromHash(), {jump:false});
window.addEventListener("hashchange", ()=> activatePage(pageFromHash()));

// swipe left/right anywhere on the page to switch days
(function initSwipeDays(){
  const target = document.getElementById("main");
  if(!target) return;
  let startX = 0, startY = 0, tracking = false;

  target.addEventListener("touchstart", (e)=>{
    if(e.target.closest(".leaflet-container")) { tracking = false; return; }
    if(e.touches.length !== 1) { tracking = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive:true });

  target.addEventListener("touchend", (e)=>{
    if(!tracking) return;
    tracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;

    const activeTab = document.querySelector(".daytab.active");
    if(!activeTab) return;
    const idx = Number(activeTab.dataset.page);
    if(dx < 0 && idx < days.length - 1) switchDayWithTransition(String(idx + 1), "next");
    else if(dx > 0 && idx > 0) switchDayWithTransition(String(idx - 1), "prev");
    else if(dx < 0 || dx > 0) shakeBoundary();
  }, { passive:true });
})();

function shakeBoundary(){
  const current = document.querySelector(".day-page.active");
  if(!current) return;
  current.classList.remove("shake-boundary");
  void current.offsetWidth;
  current.classList.add("shake-boundary");
}
