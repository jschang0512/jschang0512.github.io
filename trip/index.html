<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/trip/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/trip/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/trip/icons/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<title>行程總覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* modern — same palette, type and cards as the trip pages (engine/modern.css) */
  :root {
    color-scheme: light;
    --paper: #F5F6F8; --card: #FFFFFF; --ink: #15181D; --ink-soft: #5E6570; --ink-faint: #8A919C;
    --line: #E3E6EB; --hair: #EDEFF2; --fill: #F0F2F5;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 2px 10px rgba(16, 24, 40, .04);
    --shadow-up: 0 2px 4px rgba(16, 24, 40, .05), 0 12px 32px rgba(16, 24, 40, .09);
    --font: "Inter", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); overflow-x: clip; }
  body { color: var(--ink); font-family: var(--font); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  ::selection { background: #DCE3F0; }

  header { max-width: 640px; margin: 0 auto; padding: 40px 16px 4px; }
  .eyebrow { color: var(--ink-faint); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin-top: 4px; font-weight: 700; font-size: clamp(30px, 8vw, 42px); line-height: 1.15; letter-spacing: -.01em; }
  .lead { margin-top: 6px; color: var(--ink-soft); font-size: 15px; }

  main { max-width: 640px; margin: 0 auto; padding: 8px 16px 40px; }
  .group-label { margin: 26px 0 10px; color: var(--ink-soft); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; }
  .group-label[hidden] { display: none; }
  .trips { display: grid; gap: 14px; }

  /* each card: a cover with the destination set large in the trip's colour, then the facts */
  .trip-card {
    --c: #33518A;
    display: block; color: var(--ink); text-decoration: none; background: var(--card);
    border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow);
    transition: transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .trip-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); }
  .trip-card:active { transform: translateY(0); }
  .trip-cover {
    position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    min-height: 118px; padding: 16px 18px; overflow: hidden;
    background: color-mix(in srgb, var(--c) 9%, #FFFFFF); border-bottom: 1px solid color-mix(in srgb, var(--c) 14%, #FFFFFF);
  }
  .trip-place { color: var(--c); font-size: clamp(34px, 11vw, 52px); font-weight: 700; line-height: .95; letter-spacing: -.03em; text-transform: uppercase; overflow-wrap: anywhere; min-width: 0; }
  .trip-len { flex: none; text-align: right; color: var(--c); line-height: 1.1; }
  .trip-len b { display: block; font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .trip-len span { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  .trip-body { padding: 14px 18px 16px; }
  .trip-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .trip-tags:empty { display: none; }
  .tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--fill); color: var(--ink-soft); }
  .tag.status { background: var(--c); color: #FFFFFF; }
  .tag.draft { background: #FFF4DC; color: #8A5A00; }
  .trip-card.past .tag.status { background: var(--fill); color: var(--ink-soft); }
  .trip-title { font-size: 21px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
  .trip-dates { margin-top: 2px; font-size: 14.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .trip-route { margin-top: 2px; color: var(--ink-soft); font-size: 14px; }
  /* the whole card is the link: the call to action is a quiet line */
  .trip-cta { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); color: var(--c); font-size: 14px; font-weight: 600; }
  .trip-cta .arrow { display: inline-block; transition: transform .3s var(--ease); }
  .trip-card:hover .trip-cta .arrow { transform: translateX(4px); }
  .trip-card.past .trip-cover { filter: saturate(.55); }

  @media (max-width: 600px) {
    header { padding: 28px 16px 0; }
    .trip-cover { min-height: 104px; padding: 14px 16px; }
    .trip-body { padding: 12px 16px 14px; }
    .trip-title { font-size: 19px; }
  }

  /* computers: a wider page, trips two across */
  @media (min-width: 900px) {
    header, main { max-width: 1040px; }
    header { padding: 56px 24px 4px; }
    main { padding: 8px 24px 56px; }
    .trips { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
    .trip-cover { min-height: 140px; }
    /* a trip alone in its group spans the row: cover on the left, facts on the right */
    .trips > .trip-card:only-child { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
    .trips > .trip-card:only-child .trip-cover { min-height: 0; border-bottom: 0; border-right: 1px solid color-mix(in srgb, var(--c) 14%, #FFFFFF); padding: 22px 24px; }
    .trips > .trip-card:only-child .trip-body { display: flex; flex-direction: column; padding: 22px 26px; }
    .trips > .trip-card:only-child .trip-title { font-size: 23px; }
    .trips > .trip-card:only-child .trip-cta { margin-top: auto; }
  }

  footer { padding: 8px 16px 32px; color: var(--ink-faint); font-size: 13px; text-align: center; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .trip-card:hover, .trip-card:active, .trip-card:hover .trip-cta .arrow { transform: none; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Trips</div>
  <h1>行程總覽</h1>
  <p class="lead">選一趟旅行，看每天的安排</p>
</header>

<main>
  <!-- data-start / data-end drive the order and the status tag; data-place is the cover word, --c the trip's colour (its theme.css --accent-text) -->
  <div class="group-label" id="upcomingLabel">即將出發</div>
  <div class="trips" id="upcoming">
    <a class="trip-card" href="niigata/schedule.html" data-start="2027-07-30" data-end="2027-08-09" data-place="Joetsu" style="--c:#33518A">
      <div class="trip-body">
        <div class="trip-tags"><span class="tag draft">尚未定案</span></div>
        <div class="trip-title">上越行程表（暫）</div>
        <div class="trip-dates">2027年07月30日 – 08月09日・11 天</div>
        <div class="trip-route">新潟・長岡花火・越後湯澤・秩父・川越・東京</div>
        <span class="trip-cta">查看行程 →</span>
      </div>
    </a>
  </div>

  <div class="group-label" id="pastLabel">已結束</div>
  <div class="trips" id="past">
    <a class="trip-card" href="fukuoka/schedule.html" data-start="2026-08-18" data-end="2026-08-25" data-place="Kyushu" style="--c:#C2445F">
      <div class="trip-body">
        <div class="trip-tags"></div>
        <div class="trip-title">九州行程表</div>
        <div class="trip-dates">2026年08月18日 – 08月25日・8 天</div>
        <div class="trip-route">福岡・北九州・相島・太宰府・唐津・佐賀</div>
        <span class="trip-cta">回顧行程 →</span>
      </div>
    </a>
  </div>
</main>

<footer>旅行紀錄</footer>

<script>
// Each card gets a cover (place + number of days); trips are sorted by date, finished ones under 「已結束」
(function trips(){
  const DAY = 86400000;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const d = (s) => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const up = document.getElementById("upcoming"), past = document.getElementById("past");
  const cards = [...document.querySelectorAll(".trip-card[data-start]")];
  cards.forEach((c) => {
    const start = d(c.dataset.start), end = d(c.dataset.end);
    const len = Math.round((end - start) / DAY) + 1;
    const cover = document.createElement("div");
    cover.className = "trip-cover";
    cover.setAttribute("aria-hidden", "true");
    cover.innerHTML = `<div class="trip-place"></div><div class="trip-len"><b>${len}</b><span>days</span></div>`;
    cover.querySelector(".trip-place").textContent = c.dataset.place || "";
    c.prepend(cover);
    const tag = document.createElement("span");
    tag.className = "tag status";
    const cta = c.querySelector(".trip-cta");
    if (end < now) {
      c.classList.add("past");
      tag.textContent = "已結束";
      cta.innerHTML = '回顧行程 <span class="arrow">→</span>';
    } else {
      c.classList.remove("past");
      const days = Math.round((start - now) / DAY);
      tag.textContent = start <= now ? "旅行中" : days === 1 ? "明天出發" : `${days} 天後出發`;
      cta.innerHTML = '查看行程 <span class="arrow">→</span>';
    }
    c.querySelector(".trip-tags").prepend(tag);
  });
  cards.filter((c) => !c.classList.contains("past"))
    .sort((a, b) => d(a.dataset.start) - d(b.dataset.start)).forEach((c) => up.appendChild(c));
  cards.filter((c) => c.classList.contains("past"))
    .sort((a, b) => d(b.dataset.end) - d(a.dataset.end)).forEach((c) => past.appendChild(c));
  document.getElementById("upcomingLabel").hidden = !up.children.length;
  document.getElementById("pastLabel").hidden = !past.children.length;
})();
</script>
</body>
</html>
