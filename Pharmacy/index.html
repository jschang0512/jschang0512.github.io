<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>調劑台複習</title>
<meta name="description" content="調劑台藥品分類複習與覆核 SOP，通勤時間隨手複習用">

<!-- PWA / TWA 必要 meta 與 manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F6B4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="調劑台複習">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand-row">
      <div class="brand"><span class="mark">Rx</span>調劑台複習</div>
      <div class="subtitle mono" id="clockNote">通勤複習</div>
    </div>
    <div class="searchbar" id="searchWrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="搜尋商品名／學名／分類…" autocomplete="off">
      <span class="count mono" id="searchCount"></span>
    </div>
  </header>

  <main>
    <section class="view" id="view-browse"></section>
    <section class="view" id="view-review"></section>
    <section class="view" id="view-sop"></section>
  </main>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="browse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
      <span class="lbl">藥品總覽</span>
    </button>
    <button class="tab-btn" data-tab="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="12" height="16" rx="2" transform="rotate(-8 10 11)"/><rect x="8" y="5" width="12" height="16" rx="2" fill="var(--surface)"/></svg>
      <span class="lbl">複習卡</span>
    </button>
    <button class="tab-btn" data-tab="sop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
      <span class="lbl">覆核 SOP</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="detail-sheet" id="detailSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
