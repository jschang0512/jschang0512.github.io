  .step-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  /* exclusions inside a group sit indented between the two boxes they connect */
  .grp-ex { margin: 2px 0 8px 12px; padding: 4px 0 4px 10px; border-left: 1px solid var(--border); }
  .grp-ex .lbl { margin-bottom: 4px; }
  .sub-split { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
  .sub-blk { margin: 6px 0 6px 12px; padding: 6px 0 6px 10px; border-left: 1px solid var(--border); }
  .sub-blk .block-head { margin-bottom: 4px; }

<body>
<header class="topbar">
  <a class="back" href="../index.html" data-en="← Home">← 工具首頁</a>
  <h1>Cohort Patient Selection Flowchart</h1>
  <span class="sub" data-en="Patient selection flow for cohort studies">世代研究病人選取流程圖</span>
  <span class="spacer"></span>
  <div class="btns">
    <button class="small" id="btnUndo" title="復原 (Ctrl+Z)" data-en-title="Undo (Ctrl+Z)">↶</button>
    <button class="small" id="btnRedo" title="重做 (Ctrl+Y)" data-en-title="Redo (Ctrl+Y)">↷</button>
    <button class="small" id="btnSaveJson" title="下載 .json，之後可再開啟或傳給共同作者" data-en-title="Download a .json file to reopen later or share with co-authors" data-en="Save project">儲存專案</button>
    <button class="small" id="btnLoadJson" title="匯入先前儲存的 .json 專案檔，還原所有輸入" data-en-title="Import a previously saved .json project file" data-en="Import project">匯入專案</button>
    <button class="small" id="btnExample" data-en="Example">範例</button>
    <button class="small" id="btnReset" data-en="Clear">清空</button>
  </div>
</header>

<main class="tool">
  <section id="form">
    <div class="card">
      <h2><span class="step-no">1</span> <span data-en="Source population">起始族群</span></h2>
      <div class="list-row wide" style="grid-template-columns:minmax(0,1fr) 110px">
        <textarea data-k="start.text" rows="2" placeholder="例：Patients in the NHIRD, 2010–2020" data-en-ph="e.g. Patients in the NHIRD, 2010–2020"></textarea>
        <input class="n" data-k="start.n" inputmode="numeric" placeholder="n">
      </div>
    </div>

    <div class="card">
      <h2><span class="step-no">2</span> <span data-en="Selection steps (top to bottom)">篩選步驟（由上往下）</span></h2>
      <p class="hint" data-en="Remaining n left blank is calculated (<span style='color:var(--accent);font-style:italic'>blue italics</span>). With no exclusion reasons only an arrow is drawn.">剩餘人數留空會自動計算（<span style="color:var(--accent);font-style:italic">藍色斜體</span>）。沒有排除原因時只畫箭頭。</p>
      <div id="steps"></div>
      <button class="small" id="addStep" data-en="+ Add step">＋ 新增步驟</button>
    </div>

    <div class="card">
      <h2><span class="step-no">3</span> <span data-en="Groups (optional)">分組（選填）</span></h2>
      <p class="hint" data-en="Final groups (e.g. exposed / comparator); each group can have several boxes.">最後的組別（例如暴露組／對照組），每組可加多層方框。</p>
      <div id="groups"></div>
      <button class="small" id="addGroup" data-en="+ Add group">＋ 新增組別</button>
    </div>

    <div class="card">
      <details>
        <summary><span class="step-no" style="display:inline-grid">4</span> <span data-en="Appearance">外觀：字型、顏色、線條、間距</span></summary>
        <div class="grid3">
          <label class="field"><span data-en="Main box width">主方框寬</span><input type="number" data-k="boxW" min="120" max="600" step="10"></label>
          <label class="field"><span data-en="Exclusion box width">排除框寬</span><input type="number" data-k="exW" min="120" max="600" step="10"></label>
          <label class="field"><span data-en="Group box width">組別方框寬</span><input type="number" data-k="groupW" min="80" max="500" step="10"></label>
        </div>
        <div id="styleFields"></div>
        <div class="grid3">
          <label class="field"><span data-en="Exclusion fill">排除框填色</span><input type="color" data-k="exFill" style="width:100%"></label>
          <label class="field"><span data-en="Group fill">組別填色</span><input type="color" data-k="grpFill" style="width:100%"></label>
          <label class="field"><span data-en="Excl. text size">排除框字級</span><input type="number" data-k="exSize" min="6" max="30" step="0.5"></label>
        </div>
        <div class="grid2">
          <label class="field"><span data-en="n format">n 顯示格式</span><select data-k="nStyle">
            <option value="paren">(n = 1,234)</option><option value="tight">(n=1,234)</option>
            <option value="plain">n = 1,234</option><option value="N">(N = 1,234)</option></select></label>
          <label class="field"><span data-en="n position">n 位置</span><select data-k="nBreak"><option value="1" data-en="New line">另起一行</option><option value="0" data-en="After text">接在文字後</option></select></label>
          <label class="field"><span data-en="Default exclusion side">排除框預設位置</span><select data-k="exSide"><option value="right" data-en="Right">右側</option><option value="left" data-en="Left">左側</option></select></label>
          <label class="field"><span data-en="Bullet symbol">項目符號</span><select data-k="bullet"><option value="• ">•</option><option value="- ">-</option><option value="– ">–</option><option value="" data-en="None">無</option><option value="num" data-en="1. 2. 3.">1. 2. 3.</option></select></label>
        </div>
        <label class="check"><input type="checkbox" data-k="comma"> <span data-en="Thousands separator">數字加千分位逗號</span></label>
        <label class="check"><input type="checkbox" data-k="exTotal"> <span data-en="Show total excluded in exclusion title">排除框標題顯示排除總數</span></label>
        <label class="check"><input type="checkbox" data-k="exTitleBold"> <span data-en="Bold exclusion title">排除框標題粗體</span></label>
        <label class="check"><input type="checkbox" data-k="boldMain"> <span data-en="Bold main box text">主方框文字粗體</span></label>
        <label class="field"><span data-en="Footnote (optional)">註腳（選填）</span><textarea data-k="footnote" rows="2"></textarea></label>
      </details>
    </div>
    <div class="card" id="refs"></div>
  </section>

  <section class="preview-col">
    <div class="paper" id="preview"></div>
    <div class="msgs" id="msgs"></div>
    <div class="card" id="export"></div>
  </section>
</main>

<script src="../shared/common.js?v=20261025g"></script>
<script>
const T = RT.t;
const KEY = 'cohort3';
const step = (o) => Object.assign({ exTitle: 'Excluded', reasons: [{ t: '', n: '' }], text: '', n: '', side: 'auto', note: '', noteAt: 'top', overlap: false, total: '' }, o);
const DEF = {
  start: { text: 'Patients in the database', n: '' },
  steps: [step({ text: 'Eligible patients' })],
  groups: [],
  boxW: 280, exW: 280, groupW: 220, exFill: '#FFFFFF', grpFill: '#FFFFFF', exSize: 13,
  nStyle: 'paren', exSide: 'right', nBreak: '1', bullet: '• ',
  comma: true, exTotal: true, exTitleBold: false, boldMain: false, footnote: '',
  st: { ...RT.STYLE_DEF, gapY: 36, gapX: 32 },
};
const EXAMPLE = {
  start: { text: 'Patients with type 2 diabetes in the NHIRD, 2010–2020', n: '1245678' },
  steps: [
    step({ reasons: [{ t: 'Age < 20 years', n: '12034' }, { t: 'Missing sex or birth date', n: '856' }, { t: 'Follow-up < 180 days', n: '41320' }], text: 'Adults with T2D' }),
    step({ reasons: [{ t: 'Prior cancer diagnosis', n: '98211' }, { t: 'Dialysis before index date', n: '15403' }, { t: 'Used both drug A and drug B at index', n: '2317' }], text: 'New users of drug A or drug B' }),
  ],
  groups: [
    { boxes: [{ text: 'Drug A users', n: '612880' }, { text: 'After 1:1 propensity score matching', n: '', exTitle: 'Excluded', reasons: [{ t: 'Unmatched', n: '311654' }] }] },
    { boxes: [{ text: 'Drug B users', n: '462657' }, { text: 'After 1:1 propensity score matching', n: '', exTitle: 'Excluded', reasons: [{ t: 'Unmatched', n: '161431' }] }] },
  ],
};
let S = RT.load(KEY, DEF);

/* ---------------- form ---------------- */
const form = document.getElementById('form');
document.getElementById('styleFields').innerHTML = RT.styleFieldsHTML();
document.getElementById('refs').innerHTML = RT.refsHTML([RT.REFS.strobe, RT.REFS.record, RT.REFS.libs], [T('重疊的排除原因：若勾選「原因可重疊」，圖中各原因人數加總可能大於排除總數，建議在註腳說明「participants could meet more than one exclusion criterion」。', 'Overlapping exclusion reasons: when ticked, reason counts may add up to more than the total excluded — state in a footnote that participants could meet more than one criterion.')]);
function syncInputs() { RT.syncForm(form, S); renderSteps(); renderGroups(); }
RT.bindForm(form, () => S, () => update());
const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };

function renderSteps() {
  const host = document.getElementById('steps');
  host.innerHTML = '';
  S.steps.forEach((st, si) => {
    const blk = RT.h(`<div class="block">
      <div class="block-head"><b>${T('步驟', 'Step')} ${si + 1}</b><span class="spacer"></span>
        <button class="small" data-a="up" title="${T('上移', 'Move up')}">↑</button><button class="small" data-a="down" title="${T('下移', 'Move down')}">↓</button>
        <button class="icon" data-a="del" title="${T('刪除步驟', 'Delete step')}">✕</button></div>
      <div class="grp-ex">
        <div class="lbl">${T('從上一層排除', 'Excluded from the box above')} <span class="pill rs-sum"></span></div>
        <label class="field"><span>${T('排除框標題', 'Exclusion box title')}</span><input data-f="exTitle"></label>
        <div class="rs"></div>
        <label class="check" style="margin:4px 0" title="${T('預設各原因互斥（依序套用，每人只算一次），排除總數＝各原因加總。若一人可同時符合多個原因，請勾選並手動填排除總數。', 'By default reasons are mutually exclusive (applied in sequence, each person counted once) so the total is their sum. If a person can meet several reasons, tick this and enter the total.')}"><input type="checkbox" data-f="overlap"> ${T('原因可重疊（手動填排除總數）', 'Reasons overlap (enter total manually)')}</label>
        <label class="field ov-total"><span>${T('排除總數（不重複人數）', 'Total excluded (unique persons)')}</span><input class="n" data-f="total" inputmode="numeric"><span class="hint" style="display:block;margin:4px 0 0">${T('一人可符合多個原因時，填不重複的排除總數。', 'When one person can meet several reasons, enter the unique total.')}</span></label>
        <div class="btns"><button class="small" data-a="addR">${T('＋ 排除原因', '+ Reason')}</button><button class="small" data-a="paste">${T('批次貼上…', 'Paste list…')}</button></div>
      </div>
      <div class="list-row">
        <textarea data-f="text" rows="2" aria-label="${T(`步驟 ${si + 1} 排除後族群`, `Step ${si + 1} remaining population`)}" placeholder="${T('例：Eligible patients', 'e.g. Eligible patients')}"></textarea><input class="n" data-f="n" inputmode="numeric" placeholder="n" aria-label="${T(`步驟 ${si + 1} 剩餘人數`, `Step ${si + 1} remaining n`)}"><span aria-hidden="true"></span></div>
      <div class="step-opts">
        <label><span class="lbl">${T('排除框位置', 'Exclusion side')}</span><select data-f="side">
          <option value="auto">${T('預設', 'Default')}</option><option value="right">${T('右側', 'Right')}</option><option value="left">${T('左側', 'Left')}</option></select></label>
        <label><span class="lbl">${T('箭頭旁說明（選填）', 'Arrow note (optional)')}</span><input data-f="note" placeholder="${T('例：1:1 PS matching', 'e.g. 1:1 PS matching')}"></label>
        <label><span class="lbl">${T('說明位置', 'Note position')}</span><select data-f="noteAt">
          <option value="top">${T('箭頭上段', 'Upper part of the arrow')}</option><option value="middle">${T('箭頭中段', 'Middle of the arrow')}</option><option value="bottom">${T('箭頭下段', 'Lower part of the arrow')}</option></select></label>
      </div>
    </div>`);
    const ovTotal = blk.querySelector('.ov-total');
    blk.querySelectorAll('[data-f]').forEach((el) => {
      if (el.type === 'checkbox') el.checked = !!st[el.dataset.f]; else el.value = st[el.dataset.f] ?? '';
      el.oninput = () => {
        st[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
        ovTotal.hidden = !st.overlap;
        update();
      };
    });
    ovTotal.hidden = !st.overlap;
    blk.querySelector('[data-f="n"]').dataset.step = si;
    const rs = blk.querySelector('.rs');
    st.reasons.forEach((r, ri) => {
      const row = RT.h(`<div class="list-row"><input placeholder="${T('排除原因', 'Reason')}" aria-label="${T(`步驟 ${si + 1} 排除原因 ${ri + 1}`, `Step ${si + 1} reason ${ri + 1}`)}"><input class="n" inputmode="numeric" placeholder="n" aria-label="${T(`步驟 ${si + 1} 排除原因 ${ri + 1} 人數`, `Step ${si + 1} reason ${ri + 1} n`)}"><button class="icon" title="${T('刪除', 'Delete')}" aria-label="${T(`刪除步驟 ${si + 1} 排除原因 ${ri + 1}`, `Delete step ${si + 1} reason ${ri + 1}`)}">✕</button></div>`);
      const [t, n, del] = row.children;
      t.value = r.t; n.value = r.n;
      t.oninput = () => { r.t = t.value; update(); };
      n.oninput = () => { r.n = n.value; update(); };
      n.onkeydown = (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (ri === st.reasons.length - 1) { st.reasons.push({ t: '', n: '' }); renderSteps(); update(); focusReason(si, ri + 1); }
        else rs.children[ri + 1].querySelector('input').focus();
      };
      del.onclick = () => { st.reasons.splice(ri, 1); renderSteps(); update(); };
      rs.appendChild(row);
    });
    blk.querySelector('.block-head').onclick = (e) => {
      const a = e.target.dataset.a;
      if (a === 'up') move(S.steps, si, -1);
      else if (a === 'down') move(S.steps, si, 1);
      else if (a === 'del') S.steps.splice(si, 1);
      else return;
      renderSteps(); update();
    };
    blk.querySelector('[data-a="addR"]').onclick = () => { st.reasons.push({ t: '', n: '' }); renderSteps(); update(); focusReason(si, st.reasons.length - 1); };
    blk.querySelector('[data-a="paste"]').onclick = async () => {
      const txt = await RT.promptText(T('批次貼上排除原因', 'Paste exclusion reasons'),
        T('每行一項：<code>原因[Tab 或 , 或 :]人數</code>，可直接從 Excel 複製兩欄貼上。會取代此步驟的清單。', 'One per line: <code>reason[Tab , or :]n</code> — copy two columns from Excel. Replaces this step’s list.'),
        st.reasons.filter((r) => r.t || r.n).map((r) => `${r.t}\t${r.n}`).join('\n'));
      if (txt === null) return;
      st.reasons = RT.parsePairs(txt);
      if (!st.reasons.length) st.reasons = [{ t: '', n: '' }];
      renderSteps(); update();
    };
    host.appendChild(blk);
  });
}
function focusReason(si, ri) { const b = document.querySelectorAll('#steps .block')[si]; b?.querySelectorAll('.rs .list-row')[ri]?.querySelector('input')?.focus(); }
function renderGroups() {
  const host = document.getElementById('groups');
  host.innerHTML = '';
  S.groups.forEach((g, gi) => {
    const blk = RT.h(`<div class="block"><div class="block-head"><b>${T('組別', 'Group')} ${gi + 1}</b><span class="spacer"></span>
      <button class="small" data-a="up" title="${T('左移', 'Move left')}">←</button><button class="small" data-a="down" title="${T('右移', 'Move right')}">→</button>
      <button class="icon" data-a="del" title="${T('刪除組別', 'Delete group')}">✕</button></div><div class="bx"></div>
      <button class="small" data-a="addB">${T('＋ 下一層方框', '+ Next level box')}</button></div>`);
    const bx = blk.querySelector('.bx');
    g.boxes.forEach((b, bi) => {
      // exclusions between the box above and this one
      if (bi > 0) {
        b.reasons = b.reasons || [];
        const exb = RT.h(`<div class="grp-ex">
          <div class="lbl">${T('從上一層排除', 'Excluded from the box above')} <span class="pill grp-ex-sum"></span></div>
          <label class="field" ${b.reasons.length ? '' : 'hidden'}><span>${T('排除框標題', 'Exclusion box title')}</span><input data-g="exTitle"></label>
          <div class="grp-rs"></div>
          <button class="small" data-a="addEx">${T('＋ 排除原因', '+ Reason')}</button></div>`);
        const ti = exb.querySelector('[data-g="exTitle"]');
        ti.value = b.exTitle ?? 'Excluded';
        ti.oninput = () => { b.exTitle = ti.value; update(); };
        b.reasons.forEach((r, ri) => {
          const rr = RT.h(`<div class="list-row"><input placeholder="${T('排除原因', 'Reason')}" aria-label="${T(`組別 ${gi + 1} 第 ${bi + 1} 層排除原因 ${ri + 1}`, `Group ${gi + 1} level ${bi + 1} reason ${ri + 1}`)}"><input class="n" inputmode="numeric" placeholder="n" aria-label="${T(`組別 ${gi + 1} 第 ${bi + 1} 層排除原因 ${ri + 1} 人數`, `Group ${gi + 1} level ${bi + 1} reason ${ri + 1} n`)}"><button class="icon" title="${T('刪除', 'Delete')}" aria-label="${T(`刪除組別 ${gi + 1} 第 ${bi + 1} 層排除原因 ${ri + 1}`, `Delete group ${gi + 1} level ${bi + 1} reason ${ri + 1}`)}">✕</button></div>`);
          const [rt, rn, rd] = rr.children;
          rt.value = r.t; rn.value = r.n;
          rt.oninput = () => { r.t = rt.value; update(); };
          rn.oninput = () => { r.n = rn.value; update(); };
          rd.onclick = () => { b.reasons.splice(ri, 1); renderGroups(); update(); };
          exb.querySelector('.grp-rs').appendChild(rr);
        });
        exb.querySelector('[data-a="addEx"]').onclick = () => { b.reasons.push({ t: '', n: '' }); if (b.exTitle === undefined) b.exTitle = 'Excluded'; renderGroups(); update(); const ins = document.querySelectorAll(`#groups .block:nth-child(${gi + 1}) .grp-ex`)[bi - 1]?.querySelectorAll('.list-row input:first-child'); ins?.[ins.length - 1]?.focus(); };
        bx.appendChild(exb);
      }
      const row = RT.h(`<div class="list-row"><textarea rows="2" placeholder="${bi === 0 ? T('例：Exposed group', 'e.g. Exposed group') : T('例：After matching', 'e.g. After matching')}"></textarea><input class="n" inputmode="numeric" placeholder="n"><button class="icon" title="${T('刪除', 'Delete')}">✕</button></div>`);
      const [t, n, del] = row.children;
      t.value = b.text; n.value = b.n;
      n.dataset.g = gi; n.dataset.b = bi;
      t.oninput = () => { b.text = t.value; update(); };
      n.oninput = () => { b.n = n.value; update(); };
      del.onclick = () => { g.boxes.splice(bi, 1); if (!g.boxes.length) S.groups.splice(gi, 1); renderGroups(); update(); };
      bx.appendChild(row);
    });
    blk.querySelector('.block-head').onclick = (e) => {
      const a = e.target.dataset.a;
      if (a === 'up') move(S.groups, gi, -1);
      else if (a === 'down') move(S.groups, gi, 1);
      else if (a === 'del') S.groups.splice(gi, 1);
      else return;
      renderGroups(); update();
    };
    blk.querySelector('[data-a="addB"]').onclick = () => { g.boxes.push({ text: '', n: '' }); renderGroups(); update(); };
    // subgroups split the group's last box (e.g. by dose)
    g.split = g.split || [];
    const sub = RT.h(`<div class="sub-split"><div class="lbl">${T('子分組（從此組最後一個方框再分）', 'Subgroups (split from this group’s last box)')} <span class="pill sub-sum"></span></div><div class="subs"></div>
      <button class="small" data-a="addSub">${T('＋ 子分組', '+ Subgroup')}</button></div>`);
    g.split.forEach((sg, si) => {
      const sb = RT.h(`<div class="sub-blk"><div class="block-head"><b>${T('子分組', 'Subgroup')} ${si + 1}</b><span class="spacer"></span>
        <button class="small" data-a="sl" title="${T('左移', 'Move left')}">←</button><button class="small" data-a="sr" title="${T('右移', 'Move right')}">→</button>
        <button class="icon" data-a="sdel" title="${T('刪除子分組', 'Delete subgroup')}">✕</button></div><div class="sbx"></div>
        <button class="small" data-a="saddB">${T('＋ 下一層方框', '+ Next level box')}</button></div>`);
      sg.boxes.forEach((b, bi) => {
        const row = RT.h(`<div class="list-row"><textarea rows="2" placeholder="${bi === 0 ? T('例：High dose', 'e.g. High dose') : T('例：After matching', 'e.g. After matching')}" aria-label="${T(`組別 ${gi + 1} 子分組 ${si + 1} 第 ${bi + 1} 層`, `Group ${gi + 1} subgroup ${si + 1} level ${bi + 1}`)}"></textarea><input class="n" inputmode="numeric" placeholder="n" aria-label="${T(`組別 ${gi + 1} 子分組 ${si + 1} 第 ${bi + 1} 層人數`, `Group ${gi + 1} subgroup ${si + 1} level ${bi + 1} n`)}"><button class="icon" title="${T('刪除', 'Delete')}">✕</button></div>`);
        const [t, n, del] = row.children;
        t.value = b.text; n.value = b.n;
        t.oninput = () => { b.text = t.value; update(); };
        n.oninput = () => { b.n = n.value; update(); };
        del.onclick = () => { sg.boxes.splice(bi, 1); if (!sg.boxes.length) g.split.splice(si, 1); renderGroups(); update(); };
        sb.querySelector('.sbx').appendChild(row);
      });
      sb.querySelector('.block-head').onclick = (e) => {
        const a = e.target.dataset.a;
        if (a === 'sl') move(g.split, si, -1);
        else if (a === 'sr') move(g.split, si, 1);
        else if (a === 'sdel') g.split.splice(si, 1);
        else return;
        renderGroups(); update();
      };
      sb.querySelector('[data-a="saddB"]').onclick = () => { sg.boxes.push({ text: '', n: '' }); renderGroups(); update(); };
      sub.querySelector('.subs').appendChild(sb);
    });
    sub.querySelector('[data-a="addSub"]').onclick = () => {
      if (!g.split.length) g.split.push({ boxes: [{ text: 'Subgroup 1', n: '' }] });
      g.split.push({ boxes: [{ text: 'Subgroup ' + (g.split.length + 1), n: '' }] });
      renderGroups(); update();
    };
    blk.appendChild(sub);
    host.appendChild(blk);
  });
}
document.getElementById('addStep').onclick = () => { S.steps.push(step()); renderSteps(); update(); };
document.getElementById('addGroup').onclick = () => { S.groups.push({ boxes: [{ text: 'Group ' + String.fromCharCode(65 + S.groups.length), n: '' }] }); renderGroups(); update(); };

/* ---------------- numbers ---------------- */
const N = RT.num;
function computeN() {
  const out = [];
  let prev = N(S.start.n);
  S.steps.forEach((st) => {
    const active = st.reasons.filter((r) => r.t || r.n);
    const reasonSum = active.length ? RT.sum(active.map((r) => r.n)) : 0;
    // overlapping (non-mutually-exclusive) reasons: the total excluded is entered separately
    const total = st.overlap ? N(st.total) : reasonSum;
    let n = N(st.n), auto = false;
    const derived = prev !== null && total !== null ? prev - total : null;
    if (n === null && derived !== null) { n = derived; auto = true; }
    out.push({ n, auto, total, reasonSum, prev, derived, hasReasons: active.length > 0 });
    prev = n;
  });
  return out;
}
function computeGroups() {
  return S.groups.filter((g) => g.boxes.length).map((g) => {
    let prev = null;
    return g.boxes.map((b, bi) => {
      const active = bi > 0 ? (b.reasons || []).filter((r) => r.t || r.n) : [];
      const total = active.length ? RT.sum(active.map((r) => r.n)) : null;
      let n = N(b.n), auto = false;
      const derived = prev !== null && total !== null ? prev - total : null;
      if (n === null && derived !== null) { n = derived; auto = true; }
      const out = { n, auto, total, derived, prev, active };
      prev = n;
      return out;
    });
  });
}

/* ---------------- drawing ---------------- */
// boxes drawn in the preview and the form field each one maps to
let HITS = [], HIT_OFF = [0, 0];
const stepBlk = (i) => document.querySelectorAll('#steps > .block')[i];
const grpBlk = (i) => document.querySelectorAll('#groups > .block')[i];
const F = {
  start: () => document.querySelector('[data-k="start.text"]'),
  step: (i) => stepBlk(i)?.querySelector('[data-f="text"]'),
  stepEx: (i) => stepBlk(i)?.querySelector('.rs input') || stepBlk(i)?.querySelector('[data-f="exTitle"]'),
  note: (i) => stepBlk(i)?.querySelector('[data-f="note"]'),
  grp: (i, lv) => grpBlk(i)?.querySelectorAll(':scope > .bx > .list-row textarea')[lv],
  grpEx: (i, lv) => { const e = grpBlk(i)?.querySelectorAll(':scope > .bx > .grp-ex')[lv - 1]; return e?.querySelector('.grp-rs input') || e?.querySelector('[data-g="exTitle"]'); },
  sub: (i, j, lv) => grpBlk(i)?.querySelectorAll('.sub-blk')[j]?.querySelectorAll('.sbx > .list-row textarea')[lv],
};
const hit = (b, x, y, h, find) => HITS.push({ x, y, w: b.w, h: h ?? b.h, find });
function build(calc) {
  HITS = [];
  const st = RT.applyStyle(S.st);
  const fs = Number(st.fontSize) || 13, W = Number(S.boxW) || 280, EW = Number(S.exW) || 280, GW = Number(S.groupW) || 220;
  const nt = (v) => RT.nText(v, { style: S.nStyle, comma: S.comma });
  const base = { size: fs, stroke: st.boxStroke, sw: Number(st.boxSW), radius: Number(st.radius), pad: Number(st.pad), lh: Number(st.lh), color: st.textColor };
  const mainO = { ...base, fill: st.boxFill };
  const exO = { ...base, fill: S.exFill, align: 'left', size: Number(S.exSize) || fs };
  const grpO = { ...base, fill: S.grpFill };
  const ao = { color: st.lineColor, sw: Number(st.lineW), head: Number(st.headSize) };
  const hgap = Number(st.gapX) || 32, vpad = Math.round(fs * 1.1), baseGap = Number(st.gapY) || 36;
  const mainItems = (text, n) => {
    const hasN = n !== null && n !== undefined && String(n).trim() !== '';
    const txt = String(text || '').trim();
    if (!hasN) return [{ text: txt, bold: S.boldMain }];
    if (S.nBreak === '0') return [{ text: (txt ? txt + ' ' : '') + nt(n), bold: S.boldMain }];
    return [txt ? { text: txt, bold: S.boldMain } : null, { text: nt(n) }];
  };
  RT.beginScene();
  let body = '';
  let minX = -W / 2, maxX = W / 2, y = 0;
  const b0 = RT.box(mainItems(S.start.text, S.start.n), W, mainO);
  body += RT.drawBox(b0, -W / 2, y);
  hit(b0, -W / 2, y, null, F.start);
  y += b0.h;

  S.steps.forEach((stp, i) => {
    const c = calc[i];
    const active = stp.reasons.filter((rr) => rr.t || rr.n);
    const esz = exO.size;
    let ex = null;
    if (active.length) {
      const title = (stp.exTitle || '').trim();
      const items = [];
      if (title) items.push({ text: S.exTotal && c.total !== null ? `${title} ${nt(c.total)}` : title, bold: S.exTitleBold });
      active.forEach((rr, k) => {
        const bullet = S.bullet === 'num' ? `${k + 1}. ` : S.bullet;
        const hang = bullet ? RT.textWidth(bullet, esz) : 0;
        items.push({ text: `${bullet}${rr.t}${String(rr.n).trim() !== '' ? ' ' + nt(rr.n) : ''}`, indent: title ? Math.round(esz * 0.4) : 0, hang });
      });
      ex = RT.box(items, EW, exO);
    }
    const note = (stp.note || '').trim();
    // as wide as its text (up to the exclusion width), so it sits right against the line
    const noteW = note ? Math.min(Math.max(EW, 160), Math.ceil(Math.max(...note.split('\n').map((l) => RT.textWidth(l, exO.size, false, true)))) + 4) : 0;
    const noteBox = note ? RT.box([{ text: note, italic: true }], noteW, { ...exO, fill: 'none', stroke: 'none', pad: 0, padX: 0 }) : null;
    let gap = baseGap;
    if (ex) gap = Math.max(gap, ex.h + 2 * vpad);
    if (noteBox) gap = Math.max(gap, noteBox.h + 2 * vpad);
    const nb = RT.box(mainItems(stp.text, c.n), W, mainO);
    body += RT.arrow([[0, y], [0, y + gap]], ao);
    const side = stp.side === 'auto' || !stp.side ? S.exSide : stp.side;
    const my = y + gap / 2;
    if (ex) {
      if (side === 'left') {
        const ex0 = -W / 2 - hgap - EW;
        body += RT.arrow([[0, my], [ex0 + EW, my]], ao);
        body += RT.drawBox(ex, ex0, my - ex.h / 2);
        hit(ex, ex0, my - ex.h / 2, null, () => F.stepEx(i));
        minX = Math.min(minX, ex0);
      } else {
        const ex0 = W / 2 + hgap;
        body += RT.arrow([[0, my], [ex0, my]], ao);
        body += RT.drawBox(ex, ex0, my - ex.h / 2);
        hit(ex, ex0, my - ex.h / 2, null, () => F.stepEx(i));
        maxX = Math.max(maxX, ex0 + EW);
      }
    }
    if (noteBox) {
      // note sits on the side opposite the exclusion box (or right when there is none)
      const onLeft = ex ? side !== 'left' : false;
      const nx = onLeft ? -noteBox.w - 8 : 8;
      if (onLeft) noteBox.lines.forEach((l) => { l.align = 'right'; });
      const at = stp.noteAt || 'top', inset = Math.round(fs * 0.35);
      const ny = at === 'middle' ? my - noteBox.h / 2 : at === 'bottom' ? y + gap - noteBox.h - inset : y + inset;
      body += RT.drawBox(noteBox, nx, ny);
      hit(noteBox, nx, ny, null, () => F.note(i));
      if (onLeft) minX = Math.min(minX, nx); else maxX = Math.max(maxX, nx + noteBox.w);
    }
    y += gap;
    body += RT.drawBox(nb, -W / 2, y);
    hit(nb, -W / 2, y, null, () => F.step(i));
    y += nb.h;
  });

  const G = S.groups.filter((g) => g.boxes.length);
  if (G.length) {
    const gc = computeGroups();
    // exclusion boxes inside groups: the first group's go left, the others' right
    const sideOf = (i) => (i === 0 && G.length > 1 ? 'left' : 'right');
    const exBox = (i, lv) => {
      const c = gc[i][lv];
      if (!c || !c.active.length) return null;
      const title = (G[i].boxes[lv].exTitle ?? 'Excluded').trim(), esz = exO.size, items = [];
      if (title) items.push({ text: S.exTotal && c.total !== null ? `${title} ${nt(c.total)}` : title, bold: S.exTitleBold });
      c.active.forEach((rr, k) => {
        const bullet = S.bullet === 'num' ? `${k + 1}. ` : S.bullet;
        items.push({ text: `${bullet}${rr.t}${String(rr.n).trim() !== '' ? ' ' + nt(rr.n) : ''}`, indent: title ? Math.round(esz * 0.4) : 0, hang: bullet ? RT.textWidth(bullet, esz) : 0 });
      });
      return RT.box(items, Math.min(EW, Math.max(GW, fs * 12)), exO);
    };
    // only a middle group's exclusions land between two groups and need extra room
    const anyInnerEx = G.some((g, i) => i > 0 && i < G.length - 1 && g.boxes.some((_, lv) => lv > 0 && gc[i][lv].active.length));
    const exWmax = Math.max(0, ...G.flatMap((g, i) => g.boxes.map((_, lv) => (lv > 0 ? exBox(i, lv)?.w || 0 : 0))));
    const gg = anyInnerEx ? Math.max(Math.round(fs * 1.8), exWmax + 2 * hgap) : Math.round(fs * 1.8);
    // a group with subgroups gets a wider column so its subgroups sit side by side under it
    const SW = Math.round(Math.max(fs * 8, GW * 0.8)), sgap = Math.round(fs * 1.2);
    const subsOf = (g) => (g.split || []).filter((x) => x.boxes && x.boxes.length);
    const cw = G.map((g) => { const k = subsOf(g).length; return k ? Math.max(GW, k * SW + (k - 1) * sgap) : GW; });
    const total = cw.reduce((a, b) => a + b, 0) + (G.length - 1) * gg;
    const colL = [];
    cw.reduce((x, w, i) => { colL[i] = x; return x + w + gg; }, -total / 2);
    const xs = G.map((_, i) => colL[i] + (cw[i] - GW) / 2);
    const lastBottom = G.map(() => null);
    const levels = Math.max(...G.map((g) => g.boxes.length));
    if (G.length === 1) body += RT.arrow([[0, y], [0, y + baseGap]], ao);
    else {
      const barY = y + baseGap * 0.45;
      body += RT.line([[0, y], [0, barY]], ao);
      body += RT.line([[xs[0] + GW / 2, barY], [xs[xs.length - 1] + GW / 2, barY]], ao);
      xs.forEach((x) => (body += RT.arrow([[x + GW / 2, barY], [x + GW / 2, y + baseGap]], ao)));
    }
    y += baseGap;
    let gapAbove = baseGap;
    for (let lv = 0; lv < levels; lv++) {
      const boxes = G.map((g, i) => (g.boxes[lv] ? RT.box(mainItems(g.boxes[lv].text, gc[i][lv].n), GW, grpO) : null));
      const h = Math.max(...boxes.filter(Boolean).map((b) => b.h));
      if (lv > 0) {
        // the gap above this level grows to fit the tallest exclusion box
        const exs = G.map((_, i) => (boxes[i] ? exBox(i, lv) : null));
        const need = Math.max(baseGap, ...exs.filter(Boolean).map((e) => e.h + 2 * vpad));
        y += need - gapAbove;
        G.forEach((g, i) => {
          if (!boxes[i]) return;
          const cx = xs[i] + GW / 2, top = y - need, my = top + need / 2;
          body += RT.arrow([[cx, top], [cx, y]], ao);
          const e = exs[i];
          if (!e) return;
          if (sideOf(i) === 'left') {
            const ex0 = xs[i] - hgap - e.w;
            body += RT.arrow([[cx, my], [ex0 + e.w, my]], ao);
            body += RT.drawBox(e, ex0, my - e.h / 2);
            hit(e, ex0, my - e.h / 2, null, () => F.grpEx(i, lv));
            minX = Math.min(minX, ex0);
          } else {
            const ex0 = xs[i] + GW + hgap;
            body += RT.arrow([[cx, my], [ex0, my]], ao);
            body += RT.drawBox(e, ex0, my - e.h / 2);
            hit(e, ex0, my - e.h / 2, null, () => F.grpEx(i, lv));
            maxX = Math.max(maxX, ex0 + e.w);
          }
        });
      }
      boxes.forEach((b, i) => { if (b) { body += RT.drawBox(b, xs[i], y, h); lastBottom[i] = y + h; const l = lv; hit(b, xs[i], y, h, () => F.grp(i, l)); } });
      y += h + baseGap;
      gapAbove = baseGap;
    }
    y -= baseGap;
    // subgroups: one row of branches below the lowest group box
    const subLevels = Math.max(0, ...G.flatMap((g) => subsOf(g).map((x) => x.boxes.length)));
    if (subLevels) {
      const top0 = y + baseGap * 1.3;
      const subX = (i, j) => { const k = subsOf(G[i]).length, span = k * SW + (k - 1) * sgap; return colL[i] + (cw[i] - span) / 2 + j * (SW + sgap); };
      G.forEach((g, i) => {
        const ss = subsOf(g);
        if (!ss.length) return;
        const cx = xs[i] + GW / 2, barY = top0 - baseGap * 0.55;
        const centres = ss.map((_, j) => subX(i, j) + SW / 2);
        body += RT.line([[cx, lastBottom[i]], [cx, barY]], ao);
        if (ss.length > 1) body += RT.line([[Math.min(cx, centres[0]), barY], [Math.max(cx, centres[centres.length - 1]), barY]], ao);
        centres.forEach((c) => { body += RT.arrow([[c, barY], [c, top0]], ao); });
      });
      let sy = top0;
      for (let lv = 0; lv < subLevels; lv++) {
        const row = G.flatMap((g, i) => subsOf(g).map((x, j) => (x.boxes[lv] ? { i, j, b: RT.box(mainItems(x.boxes[lv].text, x.boxes[lv].n), SW, grpO) } : null))).filter(Boolean);
        const h = Math.max(...row.map((r) => r.b.h));
        if (lv > 0) row.forEach((r) => { const c = subX(r.i, r.j) + SW / 2; body += RT.arrow([[c, sy - baseGap], [c, sy]], ao); });
        row.forEach((r) => { body += RT.drawBox(r.b, subX(r.i, r.j), sy, h); const l = lv; hit(r.b, subX(r.i, r.j), sy, h, () => F.sub(r.i, r.j, l)); });
        sy += h + baseGap;
      }
      y = sy - baseGap;
    }
    minX = Math.min(minX, colL[0]);
    maxX = Math.max(maxX, colL[colL.length - 1] + cw[cw.length - 1]);
  }
  const M = 16;
  RT.shiftScene(0, M - minX, M);
  const width = maxX - minX + 2 * M;
  let foot = '';
  if (S.footnote && S.footnote.trim()) {
    const fb = RT.box([{ text: S.footnote }], width - 2 * M, { size: fs - 1, align: 'left', stroke: 'none', fill: 'none', pad: 0, padX: 0, lh: Number(st.lh), color: st.textColor });
    foot = RT.drawBox(fb, M, y + M + fs);
    y += fs + fb.h;
  }
  HIT_OFF = [M - minX, M];
  return RT.figure(width, y + 2 * M, `<g transform="translate(${RT.f(M - minX)},${M})">${body}</g>` + foot);
}

function checks(calc) {
  const msgs = [];
  const fmt = (v) => RT.fmtNum(v);
  calc.forEach((c, i) => {
    const st = S.steps[i];
    const nIn = document.querySelector(`input[data-step="${i}"]`);
    const bad = c.hasReasons && !c.auto && c.n !== null && c.derived !== null && c.derived !== c.n;
    if (bad) msgs.push(T(`步驟 ${i + 1}：${fmt(c.prev)} − ${fmt(c.total)} = ${fmt(c.derived)}，但剩餘人數填 ${fmt(c.n)}`, `Step ${i + 1}: ${fmt(c.prev)} − ${fmt(c.total)} = ${fmt(c.derived)}, but remaining n is ${fmt(c.n)}`));
    if (c.n !== null && c.n < 0) msgs.push(T(`步驟 ${i + 1}：剩餘人數為負值`, `Step ${i + 1}: remaining n is negative`));
    if (nIn) {
      nIn.classList.toggle('bad', bad || (c.n !== null && c.n < 0));
      nIn.classList.toggle('auto', c.auto);
      nIn.placeholder = c.auto ? T('自動 ', 'Auto ') + fmt(c.n) : 'n';
    }
    const sumEl = document.querySelectorAll('#steps .rs-sum')[i];
    if (sumEl) sumEl.textContent = c.total !== null && c.total > 0 ? T('合計 ', 'Total ') + fmt(c.total) : '';
    if (st.overlap && c.total === null) msgs.push(T(`步驟 ${i + 1}：勾選了原因可重疊，請填排除總數`, `Step ${i + 1}: reasons overlap — enter the total excluded`));
    if (st.overlap && c.total !== null && c.reasonSum !== null && c.reasonSum < c.total) msgs.push(T(`步驟 ${i + 1}：各原因加總 ${fmt(c.reasonSum)} 小於排除總數 ${fmt(c.total)}，重疊時加總應 ≥ 總數`, `Step ${i + 1}: reasons sum to ${fmt(c.reasonSum)}, less than the total ${fmt(c.total)} — with overlap the sum should be ≥ the total`));
    if (st.reasons.some((r) => r.t && String(r.n).trim() === '')) msgs.push(T(`步驟 ${i + 1}：有排除原因未填人數`, `Step ${i + 1}: a reason has no n`));
  });
  const G = S.groups.filter((g) => g.boxes.length);
  const last = calc.length ? calc[calc.length - 1].n : N(S.start.n);
  if (G.length > 1 && last !== null) {
    const s = RT.sum(G.map((g) => g.boxes[0].n));
    if (s !== null && s !== last) msgs.push(T(`各組第一層人數加總 ${fmt(s)} ≠ 最後族群 ${fmt(last)}`, `Sum of groups ${fmt(s)} ≠ final population ${fmt(last)}`));
  }
  // exclusions inside groups
  const gc = computeGroups();
  S.groups.filter((g) => g.boxes.length).forEach((g, gi) => {
    const ss = (g.split || []).filter((x) => x.boxes && x.boxes.length);
    const sumEl = document.querySelectorAll('#groups .sub-sum')[gi];
    if (!ss.length) { if (sumEl) sumEl.textContent = ''; return; }
    const sum = RT.sum(ss.map((x) => x.boxes[0].n)), parent = gc[gi][gc[gi].length - 1].n;
    if (sumEl) sumEl.textContent = sum !== null ? T('合計 ', 'Total ') + fmt(sum) : '';
    if (sum !== null && parent !== null && sum !== parent) msgs.push(T(`組別 ${gi + 1} 的子分組加總 ${fmt(sum)} ≠ 上方方框 ${fmt(parent)}`, `Group ${gi + 1}: subgroups add up to ${fmt(sum)}, not the ${fmt(parent)} in the box above`));
  });
  gc.forEach((boxes, gi) => boxes.forEach((c, bi) => {
    const nIn = document.querySelector(`#groups input[data-g="${gi}"][data-b="${bi}"]`);
    const bad = c.active.length && !c.auto && c.n !== null && c.derived !== null && c.derived !== c.n;
    if (bad) msgs.push(T(`組別 ${gi + 1} 第 ${bi + 1} 層：${fmt(c.prev)} − ${fmt(c.total)} = ${fmt(c.derived)}，但人數填 ${fmt(c.n)}`, `Group ${gi + 1} level ${bi + 1}: ${fmt(c.prev)} − ${fmt(c.total)} = ${fmt(c.derived)}, but n is ${fmt(c.n)}`));
    if (c.n !== null && c.n < 0) msgs.push(T(`組別 ${gi + 1} 第 ${bi + 1} 層：人數為負值`, `Group ${gi + 1} level ${bi + 1}: n is negative`));
    if (c.active.some((r) => r.t && String(r.n).trim() === '')) msgs.push(T(`組別 ${gi + 1} 第 ${bi + 1} 層：有排除原因未填人數`, `Group ${gi + 1} level ${bi + 1}: a reason has no n`));
    if (nIn) {
      nIn.classList.toggle('bad', !!bad || (c.n !== null && c.n < 0));
      nIn.classList.toggle('auto', c.auto);
      nIn.placeholder = c.auto ? T('自動 ', 'Auto ') + fmt(c.n) : 'n';
    }
    const sumEl = document.querySelectorAll(`#groups .block:nth-child(${gi + 1}) .grp-ex-sum`)[bi - 1];
    if (sumEl) sumEl.textContent = c.total !== null && c.total > 0 ? T('合計 ', 'Total ') + fmt(c.total) : '';
  }));
  document.getElementById('msgs').innerHTML = msgs.map((m) => `<div class="msg">⚠ ${RT.esc(m)}</div>`).join('');
  return msgs.length;
}

let fig;
const preview = document.getElementById('preview');
const exporter = RT.exportPanel(document.getElementById('export'), () => fig, 'cohort_flow', { fontSize: { get: () => S.st.fontSize, set: (v) => { S.st.fontSize = v; syncInputs(); update(); } } });
const hist = RT.history(() => S, (s) => { S = s; syncInputs(); render(); });
function render() {
  const calc = computeN();
  try { fig = build(calc); preview.innerHTML = fig.svg; RT.fieldHits(preview, HITS, ...HIT_OFF); }
  catch (e) { console.error(e); preview.innerHTML = `<div class="msg">⚠ ${RT.esc(e.message)}</div>`; }
  exporter.setIssues(checks(calc));
  exporter.refresh();
  RT.save(KEY, S);
}
const update = RT.debounce(() => { render(); hist.push(); }, 60);

document.getElementById('btnUndo').onclick = hist.undo;
document.getElementById('btnRedo').onclick = hist.redo;
document.getElementById('btnExample').onclick = () => { Object.assign(S, structuredClone(EXAMPLE)); syncInputs(); update(); RT.toast(T('已載入範例（虛構數據，僅供示範）', 'Example loaded (fictional numbers, for illustration only)')); };
document.getElementById('btnReset').onclick = () => { const d = structuredClone(DEF); S.start = d.start; S.steps = d.steps; S.groups = d.groups; syncInputs(); update(); RT.toast(T('已清空內容，外觀設定保留（按 ↶ 可復原）', 'Content cleared, appearance kept (↶ to undo)')); };
// the project buttons save and import the whole toolkit (shared/common.js); this tool supplies its state
RT.currentState = () => S;
RT.applyState = (o) => { S = RT.merge(DEF, o); syncInputs(); update(); };

syncInputs();
render();
hist.push();
</script>
</body>
</html>
