<meta property="og:title" content="視覺摘要 · Research Toolkit">
<meta property="og:description" content="填入研究問題、族群、設計、主要結果與結論，產生一張可編輯的視覺摘要圖。">
<meta property="og:url" content="https://jschang0512.github.io/Research-toolkit/abstract/">

<body>
<header class="topbar">
  <a class="back" href="../index.html" data-en="← Home">← 工具首頁</a>
  <h1>Visual Abstract</h1>
  <span class="sub" data-en="Question, population, design, main result and conclusion on one image">研究問題、族群、設計、主要結果與結論，一張圖說完</span>
  <span class="spacer"></span>
  <div class="btns">
    <button class="small" id="btnUndo" title="復原 (Ctrl+Z)" data-en-title="Undo (Ctrl+Z)">↶</button>
    <button class="small" id="btnRedo" title="重做 (Ctrl+Y)" data-en-title="Redo (Ctrl+Y)">↷</button>
    <button class="small" id="btnSaveJson" title="下載 .json，之後可再開啟或傳給共同作者" data-en-title="Download a .json file to reopen later or share with co-authors" data-en="Save project">儲存專案</button>
    <button class="small" id="btnLoadJson" title="匯入先前儲存的 .json 專案檔，還原所有輸入" data-en-title="Import a previously saved .json project file" data-en="Import project">匯入專案</button>
    <button class="small" id="btnExample" data-en="Example">範例</button>
    <button class="small" id="btnReset" data-en="Clear">清空</button>
  </div>
</header>

<main class="tool">
  <section id="form">
    <div class="card">
      <p class="hint" style="margin:0" data-en="A generic layout in the spirit of journal visual abstracts. Check your target journal’s own template and size before submitting.">通用的視覺摘要版型，結構參考期刊常見的 visual abstract。投稿前請確認目標期刊是否有指定範本與尺寸。</p>
    </div>
    <div class="card">
      <h2><span class="step-no">1</span> <span data-en="Question">研究問題</span></h2>
      <label class="field"><span data-en="Title or question">標題或研究問題</span><textarea data-k="title" rows="2"></textarea></label>
    </div>
    <div class="card">
      <h2><span class="step-no">2</span> <span data-en="Population">族群</span></h2>
      <div class="grid2">
        <label class="field"><span data-en="Panel heading">區塊標題</span><input data-k="popH"></label>
        <label class="field"><span data-en="Headline number">重點數字</span><input data-k="popN"></label>
      </div>
      <label class="field"><span data-en="Description">說明</span><textarea data-k="popText" rows="3"></textarea></label>
    </div>
    <div class="card">
      <h2><span class="step-no">3</span> <span data-en="Design and comparison">設計與比較</span></h2>
      <div class="grid2">
        <label class="field"><span data-en="Panel heading">區塊標題</span><input data-k="desH"></label>
        <label class="field"><span data-en="Design">研究設計</span><input data-k="design"></label>
        <label class="field"><span data-en="Group 1">組別 1</span><input data-k="armA"></label>
        <label class="field"><span data-en="Group 1 n (optional)">組別 1 人數（選填）</span><input data-k="armAn"></label>
        <label class="field"><span data-en="Group 2">組別 2</span><input data-k="armB"></label>
        <label class="field"><span data-en="Group 2 n (optional)">組別 2 人數（選填）</span><input data-k="armBn"></label>
      </div>
      <label class="field"><span data-en="Follow-up or setting (optional)">追蹤或資料來源（選填）</span><input data-k="setting"></label>
    </div>
    <div class="card">
      <h2><span class="step-no">4</span> <span data-en="Results and conclusion">結果與結論</span></h2>
      <div class="grid2">
        <label class="field"><span data-en="Panel heading">區塊標題</span><input data-k="resH"></label>
        <label class="field"><span data-en="Outcome">結果指標</span><input data-k="outcome"></label>
      </div>
      <label class="field"><span data-en="Main result (shown large)">主要結果（大字）</span><input data-k="main"></label>
      <label class="field"><span data-en="Other results (one per line)">其他結果（每行一項）</span><textarea data-k="more" rows="3"></textarea></label>
      <label class="field"><span data-en="Conclusion (one sentence)">結論（一句話）</span><textarea data-k="concl" rows="2"></textarea></label>
      <label class="field"><span data-en="Citation line (optional)">引用資訊（選填）</span><input data-k="cite"></label>
    </div>
    <div class="card">
      <details>
        <summary><span class="step-no" style="display:inline-grid">5</span> <span data-en="Appearance">外觀：顏色、尺寸、字型</span></summary>
        <div class="grid2">
          <label class="field"><span data-en="Accent colour">主色</span><input type="color" data-k="accent" style="width:100%"></label>
          <label class="field"><span data-en="Shape">比例</span><select data-k="ratio">
            <option value="16:9">16 : 9</option><option value="4:3">4 : 3</option><option value="1:1">1 : 1</option></select></label>
        </div>
        <div id="styleFields"></div>
      </details>
    </div>
    <div class="card" id="refs"></div>
  </section>

  <section class="preview-col">
    <div class="paper" id="preview"></div>
    <div class="msgs" id="msgs"></div>
    <div class="card" id="export"></div>
  </section>
</main>

<script src="../shared/common.js?v=20261025a"></script>
<script>
const T = RT.t;
const KEY = 'abstract1';
const DEF = {
  title: '', popH: 'Population', popN: '', popText: '', desH: 'Design', design: '', armA: '', armAn: '', armB: '', armBn: '', setting: '',
  resH: 'Main result', outcome: '', main: '', more: '', concl: '', cite: '', accent: '#0B5E99', ratio: '16:9',
  st: { ...RT.STYLE_DEF, fontSize: 18 },
};
const REFS = [
  'Ibrahim AM, Lillemoe KD, Klingensmith ME, Dimick JB. Visual abstracts to disseminate research on social media: a prospective, case-control crossover study. <i>Ann Surg</i> 2017;266:e46–8. <a href="https://doi.org/10.1097/SLA.0000000000002277" target="_blank" rel="noopener">doi:10.1097/SLA.0000000000002277</a>',
  RT.REFS.libs,
];
let S = RT.load(KEY, DEF);

const form = document.getElementById('form');
document.getElementById('styleFields').innerHTML = RT.styleFieldsHTML(['font', 'fontSize']);
document.getElementById('refs').innerHTML = RT.refsHTML(REFS);
function syncInputs() { RT.syncForm(form, S); }
RT.bindForm(form, () => S, () => update());

/* ---------------- icons (plain shapes, so they stay editable in Word) ---------------- */
const people = (cx, cy, s, c) => [-0.42, 0, 0.42].map((dx, i) => {
  const k = i === 1 ? 1 : 0.82, x = cx + dx * s, y = cy + (i === 1 ? 0 : s * 0.06);
  return RT.circle(x, y - s * 0.22 * k, s * 0.15 * k, { fill: c }) + RT.rect(x - s * 0.2 * k, y - s * 0.03 * k, s * 0.4 * k, s * 0.36 * k, { fill: c, radius: s * 0.14 * k });
}).join('');
const arms = (cx, cy, s, c) => RT.line([[cx - s * 0.5, cy], [cx - s * 0.1, cy]], { color: c, sw: s * 0.07 }) +
  RT.arrow([[cx - s * 0.1, cy], [cx + s * 0.45, cy - s * 0.28]], { color: c, sw: s * 0.07, head: s * 0.2 }) +
  RT.arrow([[cx - s * 0.1, cy], [cx + s * 0.45, cy + s * 0.28]], { color: c, sw: s * 0.07, head: s * 0.2 }) +
  RT.circle(cx - s * 0.5, cy, s * 0.09, { fill: c });
const bars = (cx, cy, s, c) => [0.32, 0.52, 0.78].map((h, i) => RT.rect(cx - s * 0.42 + i * s * 0.3, cy + s * 0.36 - s * h, s * 0.22, s * h, { fill: c, radius: 2 })).join('') +
  RT.line([[cx - s * 0.5, cy + s * 0.37], [cx + s * 0.5, cy + s * 0.37]], { color: c, sw: s * 0.05 });
const tint = (hex, a) => { const n = parseInt(String(hex).slice(1), 16); return '#' + [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v * a + 255 * (1 - a)).toString(16).padStart(2, '0')).join('').toUpperCase(); };

/* ---------------- figure ---------------- */
function build() {
  const st = RT.applyStyle(S.st);
  const fs = Number(st.fontSize) || 18, ink = '#1F2328', acc = /^#[\da-f]{6}$/i.test(S.accent) ? S.accent : '#0B5E99';
  const [rw, rh] = String(S.ratio || '16:9').split(':').map(Number);
  const W = 1200, H = Math.round((W * rh) / rw), M = 28, G = 18;
  const box = (items, w, o = {}) => RT.box(items, w, { size: fs, pad: 0, padX: 0, align: 'left', fill: 'none', stroke: 'none', color: ink, lh: 1.3, ...o });
  RT.beginScene();
  let body = '';
  // header band: the question
  const tb = box([{ text: S.title || T('標題或研究問題', 'Title or research question'), bold: true, color: '#FFFFFF' }], W - 2 * M, { size: fs * 1.45, lh: 1.2 });
  const headH = tb.h + M * 1.2;
  body += RT.rect(0, 0, W, headH, { fill: acc });
  body += RT.drawBox(tb, M, (headH - tb.h) / 2);
  // footer: conclusion band and citation
  const cb = box([{ text: S.concl || T('一句話結論', 'One-sentence conclusion'), bold: true }], W - 2 * M - fs * 1.2, { size: fs * 1.1 });
  const citeB = S.cite ? box([{ text: S.cite, color: '#57606A' }], W - 2 * M, { size: fs * 0.72 }) : null;
  const citeH = citeB ? citeB.h + fs * 0.6 : 0;
  const concH = cb.h + fs * 1.4;
  const concY = H - M * 0.6 - citeH - concH;
  body += RT.rect(M, concY, W - 2 * M, concH, { fill: tint(acc, 0.12), radius: 10 });
  body += RT.rect(M, concY, fs * 0.35, concH, { fill: acc });
  body += RT.drawBox(cb, M + fs * 1.0, concY + (concH - cb.h) / 2);
  if (citeB) body += RT.drawBox(citeB, M, concY + concH + fs * 0.45);
  // three panels
  const top = headH + G, bottom = concY - G, ph = bottom - top, pw = (W - 2 * M - 2 * G) / 3;
  const icon = fs * 3.2;
  let overflow = false;
  const panel = (k, head, draw, content) => {
    const x = M + k * (pw + G);
    body += RT.rect(x, top, pw, ph, { fill: tint(acc, 0.06), stroke: tint(acc, 0.35), sw: 1, radius: 10 });
    body += draw(x + pw / 2, top + fs * 0.9 + icon / 2, icon, acc);
    const hb = box([{ text: head, bold: true, color: acc, align: 'center' }], pw - fs * 1.6, { size: fs * 0.95, align: 'center' });
    let y = top + fs * 1.2 + icon;
    body += RT.drawBox(hb, x + fs * 0.8, y); y += hb.h + fs * 0.45;
    // each panel reports where its text ends, so overflow into the conclusion band is caught
    if (content(x + fs * 0.8, y, pw - fs * 1.6) > bottom - fs * 0.4) overflow = true;
  };
  panel(0, S.popH, people, (x, y, w) => {
    if (S.popN) { const nb = box([{ text: S.popN, bold: true, align: 'center' }], w, { size: fs * 1.6, align: 'center', lh: 1.15 }); body += RT.drawBox(nb, x, y); y += nb.h + fs * 0.3; }
    if (S.popText) { const pb = box([{ text: S.popText, align: 'center' }], w, { size: fs * 0.85, align: 'center' }); body += RT.drawBox(pb, x, y); y += pb.h; }
    return y;
  });
  panel(1, S.desH, arms, (x, y, w) => {
    if (S.design) { const db = box([{ text: S.design, bold: true, align: 'center' }], w, { size: fs * 0.9, align: 'center' }); body += RT.drawBox(db, x, y); y += db.h + fs * 0.5; }
    [[S.armA, S.armAn], [S.armB, S.armBn]].filter(([a]) => a).forEach(([a, n], i, arr) => {
      const ab = box([{ text: a, bold: true, align: 'center' }, n ? { text: n, align: 'center', size: fs * 0.8 } : null], w - fs * 0.8, { size: fs * 0.88, align: 'center' });
      const bh = ab.h + fs * 0.7;
      body += RT.rect(x, y, w, bh, { fill: '#FFFFFF', stroke: tint(acc, 0.5), sw: 1, radius: 8 });
      body += RT.drawBox(ab, x + fs * 0.4, y + fs * 0.35);
      y += bh;
      if (i < arr.length - 1) { const vb = box([{ text: 'vs', align: 'center', color: '#57606A' }], w, { size: fs * 0.8, align: 'center' }); body += RT.drawBox(vb, x, y + fs * 0.15); y += vb.h + fs * 0.3; }
    });
    if (S.setting) { const sb = box([{ text: S.setting, align: 'center', color: '#57606A' }], w, { size: fs * 0.78, align: 'center' }); body += RT.drawBox(sb, x, y + fs * 0.5); y += fs * 0.5 + sb.h; }
    return y;
  });
  panel(2, S.resH, bars, (x, y, w) => {
    if (S.outcome) { const ob = box([{ text: S.outcome, align: 'center' }], w, { size: fs * 0.88, align: 'center' }); body += RT.drawBox(ob, x, y); y += ob.h + fs * 0.3; }
    if (S.main) { const mb = box([{ text: S.main, bold: true, color: acc, align: 'center' }], w, { size: fs * 1.5, align: 'center', lh: 1.15 }); body += RT.drawBox(mb, x, y); y += mb.h + fs * 0.5; }
    const more = String(S.more || '').split('\n').map((t) => t.trim()).filter(Boolean);
    if (more.length) { const rb = box(more.map((t) => ({ text: t, align: 'center' })), w, { size: fs * 0.8, align: 'center' }); body += RT.drawBox(rb, x, y); y += rb.h; }
    return y;
  });
  return { ...RT.figure(W, H, body), overflow: overflow || headH + G * 3 > concY };
}

let fig;
const preview = document.getElementById('preview');
const exporter = RT.exportPanel(document.getElementById('export'), () => fig, 'visual_abstract', {
  fontSize: { get: () => S.st.fontSize, set: (v) => { S.st.fontSize = v; syncInputs(); update(); } },
});
const hist = RT.history(() => S, (s) => { S = s; syncInputs(); render(); });
function render() {
  try { fig = build(); preview.innerHTML = fig.svg; }
  catch (e) { console.error(e); preview.innerHTML = `<div class="msg">⚠ ${RT.esc(e.message)}</div>`; }
  // text that no longer fits pushes past the conclusion band
  const msgs = [];
  if (fig && fig.overflow) msgs.push(T('文字超出圖面，請縮短內容、調小字級或改用 4:3 比例', 'Some text runs off the image — shorten it, reduce the font size or use 4:3'));
  if (!S.main && (S.title || S.popText)) msgs.push(T('還沒有主要結果', 'No main result yet'));
  document.getElementById('msgs').innerHTML = msgs.map((m) => `<div class="msg">⚠ ${RT.esc(m)}</div>`).join('');
  exporter.setIssues(msgs.length);
  exporter.refresh();
  RT.save(KEY, S);
}
const update = RT.debounce(() => { render(); hist.push(); }, 80);

document.getElementById('btnUndo').onclick = hist.undo;
document.getElementById('btnRedo').onclick = hist.redo;
document.getElementById('btnExample').onclick = () => {
  Object.assign(S, {
    title: 'Do SGLT2 inhibitors lower the risk of heart failure hospitalisation compared with DPP-4 inhibitors in older adults with type 2 diabetes?',
    popH: 'Population', popN: '20,430', popText: 'Adults ≥ 65 years with type 2 diabetes starting a second-line drug, 2016–2021',
    desH: 'Design', design: 'Active-comparator, new-user cohort', armA: 'SGLT2 inhibitor', armAn: 'n = 10,250', armB: 'DPP-4 inhibitor', armBn: 'n = 10,180', setting: 'Claims database · median follow-up 2.1 years',
    resH: 'Main result', outcome: 'Hospitalisation for heart failure', main: 'HR 0.78 (0.69–0.88)', more: 'Per-protocol: HR 0.72 (0.61–0.85)\nE-value 1.88',
    concl: 'Starting an SGLT2 inhibitor rather than a DPP-4 inhibitor was associated with a lower risk of heart failure hospitalisation.',
    cite: 'Author A, Author B. Journal 2026. doi:10.xxxx/xxxxx',
  });
  syncInputs(); update();
  RT.toast(T('已載入範例（虛構研究，僅供示範；按 ↶ 可復原）', 'Example loaded (a fictional study, for illustration; ↶ to undo)'));
};
document.getElementById('btnReset').onclick = () => { const keep = { accent: S.accent, ratio: S.ratio, st: S.st }; S = { ...structuredClone(DEF), ...keep }; syncInputs(); update(); RT.toast(T('已清空內容（按 ↶ 可復原）', 'Content cleared (↶ to undo)')); };
document.getElementById('btnSaveJson').onclick = () => RT.downloadJSON(S, 'visual_abstract.json');
document.getElementById('btnLoadJson').onclick = async () => { try { S = RT.merge(DEF, await RT.pickJSON()); syncInputs(); update(); } catch (e) { RT.toast(T('讀取失敗：', 'Could not open file: ') + e.message, 6000); } };

syncInputs();
render();
hist.push();
</script>
</body>
</html>
