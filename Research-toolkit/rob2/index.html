<script src="../shared/rob.js?v=20261025b"></script>
<script>
const D = (code, name) => ({ code, name });
const D2to5 = [
  D('D2', 'Bias due to deviations from the intended interventions'),
  D('D3', 'Bias due to missing outcome data'),
  D('D4', 'Bias in measurement of the outcome'),
  D('D5', 'Bias in selection of the reported result'),
];
document.getElementById('app').outerHTML = RT.robPage({
  title: 'RoB 2', subZh: '隨機對照試驗偏誤風險評估（Cochrane RoB 2）', subEn: 'Risk of bias in randomised trials (Cochrane RoB 2)',
  noteZh: 'RoB 2（主版本 2019-08-22；群集與交叉試驗版 2021-03-18）。5 個 domain，判斷為 Low／Some concerns／High。整體：全部 Low → Low；任一 High → High；其餘 → Some concerns（多個 Some concerns 可手動改為 High）。Signalling questions 請用官方工具（riskofbias.info）；RoB 2 評估的是特定結果，請在 ▾ 填寫。',
  noteEn: 'RoB 2 (main tool 2019-08-22; cluster and crossover versions 2021-03-18). 5 domains judged Low / Some concerns / High. Overall: all Low → Low; any High → High; otherwise Some concerns (several Some concerns can be raised to High). Use the official tool (riskofbias.info) for the signalling questions. RoB 2 assesses a specific result: enter it under ▾.',
});
RT.initPage();
RT.robTool({
  key: 'rob2', short: 'RoB 2', filePrefix: 'rob2',
  variants: {
    parallel: { zh: '個別隨機分派、平行組（effect of assignment；2019-08-22 版）', en: 'Individually randomised, parallel group — effect of assignment (22 Aug 2019)', domains: [D('D1', 'Bias arising from the randomization process'), ...D2to5] },
    adhering: { zh: '個別隨機分派、平行組（effect of adhering；2019-08-22 版）', en: 'Individually randomised, parallel group — effect of adhering (22 Aug 2019)', domains: [D('D1', 'Bias arising from the randomization process'), D('D2', 'Bias due to deviations from the intended interventions (effect of adhering to intervention)'), ...D2to5.slice(1)] },
    cluster: { zh: '群集隨機分派（RoB 2 CRT，2021-03-18 版）', en: 'Cluster-randomised trial — RoB 2 CRT (18 Mar 2021)', domains: [D('D1a', 'Bias arising from the randomization process'), D('D1b', 'Bias arising from the timing of identification or recruitment of participants in a cluster-randomized trial'), ...D2to5] },
    crossover: { zh: '交叉試驗（2021-03-18 版）', en: 'Crossover trial (18 Mar 2021)', domains: [D('D1', 'Bias arising from the randomization process'), D('DS', 'Bias arising from period and carryover effects'), ...D2to5] },
  },
  judgments: [
    { v: 'L', label: 'Low risk of bias', zh: '低偏誤風險', sym: '+', color: '#02C100', rank: 0, alias: ['low', 'l'] },
    { v: 'S', label: 'Some concerns', zh: '有些疑慮', sym: '-', color: '#E2DF07', rank: 2, alias: ['some concerns', 'some', 'sc', 'moderate'] },
    { v: 'H', label: 'High risk of bias', zh: '高偏誤風險', sym: 'X', color: '#BF0000', rank: 3, alias: ['high', 'x'] },
  ],
  overall: (vals, J, n) => (vals.includes('H') ? 'H' : vals.includes('S') ? 'S' : 'L'),
  exampleStudies: [
    { name: 'Trial A 2018', j: { D1: 'L', D2: 'L', D3: 'L', D4: 'L', D5: 'L' }, sup: {}, overall: 'auto', result: 'Mortality at 12 months', w: '' },
    { name: 'Trial B 2019', j: { D1: 'L', D2: 'S', D3: 'L', D4: 'L', D5: 'S' }, sup: {}, overall: 'auto', result: 'Mortality at 12 months', w: '' },
    { name: 'Trial C 2020', j: { D1: 'S', D2: 'H', D3: 'L', D4: 'S', D5: 'L' }, sup: {}, overall: 'auto', result: 'Mortality at 12 months', w: '' },
    { name: 'Trial D 2021', j: { D1: 'L', D2: 'L', D3: 'S', D4: 'L', D5: 'L' }, sup: {}, overall: 'auto', result: 'Mortality at 12 months', w: '' },
    { name: 'Trial E 2022', j: { D1: 'H', D2: 'S', D3: 'S', D4: 'L', D5: 'S' }, sup: {}, overall: 'auto', result: 'Mortality at 12 months', w: '' },
  ],
  refs: [RT.REFS.rob2, RT.REFS.rob2V, RT.REFS.riskofbias, RT.REFS.robvis, RT.REFS.libs],
});
</script>
</body>
</html>
