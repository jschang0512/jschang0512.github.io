<script>
const T = RT.t, esc = RT.esc, TW = RT.twDrugs, N = TW.N;
const KEY = 'codelist';
const ROLES = { exposure: ['暴露', 'Exposure'], outcome: ['結果', 'Outcome'], covariate: ['共變項', 'Covariate'], exclusion: ['排除條件', 'Exclusion'], other: ['其他', 'Other'] };
const SYS = { icd10cm: 'ICD-10-CM', icd9cm: 'ICD-9-CM', icd9pcs: 'ICD-9-CM proc', atc: 'ATC', nhi: T('健保代號', 'NHI code') };
const SYS_LONG = { icd10cm: 'ICD-10-CM', icd9cm: 'ICD-9-CM diagnosis', icd9pcs: 'ICD-9-CM procedure', atc: 'ATC', nhi: 'NHI drug code' };
const uid = () => Math.random().toString(36).slice(2, 9);
const newGroup = (name = '', role = 'outcome') => ({ id: uid(), name, role, def: '', items: [] });
const DEF = { title: '', groups: [], active: '', sys: 'icd10cm', expand: false, noDot: true, lang: 'sas', dx: 'icd', px: 'icd_op', rx: 'drug_no', drug: 'nhi' };
let S = RT.merge(DEF, RT.load(KEY, {}));
if (!S.groups.length) { S.groups = [newGroup(T('暴露', 'Exposure'), 'exposure'), newGroup(T('結果', 'Outcome'), 'outcome')]; }
if (!S.groups.some((g) => g.id === S.active)) S.active = S.groups[0].id;
const $ = (id) => document.getElementById(id);
const activeGroup = () => S.groups.find((g) => g.id === S.active) || S.groups[0];

/* ---------- NLM Clinical Tables ---------- */
const CT = 'https://clinicaltables.nlm.nih.gov/api/';
const API = {
  icd10cm: { path: 'icd10cm/v3/search', df: 'code,name', nameSf: 'code,name' },
  icd9cm: { path: 'icd9cm_dx/v3/search', df: 'code_dotted,long_name', nameSf: '' },
  icd9pcs: { path: 'icd9cm_sg/v3/search', df: 'code_dotted,long_name', nameSf: '' },
};
const CODE_RE = {
  icd10cm: /^[A-Z][0-9][0-9A-Z](\.?[0-9A-Z]{0,4})?$/i,
  icd9cm: /^([VE]\d{0,3}|\d{1,3})(\.\d{0,2}|\d{0,2})?$/i,
  icd9pcs: /^\d{1,2}(\.\d{0,2}|\d{0,2})?$/,
};
// what the user typed → [prefix as NLM searches it, prefix as people write it]
function normCode(sys, q) {
  let c = q.toUpperCase().replace(/\s/g, '');
  if (sys === 'icd10cm') { const u = c.replace('.', ''); return u.length > 3 ? [u.slice(0, 3) + '.' + u.slice(3), u.slice(0, 3) + '.' + u.slice(3)] : [u, u]; }
  const u = c.replace('.', '');
  const cut = sys === 'icd9pcs' ? 2 : (u[0] === 'E' ? 4 : 3);
  return [u, u.length > cut ? u.slice(0, cut) + '.' + u.slice(cut) : u];
}
const cache = new Map();
async function ctSearch(sys, terms, byCode, max = 100, offset = 0) {
  const a = API[sys];
  const p = new URLSearchParams({ terms, maxList: String(max), df: a.df });
  if (offset) p.set('offset', String(offset));
  if (byCode) p.set('sf', 'code'); else if (a.nameSf) p.set('sf', a.nameSf);
  const url = CT + a.path + '?' + p;
  if (cache.has(url)) return cache.get(url);
  const pr = fetch(url).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then((j) => ({ total: j[0], rows: (j[3] || []).map((d) => ({ code: String(d[0]).trim(), name: String(d[1] || '').trim() })) }));
  cache.set(url, pr); pr.catch(() => cache.delete(url));
  return pr;
}
async function expandPrefix(sys, prefix) {
  const [terms] = normCode(sys, prefix);
  const first = await ctSearch(sys, terms, true, 500, 0);
  let rows = first.rows.slice();
  for (let off = 500; off < Math.min(first.total, 10000); off += 500) rows = rows.concat((await ctSearch(sys, terms, true, 500, off)).rows);
  return rows;
}

/* ---------- ATC class names (RxNav RxClass, levels 1-4) ---------- */
const atcNames = (() => { try { return JSON.parse(localStorage.getItem('rt:atcnames') || '{}'); } catch (e) { return {}; } })();
async function atcName(code) {
  if (atcNames[code]) return atcNames[code];
  try {
    const j = await (await fetch('https://rxnav.nlm.nih.gov/REST/rxclass/class/byId.json?classId=' + encodeURIComponent(code))).json();
    const c = j?.rxclassMinConceptList?.rxclassMinConcept?.[0];

// ICD-10-CM: names of header codes (I50, I50.2 …) and chapters › sections › categories, from the CDC release files
let heads = null, tree10 = null, secOf = null, headsP = null;
function loadHeads() {

// ICD-9-CM: names of categories (394) and subcategories (250.0; procedures 39, 39.9), from the CDC FY2012 tabular lists
let heads9 = null, heads9P = null;
function loadHeads9() {

function chapter9(sys, code) {

// the two-character prefixes NLM is asked for to list a whole ICD-9 chapter (chapters start and end on whole tens)
function chapterPrefixes(sys, range) {

  names.forEach((n) => { while (p && !n.startsWith(p)) p = p.slice(0, -1); });
  if (names.every((n) => n === p || /^[\s,;(]/.test(n.slice(p.length)))) { p = p.replace(/[\s,;(-]+$/, '').trim(); if (p.length >= 4) return p; }

/* ---------- rows: one checkbox, code, name and state per code or branch ---------- */
const rowAttrs = (sys, code, kind, name) => `data-row data-sys="${sys}" data-code="${esc(code)}" data-kind="${kind}" data-name="${esc(name || '')}"`;

function stateHTML(g, sys, code, kind, primary) {

  if (kind === 'prefix') {
    if (have) return `<span class="in">${sys === 'atc' ? T('已加入', 'Added') : T('已加入分支', 'Branch added')}</span>`;
    if (cov) return `<span class="in">${T('在', 'In')} ${esc(cov.code)}</span>`;
    return `<button type="button" data-act="add"${primary ? ' class="primary small"' : ''}>${sys === 'atc' ? (primary ? T('加入整類', 'Add class') : '＋ ATC') : T('加入分支', 'Add branch')}</button>`;
  }
  if (have) return `<span class="in${have.excl ? ' ex' : ''}">${have.excl ? T('已排除', 'Excluded') : T('已加入', 'Added')}</span>`;
  if (cov) return `<button type="button" data-act="excl" title="${T('包含在分支', 'In branch')} ${esc(cov.code)}${T('；按一下排除這個代碼', '; press to leave this code out')}">${T('排除', 'Exclude')}</button>`;
  return `<button type="button" data-act="add">＋</button>`;
}
function leafHTML(g, sys, code, name, o = {}) {

function searchTree(g, rows, q) {

  const sys = S.sys, L = sys === 'icd9pcs' ? 2 : 3;

// ATC levels: 1 (C) › 2 (C10) › 3 (C10A) › 4 (C10AA) › 5 (C10AA05), counted in NHI codes
const ATC_LEN = [1, 3, 4, 5, 7];
function atcLevel(g, parent) {

async function loadLazy(d) {

        inner: sec[2].map(([c, name, kids]) => (kids ? nodeHTML(g, 'icd10cm', { code: c, name, lazy: 'cat:' + c }) : leafHTML(g, 'icd10cm', c, name))).join('') })).join('');

      ul.innerHTML = [...cats.entries()].map(([c, rs]) => (rs.length === 1 && rs[0].code === c ? leafHTML(g, sys, c, rs[0].name)
        : nodeHTML(g, sys, { code: c, name: headName(sys, c, rs), count: nCodes(rs.length), inner: buildTree(g, sys, rs, nodot(c).length + 1, false) }))).join('');
      const sm = d.querySelector(':scope > summary .nm'); if (sm && !sm.querySelector('small')) sm.insertAdjacentHTML('beforeend', `<small>${T(`${cats.size} 個大分類`, `${cats.size} categories`)}</small>`);

/* ---------- ticks ---------- */
// what "Add checked" adds: fully ticked branches as branches, other ticked codes one by one
function picked() {
  const out = [];

    const d = li.querySelector(':scope > details');
    if (d) {

  S.groups.push(...made); S.active = made[0].id;
  commit();
  RT.toast(T(`已建立 ${made.length} 個「${P.zh}」群組`, `${made.length} groups added: ${P.en}`) + (skipped ? T(`；${skipped} 個代碼在現行代碼表裡沒有（WHO 版 ICD-10 專用，或 Quan 以範圍列出的空號），已略過`, `; ${skipped} codes with no match in the code sets (WHO-only ICD-10 codes, or unused codes inside Quan’s ranges) were left out`) : ''), 6000);
  fillNames(made.flatMap((g) => g.items));
}
$('addPreset').onclick = () => { const b = $('presetBox'); b.hidden = !b.hidden; $('addPreset').setAttribute('aria-expanded', String(!b.hidden)); };
$('presetGo').onclick = async () => {
  const btn = $('presetGo'); btn.disabled = true;
  try { await addPreset($('presetSet').value, $('presetVer').value); $('presetBox').hidden = true; $('addPreset').setAttribute('aria-expanded', 'false'); }
  catch (e) { RT.toast(T('共病定義載入失敗，請稍後再試', 'Could not load the definitions; try again later'), 5000); }
  finally { btn.disabled = false; }
};

/* ---------- handoff from the drug lookup ---------- */
function takeHandoff() {
  let q = []; try { q = JSON.parse(localStorage.getItem('rt:handoff-codes') || '[]'); } catch (e) { q = []; }
  if (!q.length) return;
  try { localStorage.removeItem('rt:handoff-codes'); } catch (e) { /* ignore */ }
  addItems(q.map((x) => ({ sys: x.sys, code: x.code, name: x.name, kind: x.kind || 'code' })));
}
window.addEventListener('storage', (e) => { if (e.key === 'rt:handoff-codes') takeHandoff(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) takeHandoff(); });

/* ---------- undo, example, clear ---------- */
function syncAll() {
  $('title').value = S.title; $('oExpand').checked = S.expand; $('oNoDot').checked = S.noDot; $('oLang').value = S.lang; $('oDrug').value = S.drug; $('oDx').value = S.dx; $('oPx').value = S.px; $('oRx').value = S.rx;
  syncSys(); renderGroups(); renderSnip(); warn();
}
const hist = RT.history(() => S, (s) => { S = s; syncAll(); });
$('btnUndo').onclick = hist.undo; $('btnRedo').onclick = hist.redo;
$('btnExample').onclick = () => {
  S.title = 'Statins and incident heart failure';
  const gx = { ...newGroup('Statins', 'exposure'), def: T('≥2 次處方，間隔 ≤30 天', '≥2 prescriptions ≤30 days apart'), items: [{ sys: 'atc', code: 'C10AA', kind: 'prefix', name: 'HMG CoA reductase inhibitors' }] };
  const gy = { ...newGroup('Heart failure', 'outcome'), def: T('≥1 次住院主診斷，或 ≥2 次門診診斷', '≥1 inpatient primary or ≥2 outpatient diagnoses'), items: [
    { sys: 'icd10cm', code: 'I50', kind: 'prefix', name: 'Heart failure' }, { sys: 'icd10cm', code: 'I11.0', name: 'Hypertensive heart disease with heart failure' }, { sys: 'icd9cm', code: '428', kind: 'prefix', name: 'Heart failure' }] };
  const gc = { ...newGroup('Type 2 diabetes', 'covariate'), def: T('基準日前一年內 ≥2 次門診', '≥2 outpatient diagnoses in the year before Day 0'), items: [
    { sys: 'icd10cm', code: 'E11', kind: 'prefix', name: 'Type 2 diabetes mellitus' }, { sys: 'icd10cm', code: 'E11.A', name: 'Type 2 diabetes mellitus without complications in remission', excl: true }, { sys: 'icd9cm', code: '250', kind: 'prefix', name: 'Diabetes mellitus' }] };
  S.groups = [gx, gy, gc]; S.active = gx.id;
  syncAll(); commit();
  RT.toast(T('已載入範例（按 ↶ 可復原）', 'Example loaded (↶ to undo)'));
};
$('btnReset').onclick = () => { S.title = ''; S.groups = [newGroup(T('暴露', 'Exposure'), 'exposure'), newGroup(T('結果', 'Outcome'), 'outcome')]; S.active = S.groups[0].id; syncAll(); commit(); RT.toast(T('已清空（按 ↶ 可復原）', 'Cleared (↶ to undo)')); };
RT.currentState = () => S;
RT.applyState = (o) => { S = RT.merge(DEF, o); if (!S.groups.length) S.groups = [newGroup()]; S.active = S.groups[0].id; syncAll(); commit(); };

/* ---------- start ---------- */
$('refs').innerHTML = RT.refsHTML([

  'National Center for Health Statistics (CDC). ICD-10-CM FY2026 code descriptions in tabular order (names of category and subcategory codes). ftp.cdc.gov/pub/Health_Statistics/NCHS/Publications/ICD10CM',
  'National Center for Health Statistics (CDC). ICD-9-CM tabular lists, FY2012 final edition (names of category and subcategory codes). ftp.cdc.gov/pub/Health_Statistics/NCHS/Publications/ICD9-CM',
  'Centers for Medicare & Medicaid Services; National Center for Health Statistics (CDC). 2018 ICD-10-CM and ICD-9-CM diagnosis General Equivalence Mappings (GEMs). ftp.cdc.gov/pub/Health_Statistics/NCHS/Publications/ICD10CM/2018',
  'Quan H, Sundararajan V, Halfon P, et al. Coding algorithms for defining comorbidities in ICD-9-CM and ICD-10 administrative data. Med Care 2005;43:1130–9.',
  'Charlson ME, Pompei P, Ales KL, MacKenzie CR. A new method of classifying prognostic comorbidity in longitudinal studies: development and validation. J Chronic Dis 1987;40:373–83.',
  'Elixhauser A, Steiner C, Harris DR, Coffey RM. Comorbidity measures for use with administrative data. Med Care 1998;36:8–27.',
  'Gasparini A. comorbidity: an R package for computing comorbidity scores. J Open Source Softw 2018;3:648 (code lists checked against it).',
  'US National Library of Medicine. RxNav RxClass API (ATC class names). lhncbc.nlm.nih.gov/RxNav',
  'WHO Collaborating Centre for Drug Statistics Methodology. ATC/DDD Index. atcddd.fhi.no',
  'Hsieh CY, et al. Taiwan’s National Health Insurance Research Database: past and future. Clin Epidemiol 2019;11:349–58.',
], [T('隱私：ICD 搜尋字詞會送到美國國家醫學圖書館（NLM）的 Clinical Tables 服務以取得代碼；ATC 類別名稱查自 NLM RxNav。代碼清單本身只存在你的瀏覽器。', 'Privacy: ICD search terms are sent to the US National Library of Medicine’s Clinical Tables service to fetch codes; ATC class names come from NLM RxNav. The code list itself stays in your browser.'), TW.sourceNote()]);
syncAll();
runSearch();
fillCounts();
takeHandoff();
setTimeout(takeHandoff, 300);
hist.push();
</script>
