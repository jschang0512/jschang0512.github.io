<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投稿與專案追蹤</title>
<meta name="description" content="投稿與專案追蹤：研究專案的 IRB 與資料申請、每篇論文的每一輪投稿、和 reviewer 的來往與回覆信。需要邀請碼註冊。">
<link rel="canonical" href="https://jschang0512.github.io/Research-toolkit/submissions/">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2347b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="投稿與專案追蹤">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Research Toolkit">
<meta property="og:title" content="投稿與專案追蹤">
<meta property="og:description" content="研究專案、每一輪投稿與 reviewer 的來往，都在同一個地方。">
<meta property="og:url" content="https://jschang0512.github.io/Research-toolkit/submissions/">
<meta property="og:image" content="https://jschang0512.github.io/assets/og/research-toolkit.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
<div class="boot" id="boot" aria-hidden="true"><img src="icons/icon.svg" alt="" width="56" height="56"></div>

<!-- ===== signed out ===== -->
<section class="auth" id="auth" hidden>
  <div class="auth-brand"><img src="icons/icon.svg" alt="" width="52" height="52"><h1 id="auth-title"></h1><p id="auth-sub"></p></div>
  <div class="auth-card">
    <div class="seg" role="tablist" id="auth-tabs">
      <button type="button" role="tab" id="tab-in" aria-selected="true"></button>
      <button type="button" role="tab" id="tab-up" aria-selected="false"></button>
    </div>
    <form id="f-in" autocomplete="on" novalidate>
      <label class="f"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="f"><span data-t="password"></span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn primary block" type="submit" data-t="signIn"></button>
      <button class="link" type="button" id="btn-forgot" data-t="forgot"></button>
    </form>
    <form id="f-up" autocomplete="on" novalidate hidden>
      <label class="f"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="f"><span data-t="newPassword"></span><input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
      <label class="f"><span data-t="confirmPassword"></span><input type="password" name="password2" autocomplete="new-password" required minlength="8"></label>
      <label class="f"><span data-t="inviteCode"></span><input name="code" required autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX"></label>
      <button class="btn primary block" type="submit" data-t="createAccount"></button>
    </form>
    <form id="f-reset" novalidate hidden>
      <p class="muted" data-t="chooseNewPassword"></p>
      <label class="f"><span data-t="newPassword"></span><input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
      <label class="f"><span data-t="confirmPassword"></span><input type="password" name="password2" autocomplete="new-password" required minlength="8"></label>
      <button class="btn primary block" type="submit" data-t="savePassword"></button>
    </form>
    <p class="msg" id="auth-msg" role="status" aria-live="polite" hidden></p>
  </div>
  <p class="auth-foot" data-t="privacy"></p>
  <p class="auth-foot"><a href="../index.html">Research Toolkit</a> · <button class="link" type="button" id="auth-lang"></button></p>
</section>

<!-- ===== signed in ===== -->
<div class="shell" id="shell" hidden>
  <nav class="side" aria-label="Main">
    <div class="brand"><img src="icons/icon.svg" alt="" width="30" height="30"><span id="brand-name"></span></div>
    <div class="nav" id="nav-side"></div>
    <div class="side-foot" id="side-who"></div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
  <nav class="tabbar" id="nav-bottom" aria-label="Main"></nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="app.js?v=20261119a"></script>
</body>
</html>
