<body>
<header class="topbar">
  <a class="back" href="../index.html" data-en="← Home">← 工具首頁</a>
  <h1 data-en="Graphical Abstract">圖文摘要</h1>
  <span class="sub" data-en="Study question, population, comparison and results on one image">研究問題、族群、比較組與結果，排成一張圖</span>
  <span class="spacer"></span>
  <div class="btns">
    <button class="small" id="btnUndo" title="復原 (Ctrl+Z)" data-en-title="Undo (Ctrl+Z)">↶</button>
    <button class="small" id="btnRedo" title="重做 (Ctrl+Y)" data-en-title="Redo (Ctrl+Y)">↷</button>
    <button class="small" id="btnSaveJson" title="下載 .json，之後可再開啟或傳給共同作者" data-en-title="Download a .json file to reopen later or share with co-authors" data-en="Save project">儲存專案</button>
    <button class="small" id="btnLoadJson" title="匯入先前儲存的 .json 專案檔，還原所有輸入" data-en-title="Import a previously saved .json project file" data-en="Import project">匯入專案</button>
    <button class="small" id="btnExample" data-en="Example">範例</button>
    <button class="small" id="btnReset" data-en="Clear">清空</button>
  </div>
</header>

<main class="tool">
  <section id="form">
    <div class="card">
      <p class="hint" style="margin:0" data-en="Fill in the parts below; the abstract lays itself out and shrinks the text when it gets crowded. Click any text on the preview to jump to its field. The headings and wording on the image are in English, as journals ask.">填入下面各欄，圖會自動排版，字太多時自動縮小。點預覽上的任何文字可以跳到對應欄位。圖上的標題和文字照期刊慣例用英文。</p>
    </div>
    <div class="card">
      <h2><span class="step-no">1</span> <span data-en="Layout and colour">版型與顏色</span></h2>
      <label class="field"><span data-en="Layout">版型</span><select data-k="layout">
        <option value="wide" data-en="Landscape, three panels (5:2, e.g. Elsevier, 1328 × 531)">橫式三欄（5:2，Elsevier 等，1328 × 531）</option>
        <option value="square" data-en="Square (1:1, Cell Press and social posts, 1080 × 1080)">正方形（1:1，Cell Press、社群，1080 × 1080）</option>
        <option value="slide" data-en="16:9 visual abstract (slides, X, LinkedIn, 1600 × 900)">16:9 視覺摘要（簡報、X、LinkedIn，1600 × 900）</option></select></label>
      <div class="field"><span data-en="Colour">主題色</span><div class="theme-row" id="themes"></div></div>
      <label class="field" data-show="theme=custom"><span data-en="Your colour">自訂顏色</span><input type="color" data-k="custom" style="width:100%"></label>
      <label class="check"><input type="checkbox" data-k="grow"> <span data-en="Enlarge the text to fill spare room">有空間時自動放大字</span></label>
      <details><summary data-en="Font and size">字型與字級</summary><div id="styleFields"></div></details>
    </div>
    <div class="card">
      <h2><span class="step-no">2</span> <span data-en="The study">研究</span></h2>
      <label class="field"><span data-en="Study question (the title)">研究問題（當標題）</span><textarea data-k="title" rows="2" placeholder="e.g. SGLT2 inhibitors vs DPP-4 inhibitors and kidney outcomes"></textarea></label>
      <label class="field"><span data-en="Design and data source (under the title)">研究設計與資料來源（標題下方）</span><input data-k="design" placeholder="e.g. Retrospective cohort · Taiwan NHI database 2016–2022"></label>
    </div>
    <div class="card">
      <h2><span class="step-no">3</span> <span data-en="Population">族群</span></h2>
      <div class="grid2">
        <label class="field"><span data-en="Number of people">人數</span><input data-k="pop.n" placeholder="48,210"></label>
        <div class="field"><span data-en="Icon">圖示</span><button type="button" class="ic-pick" data-ik="pop.icon"></button></div>
      </div>
      <label class="field"><span data-en="Who they are">族群描述</span><input data-k="pop.label" placeholder="e.g. Adults with type 2 diabetes"></label>
      <label class="field"><span data-en="More detail (optional)">補充（選填）</span><input data-k="pop.note" placeholder="e.g. eGFR ≥ 30, new users"></label>
      <h3 class="sub-h" data-en="Selection (optional)">篩選流程（選填）</h3>
      <div class="grid2">
        <label class="field"><span data-en="Screened">篩選人數</span><input data-k="pop.screened" placeholder="92,400" inputmode="numeric"></label>
        <label class="field"><span data-en="Excluded (blank = worked out)">排除人數（留空＝自動算）</span><input data-k="pop.excluded" placeholder="44,190" inputmode="numeric"></label>
      </div>
      <p class="hint" style="margin:0" data-en="Included is the number of people above.">納入人數就是上面的「人數」。</p>
      <h3 class="sub-h" data-en="Baseline facts (up to 4, optional)">基線特徵（最多 4 項，選填）</h3>
      <div id="baseRows"></div>
      <h3 class="sub-h" data-en="Pictograph of 100 people (optional)">100 人比例圖（選填）</h3>
      <div class="grid2">
        <label class="field"><span data-en="What it shows">呈現什麼</span><input data-k="pop.pictoLabel" placeholder="Women"></label>
        <label class="field"><span data-en="Per cent (0–100)">百分比（0–100）</span><input data-k="pop.pictoPct" placeholder="44" inputmode="decimal"></label>
      </div>
    </div>
    <div class="card">
      <h2><span class="step-no">4</span> <span data-en="Comparison">比較組</span></h2>
      <div class="grid2">
        <label class="field"><span data-en="Group A">A 組</span><input data-k="armA.label" placeholder="SGLT2i"></label>
        <label class="field"><span data-en="Group A, number">A 組人數</span><input data-k="armA.n" placeholder="21,034"></label>
        <label class="field"><span data-en="Group B">B 組</span><input data-k="armB.label" placeholder="DPP-4i"></label>
        <label class="field"><span data-en="Group B, number">B 組人數</span><input data-k="armB.n" placeholder="27,176"></label>
        <label class="field"><span data-en="Group A, what it is (optional)">A 組說明（選填）</span><input data-k="armA.detail" placeholder="empagliflozin, dapagliflozin"></label>
        <label class="field"><span data-en="Group B, what it is (optional)">B 組說明（選填）</span><input data-k="armB.detail" placeholder="sitagliptin, linagliptin"></label>
        <div class="field"><span data-en="Group A icon">A 組圖示</span><button type="button" class="ic-pick" data-ik="armA.icon"></button></div>
        <div class="field"><span data-en="Group B icon">B 組圖示</span><button type="button" class="ic-pick" data-ik="armB.icon"></button></div>
      </div>
      <p class="hint" style="margin:0" data-en="With both numbers filled in, a bar shows how the people split between the groups.">兩組人數都填了，會畫出兩組人數比例條。</p>
      <label class="field"><span data-en="Primary outcome (optional)">主要結果定義（選填）</span><input data-k="outcome" placeholder="≥ 40% eGFR decline, kidney failure or renal death"></label>
      <h3 class="sub-h" data-en="Design and analysis labels (up to 4, optional)">設計與分析標籤（最多 4 個，選填）</h3>
      <div class="grid2" id="tagRows">
        <input data-i="0" data-k="tags.0" placeholder="PS weighted (IPTW)" aria-label="1"><input data-i="1" data-k="tags.1" placeholder="Median 3.1 years" aria-label="2">
        <input data-i="2" data-k="tags.2" placeholder="Balanced: SMD < 0.1" aria-label="3"><input data-i="3" data-k="tags.3" placeholder="New-user design" aria-label="4">
      </div>
    </div>
    <div class="card">
      <h2><span class="step-no">5</span> <span data-en="Results (up to 3)">結果（最多 3 項）</span></h2>
      <div id="res"></div>
      <button class="small" id="addRes" data-en="+ Add result">＋ 新增結果</button>
      <div class="grid2" style="margin-top:8px">
        <label class="field"><span data-en="Left of the line says">線左側寫</span><input data-k="favA" placeholder="Favours SGLT2i"></label>
        <label class="field"><span data-en="Right of the line says">線右側寫</span><input data-k="favB" placeholder="Favours DPP-4i"></label>
      </div>
    </div>
    <div class="card">
      <h2><span class="step-no">6</span> <span data-en="Conclusion and source">結論與出處</span></h2>
      <label class="field"><span data-en="Conclusion">結論</span><textarea data-k="concl" rows="2" placeholder="e.g. SGLT2 inhibitors were associated with better kidney outcomes than DPP-4 inhibitors."></textarea></label>
      <label class="field"><span data-en="Citation (optional)">出處（選填）</span><input data-k="cite" placeholder="e.g. Author et al. J Example 2026 · doi:10.xxxx"></label>
      <details><summary data-en="Panel headings">各區標題</summary>
        <div class="grid2">
          <label class="field"><span data-en="Population">族群</span><input data-k="hPop"></label>
          <label class="field"><span data-en="Comparison">比較組</span><input data-k="hComp"></label>
          <label class="field"><span data-en="Results">結果</span><input data-k="hRes"></label>
          <label class="field"><span data-en="Conclusion">結論</span><input data-k="hConcl"></label>
        </div>
      </details>
    </div>
  </section>

  <section class="preview-col">
    <div class="paper" id="preview"></div>
    <div class="msgs" id="msgs"></div>
    <div class="card" id="export"></div>
  </section>
</main>

<dialog class="icons" id="iconDlg" aria-label="選擇圖示">
  <div class="ic-head"><input type="search" id="icQ" placeholder="搜尋圖示，例如 腎、pill" data-en-ph="Search, e.g. kidney, pill" aria-label="搜尋圖示"><button type="button" class="small" id="icNone" data-en="No icon">不要圖示</button><button type="button" class="small" id="icClose" data-en="Close">關閉</button></div>
  <div class="ic-body" id="icBody"></div>
</dialog>

<script src="../shared/common.js?v=20261127c"></script>
<script src="icons.js?v=1"></script>
<script>
const T = RT.t;
const KEY = 'gabstract1';
const res = (o = {}) => ({ label: '', measure: 'HR', est: '', lo: '', hi: '', icon: '', ...o });
const DEF = {
  layout: 'wide', theme: 'teal', custom: '#2D6A9F', grow: true,
  title: '', design: '',
  pop: { n: '', label: '', note: '', icon: 'people', screened: '', excluded: '', base: [{ k: '', v: '' }, { k: '', v: '' }, { k: '', v: '' }, { k: '', v: '' }], pictoLabel: '', pictoPct: '' },
  armA: { label: '', n: '', icon: 'capsule', detail: '' }, armB: { label: '', n: '', icon: 'tablet', detail: '' },
  outcome: '', tags: ['', '', '', ''],
  res: [res()], favA: '', favB: '',
  concl: '', cite: '',
  hPop: 'Population', hComp: 'Comparison', hRes: 'Results', hConcl: 'Conclusion',
  st: { ...RT.STYLE_DEF, fontSize: 20 },
};
let S = RT.load(KEY, DEF);
// earlier versions had one field for the analysis and one for follow-up: they become the first two labels
const upgrade = (s) => { if ((s.method || s.follow) && !(s.tags || []).some(Boolean)) s.tags = [s.method || '', s.follow || '', '', ''].filter((t, i) => t || i > 1).concat(['', '', '', '']).slice(0, 4); delete s.method; delete s.follow; return s; };
S = upgrade(S);

/* ---------------- colours and sizes ---------------- */
const THEMES = {
  teal: ['#0F6E56', '#E1F5EE', '#04342C'], blue: ['#185FA5', '#E6F1FB', '#042C53'], purple: ['#534AB7', '#EEEDFE', '#26215C'],
  coral: ['#993C1D', '#FAECE7', '#4A1B0C'], green: ['#3B6D11', '#EAF3DE', '#173404'], slate: ['#444441', '#F1EFE8', '#2C2C2A'],
};
const mix = (a, b, t) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const palette = () => { if (S.theme === 'custom' && /^#[\da-f]{6}$/i.test(S.custom)) return [S.custom, mix(S.custom, '#ffffff', 0.88), mix(S.custom, '#000000', 0.55)]; return THEMES[S.theme] || THEMES.teal; };
const SIZE = { wide: [1328, 531, 1], square: [1080, 1080, 1.05], slide: [1600, 900, 1.2] };
const GREY = '#7B7A75', MUTED = '#5F5E5A', LINE = '#B4B2A9';
const RATIO = ['HR', 'OR', 'RR', 'IRR', 'sHR'], DIFF = ['RD', 'MD'];

/* ---------------- drawing ---------------- */
const textBox = (text, w, size, o = {}) => RT.box([{ text, bold: !!o.bold, color: o.color }], w, { size, pad: 0, padX: 0, lh: o.lh || 1.25, align: o.align || 'left', fill: 'none', stroke: 'none', color: o.color || '#000' });
const num = (v) => { const n = parseFloat(String(v).replace(/,/g, '')); return Number.isFinite(n) ? n : null; };
const fmt = (v) => (v === null ? '' : Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(2));
function resultsOk() { return S.res.filter((r) => num(r.est) !== null); }

// one attempt at a given text scale; returns the SVG body and whether anything spilled out of its panel
// off: how far down each panel's content starts, so it can sit in the middle of its panel; need: how tall it came out
function compose(k, off = {}, o = {}) {
  const need = {}, room = {};
  RT.beginScene();
  const [W, H, lf] = SIZE[S.layout] || SIZE.wide, [dark, light, ink] = palette();
  const fs = (Number(S.st.fontSize) || 20) * lf * k, M = 24 * lf, G = 16 * lf, PAD = 14 * lf;
  let body = '', spill = false;
  const ph = (v, p) => (v && String(v).trim() ? { t: v, ph: false } : { t: p, ph: true });     // placeholder text when a field is empty
  // header: title and design line on the theme colour
  const tt = ph(S.title, 'Study question'), dd = S.design ? { t: S.design } : null;
  const tb = textBox(tt.t, W - 2 * M - 2 * PAD, fs * 1.45, { bold: true, color: tt.ph ? mix(light, dark, 0.35) : '#FFFFFF' });
  const db = dd ? textBox(dd.t, W - 2 * M - 2 * PAD, fs * 0.92, { color: light }) : null;
  const hh = PAD * 1.6 + tb.h + (db ? fs * 0.3 + db.h : 0);
  body += RT.rect(0, 0, W, hh, { fill: dark });
  body += RT.drawBox(tb, M + PAD, PAD * 0.8); RT.addHit(M + PAD, PAD * 0.8, tb.w, tb.h, RT.hitKey('title'));
  if (db) { body += RT.drawBox(db, M + PAD, PAD * 0.8 + tb.h + fs * 0.3); RT.addHit(M + PAD, PAD * 0.8 + tb.h + fs * 0.3, db.w, db.h, RT.hitKey('design')); }
  // footer: conclusion band, citation under it
  const cc = ph(S.concl, 'Conclusion of the study in one sentence.');
  const head = (S.hConcl || 'Conclusion') + ': ';
  const cw = W - 2 * M - 2 * PAD;
  const cb = RT.box([{ text: head + cc.t, bold: false, color: cc.ph ? mix(light, dark, 0.35) : '#FFFFFF' }], cw, { size: fs * 1.02, pad: 0, padX: 0, lh: 1.3, align: 'left', fill: 'none', stroke: 'none' });
  const citeH = S.cite ? fs * 0.75 * 1.4 + 4 * lf : 0;
  const fh = cb.h + PAD * 1.4, fy = H - M - citeH - fh;
  body += RT.rect(M, fy, W - 2 * M, fh, { fill: dark, radius: 10 * lf });
  body += RT.drawBox(cb, M + PAD, fy + PAD * 0.7); RT.addHit(M + PAD, fy + PAD * 0.7, cb.w, cb.h, RT.hitKey('concl'));
  if (S.cite) { body += RT.rich([{ runs: [{ t: S.cite, size: fs * 0.75, color: GREY }] }], W - M, fy + fh + 4 * lf, { lh: fs * 0.75 * 1.4, anchor: 'end' }); RT.addHit(W - M - RT.textWidth(S.cite, fs * 0.75) - 6, fy + fh + 4 * lf, RT.textWidth(S.cite, fs * 0.75) + 6, fs * 1.05, RT.hitKey('cite')); }
  // the middle: three panels side by side, or two over one when square
  const top = hh + G, bot = fy - G, ah = bot - top, aw = W - 2 * M;
  let P;
  if (S.layout === 'square') { const h1 = (ah - G) * 0.56; P = { pop: [M, top, (aw - G) / 2, h1], comp: [M + (aw + G) / 2, top, (aw - G) / 2, h1], res: [M, top + h1 + G, aw, ah - h1 - G] }; }
  else { const w3 = (aw - 2 * G) / 3; P = { pop: [M, top, w3, ah], comp: [M + w3 + G, top, w3, ah], res: [M + 2 * (w3 + G), top, w3, ah] }; }
  const panel = (x, y, w, h, title, fill, stroke) => {
    body += RT.rect(x, y, w, h, { fill, stroke: stroke || 'none', sw: 1, radius: 10 * lf });
    const t = textBox(title.toUpperCase(), w - 2 * PAD, fs * 0.78, { bold: true, color: ink });
    body += RT.drawBox(t, x + PAD, y + PAD); return y + PAD + t.h + fs * 0.5;
  };
  // population: the number, who they are, how they were selected, a few baseline facts, a pictograph
  {
    const [x, y, w, h] = P.pop; let cy = panel(x, y, w, h, S.hPop || 'Population', light); const c0 = cy; room.pop = y + h - PAD - cy; cy += off.pop || 0;
    const iw = w - 2 * PAD;
    const iz = Math.min(fs * 2.6, w * 0.24);
    if (S.pop.icon) body += RT.medIcon(S.pop.icon, x + PAD, cy, iz, dark);
    const nn = ph(S.pop.n, 'n = ?');
    const nx = x + PAD + (S.pop.icon ? iz + fs * 0.6 : 0);
    const nb = textBox(nn.t, x + w - PAD - nx, fs * 1.8, { bold: true, color: nn.ph ? GREY : ink });
    body += RT.drawBox(nb, nx, cy + Math.max(0, (iz - nb.h) / 2)); RT.addHit(nx, cy, nb.w, Math.max(iz, nb.h), RT.hitKey('pop.n'));
    cy += Math.max(iz, nb.h) + fs * 0.4;
    const lb = ph(S.pop.label, 'Who the people are');

  fontSize: { get: () => S.st.fontSize, set: (v) => { S.st.fontSize = v; syncInputs(); update(); } },
});
const hist = RT.history(() => S, (s) => { S = s; syncInputs(); render(); });
function render() {
  try { fig = build(); preview.innerHTML = fig.svg; }
  catch (e) { console.error(e); preview.innerHTML = `<div class="msg">⚠ ${RT.esc(e.message)}</div>`; }
  const msgs = [];
  const empty = [[S.title, T('研究問題', 'study question')], [S.pop.n || S.pop.label, T('族群', 'population')], [S.armA.label && S.armB.label, T('比較組', 'comparison groups')], [resultsOk().length, T('結果', 'results')], [S.concl, T('結論', 'conclusion')]].filter(([v]) => !v).map(([, n]) => n);
  if (empty.length) msgs.push(T(`還沒填：${empty.join('、')}（圖上暫時顯示灰色提示字，匯出前請補上）`, `Not filled in yet: ${empty.join(', ')} (grey placeholders show on the image until then)`));
  if (fig && fig.spill) msgs.push(T('內容太多，字已縮到最小仍塞不下：請縮短文字，或改用較大的版型', 'Too much text even at the smallest size: shorten it or pick a larger layout'));
  if (fig && fig.dropped) msgs.push(T('版面放不下比例小人圖，已先省略：可改用正方形或 16:9 版型，或減少其他內容', 'No room for the pictograph, so it is left out: try the square or 16:9 layout, or shorten other parts'));
  if (fig && fig.spill) {} else if (fig && fig.shrunk) msgs.push(T(`字較多，已自動縮小到 ${Math.round(fig.scaleUsed * 100)}%`, `Text shrunk to ${Math.round(fig.scaleUsed * 100)}% to fit`));
  const kinds = new Set(resultsOk().map((r) => (DIFF.includes(r.measure) ? 'diff' : 'ratio')));
  if (kinds.size > 1) msgs.push(T('結果混用比值（HR、OR…）與差值（RD、MD），圖上的座標以第一項為準，請分開呈現', 'Ratios (HR, OR…) and differences (RD, MD) are mixed; the axis follows the first result, so keep them apart'));
  S.res.forEach((r, i) => { const e = num(r.est), l = num(r.lo), u = num(r.hi); if (e !== null && l !== null && u !== null && !(l <= e && e <= u)) msgs.push(T(`結果 ${i + 1} 的估計值不在信賴區間內`, `Result ${i + 1}: the estimate is not between its limits`)); if (!DIFF.includes(r.measure) && [e, l, u].some((v) => v !== null && v <= 0)) msgs.push(T(`結果 ${i + 1}：比值必須大於 0`, `Result ${i + 1}: ratios must be greater than 0`)); });
  $('msgs').innerHTML = msgs.map((m) => `<div class="msg">⚠ ${RT.esc(m)}</div>`).join('');
  exporter.setIssues(msgs.filter((m) => !/縮小到|shrunk|小人圖|pictograph/.test(m)).length);
  exporter.refresh();
  RT.save(KEY, S);
}
const update = RT.debounce(() => { render(); hist.push(); }, 80);
RT.refresh = update; RT.renderNow = render;

$('btnUndo').onclick = hist.undo;
$('btnRedo').onclick = hist.redo;
$('btnExample').onclick = () => {
  S = RT.merge(DEF, {
    layout: S.layout, theme: S.theme, custom: S.custom, st: S.st,
    title: 'SGLT2 inhibitors vs DPP-4 inhibitors and kidney outcomes in type 2 diabetes',
    design: 'Retrospective cohort · nationwide claims database, 2016–2022',
    pop: { n: '48,210', label: 'Adults with type 2 diabetes starting a second-line drug', note: 'New users, eGFR ≥ 30', icon: 'people', screened: '92,400', excluded: '', base: [{ k: 'Mean age', v: '62 years' }, { k: 'Women', v: '44%' }, { k: 'Chronic kidney disease', v: '18%' }, { k: 'Prior heart failure', v: '9%' }], pictoLabel: 'Women', pictoPct: '44' },
    armA: { label: 'SGLT2i', n: '21,034', icon: 'capsule', detail: 'empagliflozin, dapagliflozin' }, armB: { label: 'DPP-4i', n: '27,176', icon: 'tablet', detail: 'sitagliptin, linagliptin' },
    outcome: '≥ 40% eGFR decline, kidney failure or renal death',
    tags: ['PS weighted (IPTW)', 'Median 3.1 years', 'Balanced: SMD < 0.1', 'New-user design'],
    res: [res({ label: 'Kidney function decline', est: '0.71', lo: '0.62', hi: '0.81', icon: 'kidney' }), res({ label: 'Hospitalisation for heart failure', est: '0.78', lo: '0.66', hi: '0.92', icon: 'heart' }), res({ label: 'All-cause hospitalisation', est: '0.95', lo: '0.89', hi: '1.02', icon: 'hospital' })],
    concl: 'SGLT2 inhibitors were associated with better kidney and heart failure outcomes than DPP-4 inhibitors.',
    cite: 'Fictional example for illustration only',
  });
  syncInputs(); update();
  RT.toast(T('已載入範例（虛構研究，數字僅供示範；按 ↶ 可復原）', 'Example loaded (a fictional study, numbers for illustration only; ↶ to undo)'));
};
$('btnReset').onclick = () => { S = RT.merge(DEF, { layout: S.layout, theme: S.theme, custom: S.custom, st: S.st }); syncInputs(); update(); RT.toast(T('已清空內容（按 ↶ 可復原）', 'Content cleared (↶ to undo)')); };
RT.currentState = () => S;
RT.applyState = (o) => { S = upgrade(RT.merge(DEF, o)); syncInputs(); update(); };

syncInputs();
render();
hist.push();
</script>
