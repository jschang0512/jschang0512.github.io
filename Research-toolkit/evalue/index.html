<script src="../shared/common.js?v=20261025f"></script>
<script>
const T = RT.t;
const KEY = 'evalue1';
const TYPES = {
  RR: ['RR', 'risk ratio', '風險比'], OR: ['OR', 'odds ratio', '勝算比'], HR: ['HR', 'hazard ratio', '風險比（HR）'], SMD: ['SMD', 'standardised mean difference', '標準化平均差'],
};
const est = (o = {}) => ({ label: '', type: 'HR', est: '', lo: '', hi: '', common: false, ...o });
const DEF = {
  rows: [est()], bench: [], view: 'plot', sel: 0, trueV: 1, title: '', plotW: 440, plotH: 340, axMax: '', shade: '#E8EEF8',
  xLab: 'Risk ratio, exposure–confounder (RR_EU)', yLab: 'Risk ratio, confounder–outcome (RR_UD)',
  st: { ...RT.STYLE_DEF, fontSize: 13 },
};
const REFS = [
  'VanderWeele TJ, Ding P. Sensitivity analysis in observational research: introducing the E-value. <i>Ann Intern Med</i> 2017;167:268–74. <a href="https://doi.org/10.7326/M16-2607" target="_blank" rel="noopener">doi:10.7326/M16-2607</a>',
  'Mathur MB, Ding P, Riddell CA, VanderWeele TJ. Web site and R package for computing E-values. <i>Epidemiology</i> 2018;29:e45–7. <a href="https://doi.org/10.1097/EDE.0000000000000864" target="_blank" rel="noopener">doi:10.1097/EDE.0000000000000864</a>',
  'VanderWeele TJ. Optimal approximate conversions of odds ratios and hazard ratios to risk ratios. <i>Biometrics</i> 2020;76:746–52. <a href="https://doi.org/10.1111/biom.13197" target="_blank" rel="noopener">doi:10.1111/biom.13197</a>',
  'Ding P, VanderWeele TJ. Sensitivity analysis without assumptions. <i>Epidemiology</i> 2016;27:368–77. <a href="https://doi.org/10.1097/EDE.0000000000000457" target="_blank" rel="noopener">doi:10.1097/EDE.0000000000000457</a>',
];
let S = RT.load(KEY, DEF);

/* ---------------- maths ---------------- */
// observed estimate → approximate risk ratio (VanderWeele & Ding 2017; VanderWeele 2020)
const toRR = (v, type, common) => {
  if (type === 'SMD') return Math.exp(0.91 * v);
  if (type === 'OR' && common) return Math.sqrt(v);
  if (type === 'HR' && common) return (1 - 0.5 ** Math.sqrt(v)) / (1 - 0.5 ** Math.sqrt(1 / v));
  return v;
};
const eOf = (rr, t) => { let r = rr / t; if (r < 1) r = 1 / r; return r + Math.sqrt(r * (r - 1)); };
function compute(r) {
  const t = RT.num(S.trueV) > 0 ? RT.num(S.trueV) : 1;
  const v = [r.est, r.lo, r.hi].map(RT.num);
  if (v[0] === null) return null;
  const ratio = r.type !== 'SMD';
  if (ratio && v.some((x) => x !== null && x <= 0)) return { err: T('比值必須大於 0', 'Ratios must be greater than 0') };
  const [rr, lo, hi] = v.map((x) => (x === null ? null : toRR(x, r.type, r.common)));
  const point = eOf(rr, t);
  let ci = null, ciNull = false;
  if (lo !== null && hi !== null) {
    if (lo > hi) return { err: T('下限大於上限', 'The lower limit is above the upper limit') };
    const lim = rr >= t ? lo : hi;          // the limit closer to the comparison value
    ciNull = rr >= t ? lo <= t : hi >= t;
    ci = ciNull ? 1 : eOf(lim, t);
  }
  return { rr, lo, hi, point, ci, ciNull, t, converted: r.type === 'SMD' || (r.common && (r.type === 'OR' || r.type === 'HR')) };
}
const f2 = (x) => (x === null || x === undefined ? '' : Number(x).toFixed(2));

// the strongest measured covariate–outcome association, on the risk-ratio scale (≥ 1)
function strongest() {
  const bs = S.bench.map((b) => ({ label: b.label || T('已測量變項', 'measured covariate'), rr: RT.num(b.rr) })).filter((b) => b.rr > 0)
    .map((b) => ({ ...b, rr: b.rr < 1 ? 1 / b.rr : b.rr }));
  return bs.length ? bs.reduce((a, b) => (b.rr > a.rr ? b : a)) : null;
}

/* ---------------- result sentences ---------------- */
function sentences(r, c) {
  const ST = RT.study.get();
  const [abbr, en, zh] = TYPES[r.type];
  const [ve, vl, vh] = [r.est, r.lo, r.hi].map(RT.num);
  const obs = `${f2(ve)}${c.lo !== null ? ` (95% CI ${f2(vl)}–${f2(vh)})` : ''}`;
  const obsZh = `${f2(ve)}${c.lo !== null ? `（95% CI ${f2(vl)}–${f2(vh)}）` : ''}`;
  const target = c.t === 1 ? 'the null' : `a risk ratio of ${f2(c.t)}`;
  const targetZh = c.t === 1 ? '虛無值' : `風險比 ${f2(c.t)}`;
  const conv = c.converted ? (r.type === 'SMD' ? `, approximated as a risk ratio of ${f2(c.rr)},` : `, approximated as a risk ratio of ${f2(c.rr)} because the outcome was common,`) : '';
  const convZh = c.converted ? (r.type === 'SMD' ? `（換算為約略風險比 ${f2(c.rr)}）` : `（因結果常見，換算為約略風險比 ${f2(c.rr)}）`) : '';
  let enS = `The observed ${en} of ${obs}${conv} could be explained away by an unmeasured confounder associated with both ${ST.exposure || 'the exposure'} and ${ST.outcome || 'the outcome'} by a risk ratio of ${f2(c.point)}-fold each, above and beyond the measured covariates, but weaker confounding could not do so.`;
  let zhS = `觀察到的 ${abbr} 為 ${obsZh}${convZh}。若要把這個結果完全解釋掉，未測量干擾因子必須在已調整的變項之外，同時與${ST.exposure || '暴露'}及${ST.outcome || '結果'}有至少 ${f2(c.point)} 倍的風險比關聯；較弱的干擾無法做到。`;
  if (c.point <= 1.0001) {
    enS = `The observed ${en} of ${obs}${conv} shows no association, so there is nothing for unmeasured confounding to explain away (E-value = 1).`;
    zhS = `觀察到的 ${abbr} 為 ${obsZh}${convZh}，沒有關聯，因此不需要以未測量干擾解釋（E-value = 1）。`;
    return { en: enS, zh: zhS };
  }
  if (c.ci !== null) {
    if (c.ciNull) { enS += ` The confidence interval already includes ${target}, so its E-value is 1.`; zhS += `信賴區間已包含${targetZh}，因此信賴區間的 E-value 為 1。`; }
    else { enS += ` To shift the confidence interval to include ${target}, the confounder would need a risk ratio of ${f2(c.ci)}-fold with each.`; zhS += `要讓信賴區間涵蓋${targetZh}，干擾因子與兩者的關聯需至少為 ${f2(c.ci)} 倍。`; }
  }
  const B = strongest();
  if (B && c.ci !== null && !c.ciNull && B.rr >= c.ci && B.rr < c.point) {
    enS += ` For comparison, a measured covariate (${B.label}) was associated with the outcome by a risk ratio of ${f2(B.rr)}: below the E-value for the estimate (${f2(c.point)}) but at or above the E-value for the confidence interval (${f2(c.ci)}), so confounding of that strength could not explain away the estimate but could move the interval to include the null.`;
    zhS += `作為比較，已測量變項${B.label}與結果的風險比為 ${f2(B.rr)}：低於估計值的 E-value（${f2(c.point)}），但不低於信賴區間的 E-value（${f2(c.ci)}）。同等強度的干擾無法完全解釋估計值，但可能讓信賴區間涵蓋虛無值。`;
  } else if (B) {
    if (c.point > B.rr) {
      enS += ` For comparison, the strongest association of a measured covariate with the outcome (${B.label}) was a risk ratio of ${f2(B.rr)}, below both E-values.`;
      zhS += `作為比較，已測量變項中與結果關聯最強的是${B.label}（風險比 ${f2(B.rr)}），低於兩個 E-value。`;
    } else {
      enS += ` For comparison, a measured covariate (${B.label}) was associated with the outcome by a risk ratio of ${f2(B.rr)}, at or above the E-value for the estimate, so unmeasured confounding of similar strength cannot be ruled out.`;
      zhS += `作為比較，已測量變項${B.label}與結果的風險比為 ${f2(B.rr)}，不低於估計值的 E-value，因此無法排除同等強度的未測量干擾。`;
    }
  }
  if (c.t !== 1) { enS = enS.replace('could be explained away', `could be moved to ${target}`); zhS = zhS.replace('把這個結果完全解釋掉', `把這個結果推到${targetZh}`); }
  return { en: enS, zh: zhS };
}

/* ---------------- form ---------------- */
const form = document.getElementById('form');
document.getElementById('styleFields').innerHTML = RT.styleFieldsHTML(['font', 'fontSize', 'textColor']);
document.getElementById('refs').innerHTML = RT.refsHTML(REFS);
RT.studyCard(document.getElementById('study'), ['exposure', 'outcome'], { onChange: () => update() });
function syncInputs() { renderRows(); renderBench(); RT.syncForm(form, S); }
RT.bindForm(form, () => S, (k) => { if (k === 'sel') S.sel = Number(S.sel) || 0; update(); });
function renderRows() {
  const host = document.getElementById('rows');
  host.innerHTML = '';
  S.rows.forEach((r, i) => {
    const blk = RT.h(`<div class="block erow">
      <div class="block-head"><b>${i + 1}.</b><input data-f="label" placeholder="${T('分析名稱，例如：主要分析', 'Analysis, e.g. Primary analysis')}">
        <button class="small" data-a="up">↑</button><button class="small" data-a="down">↓</button><button class="icon" data-a="del">✕</button></div>
      <div class="nums">
        <label><span class="lbl">${T('效果量', 'Measure')}</span><select data-f="type">${Object.keys(TYPES).map((k) => `<option value="${k}">${k}</option>`).join('')}</select></label>
        <label><span class="lbl">${T('估計值', 'Estimate')}</span><input data-f="est" inputmode="decimal"></label>
        <label><span class="lbl">${T('95% CI 下限', 'Lower 95% CI')}</span><input data-f="lo" inputmode="decimal"></label>
        <label><span class="lbl">${T('95% CI 上限', 'Upper 95% CI')}</span><input data-f="hi" inputmode="decimal"></label>
      </div>
      <div class="opts"><label class="check" data-common><input type="checkbox" data-f="common"> ${T('結果常見（發生率 ≥ 15%）', 'Common outcome (≥ 15%)')}</label></div></div>`);
    const showCommon = () => { blk.querySelector('[data-common]').hidden = !(r.type === 'OR' || r.type === 'HR'); };
    blk.querySelectorAll('[data-f]').forEach((el) => {
      const f = el.dataset.f;
      if (el.type === 'checkbox') el.checked = !!r[f]; else el.value = r[f] ?? '';
      el.oninput = () => { r[f] = el.type === 'checkbox' ? el.checked : el.value; if (f === 'type') showCommon(); if (f === 'label') fillSel(); update(); };
    });
    showCommon();
    blk.querySelector('.block-head').onclick = (e) => {
      const a = e.target.dataset.a;
      if (a === 'up' && i > 0) [S.rows[i - 1], S.rows[i]] = [S.rows[i], S.rows[i - 1]];
      else if (a === 'down' && i < S.rows.length - 1) [S.rows[i + 1], S.rows[i]] = [S.rows[i], S.rows[i + 1]];
      else if (a === 'del' && S.rows.length > 1) S.rows.splice(i, 1);
      else return;
      S.sel = Math.min(S.sel, S.rows.length - 1);
      syncInputs(); update();
    };
    host.appendChild(blk);
  });
  fillSel();
}
function fillSel() {
  const sel = document.getElementById('selRow');
  sel.innerHTML = S.rows.map((r, i) => `<option value="${i}">${RT.esc(`${i + 1}. ${r.label || T('估計值', 'Estimate')}`)}</option>`).join('');
  sel.value = String(Math.min(S.sel, S.rows.length - 1));
}
function renderBench() {
  const host = document.getElementById('bench');
  host.innerHTML = '';
  S.bench.forEach((b, i) => {
    const el = RT.h(`<div class="brow"><input data-f="label" placeholder="${T('變項，例如：年齡', 'Covariate, e.g. Age')}" aria-label="${T('變項', 'Covariate')}">
      <input data-f="rr" inputmode="decimal" placeholder="RR" aria-label="${T('與結果的風險比', 'Risk ratio with the outcome')}"><button class="icon" data-a="del">✕</button></div>`);
    el.querySelectorAll('[data-f]').forEach((inp) => { inp.value = b[inp.dataset.f] ?? ''; inp.oninput = () => { b[inp.dataset.f] = inp.value; update(); }; });
    el.querySelector('[data-a="del"]').onclick = () => { S.bench.splice(i, 1); renderBench(); update(); };
    host.appendChild(el);
  });
}
document.getElementById('addBench').onclick = () => { S.bench.push({ label: '', rr: '' }); renderBench(); update(); focusLastBench(); };
function focusLastBench() { const ins = document.querySelectorAll('#bench [data-f="label"]'); ins[ins.length - 1]?.focus(); }
document.getElementById('addRow').onclick = () => { S.rows.push(est({ type: S.rows[S.rows.length - 1]?.type || 'HR' })); syncInputs(); update(); };

/* ---------------- results panel ---------------- */
function renderResults() {
  const host = document.getElementById('results');
  const items = S.rows.map((r, i) => ({ r, i, c: compute(r) })).filter((x) => x.c);
  if (!items.length) { host.innerHTML = `<p class="hint" style="margin:0">${T('輸入估計值與 95% CI 後顯示 E-value。', 'Enter an estimate and its 95% CI to see the E-values.')}</p>`; return; }
  const name = (r, i) => RT.esc(r.label || T(`估計值 ${i + 1}`, `Estimate ${i + 1}`));
  host.innerHTML = `<table class="res-tbl"><thead><tr><th>${T('分析', 'Analysis')}</th><th>${T('E-value（估計值）', 'E-value (estimate)')}</th><th>${T('E-value（CI）', 'E-value (CI)')}</th><th aria-label="${T('複製結果描述', 'Copy sentence')}"></th></tr></thead><tbody>` +
    items.map(({ r, i, c }) => (c.err
      ? `<tr><td>${name(r, i)}</td><td class="err" colspan="3">⚠ ${RT.esc(c.err)}</td></tr>`
      : `<tr><td>${name(r, i)}</td><td class="num">${f2(c.point)}</td><td class="num">${c.ci === null ? '—' : f2(c.ci)}</td>
          <td class="copy"><button class="small" data-i="${i}" data-copy="en" title="${T('複製英文結果描述', 'Copy the English results sentence')}">${T('複製英文', 'Copy EN')}</button><button class="small" data-i="${i}" data-copy="zh" title="${T('複製中文結果描述', 'Copy the Chinese results sentence')}">${T('複製中文', 'Copy ZH')}</button></td></tr>`)).join('') +
    '</tbody></table>';
  host.querySelectorAll('[data-copy]').forEach((btn) => (btn.onclick = async () => {
    const r = S.rows[Number(btn.dataset.i)];
    try { await navigator.clipboard.writeText(sentences(r, compute(r))[btn.dataset.copy]); RT.toast(T('已複製', 'Copied')); }
    catch (e) { RT.toast(T('無法複製到剪貼簿', 'Could not copy to the clipboard'), 4000); }
  }));
}

/* ---------------- figures ---------------- */
const niceMax = (v) => [2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 30, 50].find((m) => m >= v) || Math.ceil(v);
function buildPlot() {
  const st = RT.applyStyle(S.st);
  const fs = Number(st.fontSize) || 13, ink = st.textColor || '#000000';
  const r = S.rows[Math.min(S.sel, S.rows.length - 1)] || est();
  const c = compute(r);
  const PW = Number(S.plotW) || 440, PH = Number(S.plotH) || 340;
  const L = fs * 4.2, top = fs * (S.title ? 3 : 1.2), M = 16;
  RT.beginScene();
  let body = '';
  if (S.title) body += RT.rich([{ runs: [{ t: S.title, bold: true, size: fs * 1.1, color: ink }] }], M, M, { lh: fs * 1.5 });
  const x0 = M + L, y0 = top + M, x1 = x0 + PW, y1 = y0 + PH;
  const ok = c && !c.err;
  const R = ok ? Math.max(c.rr / c.t, c.t / c.rr) : 2;
  const E = ok ? c.point : 2 + Math.sqrt(2);
  const mx = RT.num(S.axMax) > 1 ? RT.num(S.axMax) : niceMax(Math.max(E * 1.8, R * 1.5, 3));
  const X = (v) => x0 + ((v - 1) / (mx - 1)) * PW, Y = (v) => y1 - ((v - 1) / (mx - 1)) * PH;
  // the curve RR_EU × RR_UD / (RR_EU + RR_UD − 1) = R: every point on or above it explains the estimate away
  const curve = (Rv) => {
    if (Rv <= 1.0001) return [];
    const xs = (Rv * (mx - 1)) / (mx - Rv), pts = [];
    for (let k = 0; k <= 80; k++) { const xv = xs + ((mx - xs) * k) / 80; pts.push([X(xv), Y((Rv * (xv - 1)) / (xv - Rv))]); }
    return pts;
  };
  const main = curve(R);
  if (main.length) body += RT.poly([...main, [X(mx), Y(mx)]], { fill: S.shade, stroke: 'none' });
  // axes and ticks
  body += RT.line([[x0, y0], [x0, y1], [x1, y1]], { color: ink, sw: 1 });
  const step = mx <= 4 ? 0.5 : mx <= 10 ? 1 : mx <= 20 ? 2 : 5;
  for (let v = 1; v <= mx + 1e-9; v += step) {
    const t = String(Number(v.toFixed(2)));
    body += RT.line([[X(v), y1], [X(v), y1 + fs * 0.35]], { color: ink, sw: 1 });
    body += RT.rich([{ runs: [{ t, size: fs * 0.9, color: ink }] }], X(v), y1 + fs * 0.4, { lh: fs * 1.3, anchor: 'middle' });
    body += RT.line([[x0 - fs * 0.35, Y(v)], [x0, Y(v)]], { color: ink, sw: 1 });
    body += RT.rich([{ runs: [{ t, size: fs * 0.9, color: ink }] }], x0 - fs * 0.5, Y(v) - fs * 0.65, { lh: fs * 1.3, anchor: 'end' });
  }
  body += RT.rich([{ runs: [{ t: S.xLab, size: fs, color: ink }] }], x0 + PW / 2, y1 + fs * 1.9, { lh: fs * 1.4, anchor: 'middle' });
  // y title: drawn as a rotated label
  body += `<text transform="translate(${RT.f(M + fs * 0.9)},${RT.f(y0 + PH / 2)}) rotate(-90)" text-anchor="middle" font-size="${fs}" fill="${ink}">${RT.esc(S.yLab)}</text>`;
  RT.scene && RT.scene.push({ k: 'shape', x: M, y: y0, w: fs * 1.6, h: PH, fill: 'none', stroke: 'none', sw: 0, vert: 'vert270', padL: 0, padR: 0, padT: 0, padB: 0, anchor: 'ctr', paras: [{ align: 'center', indent: 0, hang: 0, gap: 0, lh: fs * 1.3, runs: [{ t: S.yLab, size: fs, color: ink }] }] });
  if (main.length) body += RT.line(main, { color: ink, sw: 1.6 });
  if (ok && c.ci !== null && !c.ciNull) {
    const lim = c.rr >= c.t ? c.lo : c.hi;
    const ci = curve(Math.max(lim / c.t, c.t / lim));
    if (ci.length) body += RT.line(ci, { color: ink, sw: 1.2, dash: '5 4' });
  }
  if (ok && E <= mx) {
    body += RT.circle(X(E), Y(E), fs * 0.32, { fill: ink });
    body += RT.rich([{ runs: [{ t: `E-value = ${f2(E)}`, size: fs, bold: true, color: ink }] }], X(E) + fs * 0.6, Y(E) - fs * 1.5, { lh: fs * 1.4 });
  }
  const B = strongest();
  if (B && B.rr <= mx) {
    body += RT.circle(X(B.rr), Y(B.rr), fs * 0.32, { fill: '#FFFFFF', stroke: ink, sw: 1.2 });
    body += RT.rich([{ runs: [{ t: `${B.label} (${f2(B.rr)})`, size: fs * 0.9, color: ink }] }], X(B.rr) + fs * 0.6, Y(B.rr) - fs * 0.2, { lh: fs * 1.3 });
  }
  // legend
  const lx = x1 - fs * 11.5, ly = y0 + fs * 0.4;
  body += RT.line([[lx, ly + fs * 0.7], [lx + fs * 2, ly + fs * 0.7]], { color: ink, sw: 1.6 });
  body += RT.rich([{ runs: [{ t: ok ? `Estimate (RR ${f2(R)})` : 'Estimate', size: fs * 0.9, color: ink }] }], lx + fs * 2.5, ly, { lh: fs * 1.4 });
  if (ok && c.ci !== null && !c.ciNull) {
    body += RT.line([[lx, ly + fs * 2.1], [lx + fs * 2, ly + fs * 2.1]], { color: ink, sw: 1.2, dash: '5 4' });
    body += RT.rich([{ runs: [{ t: 'Confidence limit', size: fs * 0.9, color: ink }] }], lx + fs * 2.5, ly + fs * 1.4, { lh: fs * 1.4 });
  }
  return RT.figure(x1 + M + fs, y1 + fs * 3.6 + M, body);
}
function tableModel() {
  const heads = ['Analysis', 'Observed estimate (95% CI)', 'Risk ratio used', 'E-value, estimate', 'E-value, CI'];
  const rows = S.rows.map((r, i) => {
    const c = compute(r);
    if (!c || c.err) return null;
    const [ve, vl, vh] = [r.est, r.lo, r.hi].map(RT.num);
    return [r.label || `Estimate ${i + 1}`, `${r.type} ${f2(ve)}${c.lo !== null ? ` (${f2(vl)}–${f2(vh)})` : ''}`, c.converted ? f2(c.rr) : '—', f2(c.point), c.ci === null ? '—' : f2(c.ci)];
  }).filter(Boolean);
  return { heads, rows, widths: [28, 26, 14, 16, 16] };
}
function buildTable() {
  const st = RT.applyStyle(S.st);
  const fs = Number(st.fontSize) || 13, M = 16, W = 760, tw = W - 2 * M;
  const { heads, rows, widths } = tableModel();
  const cw = widths.map((p) => (tw * p) / 100);
  const o = { size: fs, lh: 1.3, pad: 6, align: 'left', color: st.textColor, stroke: 'none', sw: 0, radius: 0, fill: 'none' };
  RT.beginScene();
  let body = '', y = M;
  if (S.title) { const tb = RT.box([{ text: S.title, bold: true }], tw, { ...o, pad: 0, padX: 0, size: fs * 1.08 }); body += RT.drawBox(tb, M, y); y += tb.h + fs * 0.5; }
  const drawRow = (cells, bold) => {
    const bs = cells.map((t, i) => RT.box([{ text: t, bold, align: i ? 'center' : 'left' }], cw[i], o));
    const h = Math.max(...bs.map((b) => b.h));
    let x = M; bs.forEach((b, i) => { body += RT.drawBox(b, x, y, h); x += cw[i]; });
    y += h;
  };
  body += RT.line([[M, y], [W - M, y]], { color: st.textColor, sw: 1.2 });
  drawRow(heads, true);
  body += RT.line([[M, y], [W - M, y]], { color: st.textColor, sw: 0.8 });
  rows.forEach((r) => drawRow(r, false));
  body += RT.line([[M, y], [W - M, y]], { color: st.textColor, sw: 1.2 });
  const note = 'E-values follow VanderWeele & Ding (2017). Odds and hazard ratios for common outcomes, and standardised mean differences, were first converted to approximate risk ratios.';
  const nb = RT.box([{ text: note }], tw, { ...o, pad: 0, padX: 0, size: fs * 0.82 });
  body += RT.drawBox(nb, M, y + fs * 0.4); y += fs * 0.4 + nb.h;
  return RT.figure(W, y + M, body);
}
const docxTable = () => {
  RT.applyStyle(S.st);
  const { heads, rows, widths } = tableModel();
  return RT.buildDocxTable({ title: S.title, headers: heads, widths, rows: rows.map((r) => r.map((t, i) => ({ text: t, align: i ? 'center' : undefined }))),
    note: 'E-values follow VanderWeele & Ding (2017). Odds and hazard ratios for common outcomes, and standardised mean differences, were first converted to approximate risk ratios.',
    sizePt: Math.max(8, Math.min(12, (Number(S.st.fontSize) || 13) * 0.8)), headerFill: 'FFFFFF' });
};

let fig;
const preview = document.getElementById('preview');
const exporter = RT.exportPanel(document.getElementById('export'), () => fig, 'e_value', {
  fontSize: { get: () => S.st.fontSize, set: (v) => { S.st.fontSize = v; syncInputs(); update(); } },
});
const tblBtn = RT.h(`<button type="button">${T('Word 結果表', 'Word results table')}</button>`);
tblBtn.title = T('全部估計值的 E-value，匯出為可編輯 Word 表格', 'E-values for every estimate as an editable Word table');
tblBtn.onclick = async () => {
  if (!tableModel().rows.length) { RT.toast(T('還沒有可匯出的估計值', 'No estimates to export yet')); return; }
  try { RT.download(await docxTable(), (document.querySelector('.ex-name').value || 'e_value') + '_table.docx'); }
  catch (e) { RT.toast(String(e.message || e), 6000); }
};
document.querySelector('#export .ex-copy').after(tblBtn);
const hist = RT.history(() => S, (s) => { S = s; syncInputs(); render(); });
function render() {
  renderResults();
  try { fig = S.view === 'table' ? buildTable() : buildPlot(); preview.innerHTML = fig.svg; }
  catch (e) { console.error(e); preview.innerHTML = `<div class="msg">⚠ ${RT.esc(e.message)}</div>`; }
  const msgs = [];
  S.rows.forEach((r, i) => {
    const name = r.label ? `「${r.label}」` : T(`估計值 ${i + 1}`, `estimate ${i + 1}`);
    const v = [r.est, r.lo, r.hi].map(RT.num);
    if (v[0] !== null && (v[1] === null || v[2] === null)) msgs.push(T(`${name}沒有完整的 95% CI，只能算出估計值的 E-value`, `${name} has no complete 95% CI — only the estimate’s E-value is computed`));
    if (v[0] !== null && v[1] !== null && v[2] !== null && !(v[1] <= v[0] && v[0] <= v[2])) msgs.push(T(`${name}的估計值不在 CI 之間`, `${name}: the estimate is not between its limits`));
    if (r.type === 'OR' && !r.common && v[0] !== null) msgs.push(T(`${name}是 OR：若結果發生率 ≥ 15%，請勾選「結果常見」，否則 E-value 會被高估`, `${name} is an OR: tick “Common outcome” if the outcome occurs in ≥ 15%, or the E-value is overstated`));
  });
  document.getElementById('msgs').innerHTML = msgs.map((m) => `<div class="msg">⚠ ${RT.esc(m)}</div>`).join('');
  exporter.setIssues(msgs.filter((m) => !/OR/.test(m)).length);
  exporter.refresh();
  RT.save(KEY, S);
}
const update = RT.debounce(() => { render(); hist.push(); }, 80);

document.getElementById('btnUndo').onclick = hist.undo;
document.getElementById('btnRedo').onclick = hist.redo;
document.getElementById('btnExample').onclick = () => {
  S.rows = [
    est({ label: 'Primary analysis', type: 'HR', est: '0.78', lo: '0.69', hi: '0.88' }),
    est({ label: 'Per-protocol analysis', type: 'HR', est: '0.72', lo: '0.61', hi: '0.85' }),
    est({ label: 'Secondary outcome (30-day readmission)', type: 'OR', est: '0.85', lo: '0.70', hi: '1.03', common: true }),
  ];
  S.bench = [{ label: 'Age ≥ 75 years', rr: '1.65' }, { label: 'Prior stroke', rr: '1.42' }];
  S.sel = 0; S.view = 'plot';
  syncInputs(); update();
  RT.toast(T('已載入範例（虛構研究，僅供示範；按 ↶ 可復原）', 'Example loaded (a fictional study, for illustration; ↶ to undo)'));
};
document.getElementById('btnReset').onclick = () => { S.rows = [est()]; S.sel = 0; S.title = ''; syncInputs(); update(); RT.toast(T('已清空內容（按 ↶ 可復原）', 'Content cleared (↶ to undo)')); };
// the project buttons save and import the whole toolkit (shared/common.js); this tool supplies its state
RT.currentState = () => S;
RT.applyState = (o) => { S = RT.merge(DEF, o); syncInputs(); update(); };

syncInputs();
render();
hist.push();
// estimates sent from the forest plot
(() => {
  if (new URLSearchParams(location.search).get('from') !== 'forest') return;
  let h = null;
  try { h = JSON.parse(localStorage.getItem('rt:handoff-forest') || 'null'); localStorage.removeItem('rt:handoff-forest'); } catch (e) { /* ignore */ }
  history.replaceState(null, '', location.pathname);
  if (!h || !Array.isArray(h.rows) || !h.rows.length) return;
  S.rows = h.rows.map((r) => est({ label: r.label || '', type: r.type, est: r.est, lo: r.lo, hi: r.hi }));
  S.sel = 0;
  syncInputs(); update();
  RT.toast(T(`已帶入森林圖的 ${S.rows.length} 個估計值（按 ↶ 可回到原本的內容）。OR 或 HR 若結果常見，請記得勾選。`, `${S.rows.length} estimates brought in from the forest plot (↶ restores your previous entries). Tick “Common outcome” where it applies.`), 7000);
})();
</script>
