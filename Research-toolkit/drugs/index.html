  .links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; margin-top: 8px; }
  .rules { grid-column: 1 / -1; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  .rules h4 { margin: 0; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .rules h4 a { font-weight: 400; font-size: 12.5px; }
  .rules .txt { margin: 0; padding: 10px 12px; max-height: 420px; overflow-y: auto; white-space: pre-wrap; font: 13px/1.65 var(--font-body); }
  .rules .txt + h4 { border-top: 1px solid var(--border); }

  .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }

  @media (prefers-reduced-motion: reduce) { .row, .scope button { transition: none; } }
</style>

      <input type="search" id="q" autocomplete="off" spellcheck="false" aria-label="搜尋藥品" placeholder="藥名、成分、健保代號、ATC 或許可證字號（按 / 開始）" data-en-ph="Name, ingredient, NHI code, ATC or licence number (press /)">

      </span>

<script>
const TW = RT.twDrugs, N = TW.N, F = TW.F, T = RT.t, esc = RT.esc;
const KEY = 'drugs';
const ADV = { pmin: '', pmax: '', from: '', to: '', atc: '', cls: '', form: '', single: '', cat: '', ctrl: '', country: '', lic: '', pkg: '', who: '', rules: false, photo: false };
const DEF = { scope: 'paid', sort: 'rel', advOpen: false, adv: ADV };
let S = RT.merge(DEF, RT.load(KEY, {}));
// earlier versions kept a few filters at the top level
// scopes before the four-way split: 'all' (with delisted) and 'lic' (everything) both become 'every'
if (S.scope === 'all' || (S.scope === 'lic' && !S.scope4)) S.scope = 'every';
S.scope4 = true;
['cls', 'form'].forEach((k) => { if (S[k]) { S.adv[k] = S[k]; } delete S[k]; });
if (S.ctrl === true) S.adv.ctrl = 'any'; if (S.single === true) S.adv.single = '單方'; delete S.ctrl; delete S.single;
let Q = '', chips = [];            // chips: [{k: 'group'|'atc', v}]
let nhiD = null, fdaD = null, extraD = null, rulesD = null, shown = 50, open = new Set();
const $ = (id) => document.getElementById(id);
const fmtP = (p) => (p ? p.toLocaleString('en-US', { minimumFractionDigits: p < 100 ? 2 : 0, maximumFractionDigits: 2 }) : '0');
const CLS = ['研發廠', 'BA/BE學名藥', '一般學名藥', '生物製劑'];
const CLS_EN = { '研發廠': 'Originator', 'BA/BE學名藥': 'BA/BE generic', '一般學名藥': 'Generic', '生物製劑': 'Biologic' };
const COUNTRY = { TW: '台灣', IN: '印度', JP: '日本', DE: '德國', US: '美國', IT: '義大利', CN: '中國', CH: '瑞士', FR: '法國', GB: '英國', ES: '西班牙', BE: '比利時', KR: '韓國', AT: '奧地利', IE: '愛爾蘭', NL: '荷蘭', SE: '瑞典', DK: '丹麥', AU: '澳洲', CA: '加拿大', PR: '波多黎各', SI: '斯洛維尼亞', PT: '葡萄牙', GR: '希臘', HU: '匈牙利', PL: '波蘭', IL: '以色列', SG: '新加坡', TH: '泰國', MY: '馬來西亞', ID: '印尼', VN: '越南', FI: '芬蘭', NO: '挪威', CZ: '捷克', HR: '克羅埃西亞', BR: '巴西', AR: '阿根廷', MX: '墨西哥', TR: '土耳其', PK: '巴基斯坦', KE: '肯亞', ZA: '南非' };
const countryName = (c) => (RT.lang === 'en' ? c : (COUNTRY[c] ? `${COUNTRY[c]} ${c}` : c));

/* ---------- data ---------- */
function licOf(r) { return fdaD && r[N.licId] ? fdaD.byLicId.get(r[N.licId]) || null : null; }
// the same product in another pack: same first eight characters of the NHI code (…00 and …G0)
const siblings = (r) => { const p = r[N.code].slice(0, 8); return ['00', 'G0'].map((s) => p + s).filter((c) => c !== r[N.code] && nhiD.byCode.has(c)).map((c) => nhiD.byCode.get(c)); };
const hasFoilTwin = (r) => !TW.isFoil(r[N.code]) && nhiD.byCode.has(r[N.code].slice(0, 8) + 'G0');
let hay = null;
function haystack() {
  if (hay) return hay;
  hay = nhiD.rows.map((r) => {
    const f = licOf(r);
    return TW.fold([r[N.code], r[N.en], r[N.zh], r[N.ingredient], r[N.atc], r[N.vendor], r[N.maker], r[N.group], f ? f[F.licence] : '', f ? f[F.ingredients] : ''].join(' \u0001 '));
  });
  return hay;
}
let licOnly = null, licHay = null;
function licOnlyRows() {
  if (licOnly || !fdaD) return licOnly || [];
  const used = new Set(nhiD.rows.map((r) => r[N.licId]).filter(Boolean));

/* ---------- advanced filters ---------- */
const A = () => S.adv;

function passes(r) {

function search() {

    if (!passes(r)) continue;
    let ok = true;
    for (const c of chips) {
      if (c.k === 'group' && r[N.group] !== c.v) { ok = false; break; }
      if (c.k === 'atc' && !r[N.atc].startsWith(c.v)) { ok = false; break; }
    }
    if (!ok) continue;

    let score = 0;
    for (const t of toks) {
      if (!h.includes(t)) { ok = false; break; }

      if (code === t) score += 100;

      if (ATC_RE.test(t) && atc.startsWith(t)) score += 50;
      if (TW.fold(r[N.zh]).startsWith(t) || TW.fold(r[N.en]).startsWith(t)) score += 30;
      if (TW.fold(r[N.ingredient]).startsWith(t)) score += 20;

    pa: (a, b) => (a.r[N.price] || Infinity) - (b.r[N.price] || Infinity),
    pd: (a, b) => b.r[N.price] - a.r[N.price],
    code: (a, b) => (a.r[N.code] < b.r[N.code] ? -1 : 1),
    new: (a, b) => (a.r[N.firstListed] < b.r[N.firstListed] ? 1 : a.r[N.firstListed] > b.r[N.firstListed] ? -1 : 0),

  if ((S.scope === 'lic' || S.scope === 'every') && fdaD && (toks.length || needsLic() || A().photo) && !chips.length && !nhiOnly) {
    const L = licOnlyRows();
    for (let i = 0; i < L.length; i++) {
      if (!licPasses(L[i])) continue;

      if (toks.every((t) => licHay[i].includes(t))) lic.push(L[i]);

}

  });

/* ---------- price history ---------- */
async function showHist(box, code) {
  box.innerHTML = `<span class="hint">${T('載入中…', 'Loading…')}</span>`;
  try {
    const h = await TW.hist(code);
    if (!h.length) { box.innerHTML = `<p class="hint">${T('沒有價格變動紀錄。', 'No price changes on record.')}</p>`; return; }
    const pts = h.filter((x) => x.date);
    const t = (d) => new Date(d).getTime(); const now = Date.now();
    const x0 = t(pts[0].date), x1 = Math.max(now, t(pts[pts.length - 1].date) + 1);
    const ps = pts.map((p) => p.price), pmax = Math.max(...ps), pmin = Math.min(...ps.filter((p) => p > 0), pmax), span = pmax - pmin || pmax || 1;
    const W = 300, Hh = 60, X = (d) => ((t(d) - x0) / (x1 - x0)) * W, Y = (p) => (p > 0 ? Hh - 8 - ((p - pmin) / span) * (Hh - 16) : Hh - 1);
    let d = ''; pts.forEach((p, i) => { const x = X(p.date).toFixed(1), y = Y(p.price).toFixed(1); d += i ? ` H${x} V${y}` : `M${x} ${y}`; }); d += ` H${W}`;
    box.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="${T('支付價變化', 'Price over time')}"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" style="color:var(--accent)"/></svg>
      <div class="scroll"><table>${pts.slice().reverse().map((p) => `<tr><td>${esc(p.date)}</td><td>${p.price ? '$' + fmtP(p.price) : T('取消給付', 'delisted')}</td></tr>`).join('')}</table></div>`;
  } catch (e) { box.innerHTML = `<p class="hint">${esc(e.message || e)}</p>`; }
}

/* ---------- reimbursement rules, full text ---------- */
// highlight the drug's own ingredients in the chapter, so the relevant paragraph is easy to find
function ruleMarks(r) {
  const words = new Set();
  String(r[N.ingredient] || '').split(/[;,+/&]| AND /i).forEach((part) => {
    const w = part.trim().split(/[\s(]/)[0];
    if (w && w.length >= 4 && /^[A-Za-z-]+$/.test(w)) words.add(w);
  });
  return [...words];
}
function markText(text, words) {
  let h = esc(text);
  words.forEach((w) => { h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); });
  return h;
}
async function showRules(r, box, btn) {
  if (!box.hidden) { box.hidden = true; btn.textContent = T('顯示全文', 'Show full text'); return; }
  box.hidden = false; btn.textContent = T('收起全文', 'Hide full text');
  box.innerHTML = `<p class="hint" style="padding:10px 12px;margin:0">${T('載入給付規定…', 'Loading the rules…')}</p>`;
  try {
    if (!rulesD) rulesD = await TW.rules();
    const words = ruleMarks(r);
    const chapters = r[N.ruleChapters].split(',').filter(Boolean);
    box.innerHTML = chapters.map((c) => {
      const fl = ruleFile(r, c), text = fl && rulesD.files[fl];
      return `<h4>${T('給付規定', 'NHI rules')} ${esc(c)}${fl ? ` <a href="${TW.ruleUrl(fl)}" target="_blank" rel="noopener">PDF ↗</a>` : ''}</h4>` +
        (text ? `<div class="txt">${markText(text, words)}</div>` : `<p class="hint" style="padding:10px 12px;margin:0">${T('這一章的全文還沒有轉好，請開 PDF。', 'No text for this chapter yet; open the PDF.')}</p>`);
    }).join('') + `<p class="note" style="padding-top:8px">${T('全文由健保署 PDF 自動轉出，表格可能排版不完整；以 PDF 為準。', 'Text converted automatically from the NHIA PDFs; tables may lose their layout. The PDF is authoritative.')}</p>`;
  } catch (e) {
    // no text file (yet, or offline): point to the PDFs instead of showing an error code
    const pdfs = r[N.ruleChapters].split(',').filter(Boolean).map((c) => { const fl = ruleFile(r, c); return fl ? `<a href="${TW.ruleUrl(fl)}" target="_blank" rel="noopener">${esc(c)} PDF ↗</a>` : ''; }).filter(Boolean).join('　');
    box.innerHTML = `<p class="hint" style="padding:10px 12px;margin:0">${T('暫時無法取得給付規定全文，請開 PDF：', 'The full text is not available right now; open the PDF:')} ${pdfs}</p>`;
  }
}

/* ---------- actions ---------- */
function summary(r) {
  const f = licOf(r);
  return [`${r[N.zh]} ${r[N.en]}`.trim(), `${T('健保代號', 'NHI code')} ${r[N.code]}${r[N.atc] ? ' · ATC ' + r[N.atc] : ''}`,
    r[N.price] > 0 ? `${T('支付價', 'Price')} $${fmtP(r[N.price])}（${r[N.priceSince]}）` : T('已取消給付', 'Delisted'),
    `${T('成分', 'Ingredient')} ${r[N.ingredient]}`, r[N.ruleChapters] ? `${T('給付規定', 'NHI rules')} ${r[N.ruleChapters]}` : '',
    f ? `${f[F.licence]}${f[F.status] ? '（' + f[F.status] + '）' : ''}${f[F.controlled] ? ' · ' + f[F.controlled] : ''}` : ''].filter(Boolean).join('\n');
}
function toCodelist(items) {
  let q = []; try { q = JSON.parse(localStorage.getItem('rt:handoff-codes') || '[]'); } catch (e) { q = []; }
  q.push(...items); try { localStorage.setItem('rt:handoff-codes', JSON.stringify(q.slice(-5000))); } catch (e) { /* ignore */ }
  RT.toast(T(`已送出 ${items.length} 個代碼，到「代碼清單產生器」就會出現`, `${items.length} codes sent; they appear in the Code List Builder`), 4000);
}
const nhiItem = (r) => ({ sys: 'nhi', code: r[N.code], name: [r[N.zh], r[N.en]].filter(Boolean).join(' / '), atc: r[N.atc] });
function setChip(k, v) { chips = chips.filter((c) => c.k !== k); chips.push({ k, v }); Q = ''; $('q').value = ''; shown = 50; open.clear(); sync(); render(); window.scrollTo({ top: 0 }); }
function goCode(code) { chips = []; Q = code; $('q').value = code; shown = 50; open.clear(); open.add(code); { const p = nhiD.byCode.get(code)[N.price] > 0; if ((S.scope === 'paid' && !p) || (S.scope === 'delisted' && p) || S.scope === 'lic') setScope('every', true); } sync(); render(); window.scrollTo({ top: 0 }); }
/* ---------- photo viewer ---------- */
function openPhoto(btn) {
  const [name, ...rest] = (btn.dataset.cap || '').split('\n');
  $('phImg').src = btn.dataset.photo; $('phImg').alt = T('藥品外觀照片：', 'Photo: ') + name;
  $('phCap').innerHTML = `<b>${esc(name)}</b>${rest.length ? '\n' + esc(rest.join('\n')) : ''}`;
  $('phLink').href = btn.dataset.photo;
  $('photo').showModal();
}
$('phClose').onclick = () => $('photo').close();
$('phImg').onclick = () => $('photo').close();
// a click on the dimmed area outside the box closes it too
$('photo').addEventListener('click', (e) => { if (e.target === $('photo')) $('photo').close(); });
$('photo').addEventListener('close', () => { $('phImg').removeAttribute('src'); });

$('out').addEventListener('click', async (e) => {
  const z = e.target.closest('[data-photo]'); if (z) { openPhoto(z); return; }
  const sc = e.target.closest('[data-scope]'); if (sc) { setScope(sc.dataset.scope); return; }
  if (e.target.closest('[data-clear]')) { clearAdv(); return; }
  if (e.target.id === 'btnMore') { shown += 100; render(); return; }
  const go = e.target.closest('[data-go]'); if (go) { goCode(go.dataset.go); return; }
  const li = e.target.closest('li[data-code]'); if (!li) return;
  const r = nhiD.byCode.get(li.dataset.code); if (!r) return;
  const act = e.target.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'hist') showHist(act.parentElement, r[N.code]);
    else if (a === 'rules') showRules(r, li.querySelector('[data-rules]'), act);
    else if (a === 'group') setChip('group', r[N.group]);
    else if (a === 'atc') setChip('atc', r[N.atc]);
    else if (a === 'atc5') setChip('atc', r[N.atc].slice(0, 5));
    else if (a === 'copy') { try { await navigator.clipboard.writeText(summary(r)); RT.toast(T('已複製', 'Copied')); } catch (x) { RT.toast(T('無法複製到剪貼簿', 'Could not copy'), 3000); } }
    else if (a === 'codelist') toCodelist([nhiItem(r)]);
    return;
  }
  if (e.target.closest('.row') && !e.target.closest('a')) {
    const id = r[N.code];
    if (open.has(id)) open.delete(id); else { open.add(id); loadExtra(); }
    const tmp = document.createElement('ul'); tmp.innerHTML = rowHTML(r); li.replaceWith(tmp.firstElementChild);
  }
});
$('status').addEventListener('click', (e) => {
  if (e.target.id === 'btnCsv') {
    const head = ['健保代號', '中文名稱', '英文名稱', '成分', '規格', '劑型', '藥品分類', 'ATC', '支付價', '支付價起日', '首次收載', '包裝', '分類分組', '給付規定章節', '藥商', '製造廠', '許可證字號', '許可證狀態', '處方類別', '管制藥品', '製造國別'];
    const rows = last.rows.map((r) => { const f = licOf(r); return [r[N.code], r[N.zh], r[N.en], r[N.ingredient], r[N.strength], r[N.form], r[N.class], r[N.atc], r[N.price], r[N.priceSince], r[N.firstListed], TW.isFoil(r[N.code]) ? '鋁箔包裝(G0)' : hasFoilTwin(r) ? '一般包裝' : '', r[N.group], r[N.ruleChapters], r[N.vendor], r[N.maker], f ? f[F.licence] : '', f ? f[F.status] || '有效' : '', f ? f[F.category] : '', f ? f[F.controlled] : '', f ? f[F.country] : '']; });
    RT.downloadCSV([head, ...rows], 'tw-drugs.csv');
  }
  if (e.target.id === 'btnAllCl') {
    if (last.rows.length > 3000) { RT.toast(T('結果超過 3000 筆，請先縮小範圍', 'More than 3000 results; narrow the search first'), 4000); return; }
    toCodelist(last.rows.map(nhiItem));
  }
});
$('chips').addEventListener('click', (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; chips.splice(+b.dataset.chip, 1); shown = 50; sync(); render(); });

/* ---------- controls ---------- */
function setScope(v, quiet) { S.scope = v; [...$('scope').children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v))); if (v === 'lic' || v === 'every') loadFda(); shown = 50; save(); if (!quiet) render(); }
$('scope').addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (b) setScope(b.dataset.v); });
function save() { RT.save(KEY, S); }
function sync() {
  const p = new URLSearchParams();
  if (Q) p.set('q', Q);
  chips.forEach((c) => p.set(c.k, c.v));
  history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
}
const onQ = RT.debounce(() => { Q = $('q').value.trim(); shown = 50; open.clear(); sync(); render(); }, 140);
$('q').addEventListener('input', onQ);
$('q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('q').value = ''; onQ(); } });
document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('q') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); } });
$('fSort').onchange = () => { S.sort = $('fSort').value; save(); render(); };
$('btnAdv').onclick = () => { S.advOpen = $('adv').hidden; $('adv').hidden = !S.advOpen; $('btnAdv').setAttribute('aria-expanded', String(S.advOpen)); save(); if (S.advOpen) loadFda(); };
// the advanced panel: one field per filter
const AF = { aPmin: 'pmin', aPmax: 'pmax', aFrom: 'from', aTo: 'to', aAtc: 'atc', aCls: 'cls', aForm: 'form', aSingle: 'single', aCat: 'cat', aCtrl: 'ctrl', aCountry: 'country', aLic: 'lic', aPkg: 'pkg', aWho: 'who', aRules: 'rules', aPhoto: 'photo' };
const applyAdv = RT.debounce(() => { shown = 50; save(); render(); }, 160);
Object.entries(AF).forEach(([id, k]) => {
  const el = $(id);
  el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
    A()[k] = el.type === 'checkbox' ? el.checked : el.value;
    if (needsLic()) loadFda();
    if (k === 'photo' && el.checked) loadExtra();
    applyAdv();
  });
});
function syncAdv() { Object.entries(AF).forEach(([id, k]) => { const el = $(id); if (el.type === 'checkbox') el.checked = !!A()[k]; else el.value = A()[k] || ''; }); }
function clearAdv() { S.adv = { ...ADV }; syncAdv(); shown = 50; save(); render(); }
$('advClear').onclick = clearAdv;
$('tips').innerHTML = T('例如：', 'Try: ') + ['metformin', 'A10BA', 'AC368201G0', '衛署藥輸字第004858號', 'atorvastatin 10'].map((x) => `<button type="button" class="small" data-try="${esc(x)}">${esc(x)}</button>`).join(' ');
$('tips').addEventListener('click', (e) => { const b = e.target.closest('[data-try]'); if (b) { $('q').value = b.dataset.try; onQ(); } });

let fdaP = null, extraP = null;
function loadFda() {
  if (fdaP) return fdaP;
  fdaP = TW.fda().then((d) => {
    fdaD = d; hay = null;
    const cats = {}, countries = {};
    d.rows.forEach((f) => { if (f[F.category]) cats[f[F.category]] = (cats[f[F.category]] || 0) + 1; if (f[F.country]) countries[f[F.country]] = (countries[f[F.country]] || 0) + 1; });
    $('aCat').innerHTML = `<option value="">${T('不限', 'All')}</option>` + Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 14).map(([c]) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    $('aCountry').innerHTML = `<option value="">${T('不限', 'All')}</option>` + Object.entries(countries).sort((a, b) => b[1] - a[1]).slice(0, 40).map(([c]) => `<option value="${esc(c)}">${esc(countryName(c))}</option>`).join('');
    syncAdv(); render();
  }).catch((e) => { fdaP = null; RT.toast(String(e.message || e), 5000); });
  return fdaP;
}
function loadExtra() {
  if (extraP) return extraP;
  extraP = TW.extra().then((d) => { extraD = d; if (A().photo) render(); else rerenderOpen(); })
    .catch((e) => { extraP = null; RT.toast(String(e.message || e), 5000); });
  return extraP;
}

/* ---------- start ---------- */
$('srcNote').textContent = TW.sourceNote();
$('refs').innerHTML = RT.noticeHTML([T('資料來源：健保署「健保用藥品項」與藥品給付規定；食藥署「全部藥品許可證資料集」「藥品外觀資料集」「藥品仿單外盒資料集」（政府資料開放授權條款第 1 版）。外觀照片、仿單與外盒直接連到食藥署網站。', 'Sources: NHIA “NHI drug list” and reimbursement rules; TFDA “All drug licences”, “Drug appearance” and “Leaflets and cartons” datasets (Open Government Data License, Taiwan v1.0). Photos, leaflets and cartons link straight to the TFDA site.')]);
(() => {
  const p = new URLSearchParams(location.search);
  Q = p.get('q') || ''; $('q').value = Q;
  if (p.get('group')) chips.push({ k: 'group', v: p.get('group') });
  if (p.get('atc')) chips.push({ k: 'atc', v: p.get('atc').toUpperCase() });
})();
[...$('scope').children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.scope)));
$('fSort').value = S.sort;
$('adv').hidden = !S.advOpen; $('btnAdv').setAttribute('aria-expanded', String(!!S.advOpen));
$('aCls').innerHTML = `<option value="">${T('不限', 'All')}</option>` + CLS.map((c) => `<option value="${esc(c)}">${esc(RT.lang === 'en' ? CLS_EN[c] : c)}</option>`).join('');
$('aCat').innerHTML = $('aCountry').innerHTML = `<option value="">${T('不限', 'All')}</option>`;
syncAdv();
TW.nhi().then((d) => {
  nhiD = d;
  const forms = {}; d.rows.forEach((r) => { if (r[N.price] > 0 && r[N.form]) forms[r[N.form]] = (forms[r[N.form]] || 0) + 1; });
  $('aForm').innerHTML = `<option value="">${T('不限', 'All')}</option>` + Object.entries(forms).sort((a, b) => b[1] - a[1]).slice(0, 40).map(([f]) => `<option value="${esc(f)}">${esc(f)}</option>`).join('');
  syncAdv();
  TW.meta().then((m) => { $('srcNote').textContent = TW.sourceNote() + T(` 本次資料整理於 ${m.built}。`, ` This copy was built on ${m.built}.`); });
  render();
  // licences come second: search works as soon as the NHI list is in
  loadFda();
  if (A().photo) loadExtra();
}).catch((e) => { $('out').innerHTML = `<div class="empty-state">${esc(e.message || e)}</div>`; });
</script>
</body>
