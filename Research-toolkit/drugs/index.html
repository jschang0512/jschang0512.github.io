<style>
  /* drug classes: one hue each, readable on both themes */
  :root { --c-orig: oklch(56% 0.150 28); --c-babe: oklch(52% 0.120 160); --c-gen: oklch(58% 0.060 250); --c-bio: oklch(54% 0.140 305); --c-off: oklch(70% 0.100 75); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-orig: oklch(74% 0.120 28); --c-babe: oklch(74% 0.110 160); --c-gen: oklch(74% 0.050 250); --c-bio: oklch(74% 0.110 305); --c-off: oklch(78% 0.090 75); } }
  :root[data-theme="dark"] { --c-orig: oklch(74% 0.120 28); --c-babe: oklch(74% 0.110 160); --c-gen: oklch(74% 0.050 250); --c-bio: oklch(74% 0.110 305); --c-off: oklch(78% 0.090 75); }

  .dr { max-width: 1080px; margin: 0 auto; padding: 16px 16px 48px; }
  .dr-search { display: flex; flex-direction: column; gap: 10px; padding: 6px 0 12px; }
  .dr-q { position: relative; display: block; }
  .dr-q input { width: 100%; font-size: 17px; padding: 12px 14px 12px 40px; border-radius: 10px; min-height: 48px; }
  .dr-q svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .dr-filters { display: flex; align-items: center; gap: 8px 10px; font-size: 13px; }
  .dr-filters select { width: auto; min-width: 0; padding: 6px 8px; font-size: 13px; }
  .dr-filters .spacer { flex: 1; }
  .scope { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .scope button { border: 0; border-radius: 0; border-right: 1px solid var(--border); background: var(--panel-2); padding: 6px 11px; font-size: 12.5px; white-space: nowrap; }
  .scope button:last-child { border-right: 0; }
  .scope button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  #btnAdv { padding: 6px 12px; font-size: 12.5px; white-space: nowrap; flex-shrink: 0; }
  #btnAdv[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  #btnAdv .badge { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; text-align: center; }
  #btnAdv .badge:empty { display: none; }

  /* advanced filters: a panel on wide screens, a sheet from the bottom on phones */
  .adv { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); padding: 12px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 16px; font-size: 13px; }
  .adv[hidden] { display: none; }
  .adv-head, .adv-foot, .adv-scrim { display: none; }
  @media (max-width: 860px) { .adv { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .adv label > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .adv select, .adv input { width: 100%; padding: 6px 8px; font-size: 13px; }
  .adv .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: center; }
  .adv .pair i { font-style: normal; color: var(--muted); }
  .adv .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; grid-column: 1 / -1; }
  .adv .checks .check { margin: 0; white-space: nowrap; }
  .adv .checks input[type="checkbox"] { width: auto; padding: 0; }
  .adv .checks .check > span { display: inline; margin: 0; font-size: 13px; color: var(--text); }
  .adv .checks .spacer { flex: 1; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--accent-weak); color: var(--accent); font-size: 12.5px; font-weight: 600; }
  .chip button { border: 0; background: transparent; color: inherit; padding: 0 6px; font-size: 14px; line-height: 1; }
  .dr-tips { font-size: 12.5px; color: var(--muted); margin: 0; }
  .dr-tips button { padding: 1px 8px; font-size: 12px; }
  .dr-tips.quiet { display: none; }

  /* overview of the results */
  .ov { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); margin: 6px 0 10px; }
  .ov > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 10px 14px; font-size: 13px; color: var(--muted); }
  .ov > summary::-webkit-details-marker { display: none; }
  .ov > summary b { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
  .ov > summary .car { margin-left: auto; transition: transform var(--dur-micro) var(--ease-out); }
  .ov[open] > summary .car { transform: rotate(180deg); }
  .ov-body { padding: 2px 14px 12px; display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 10px 12px; align-items: center; font-size: 12.5px; }
  .ov-body > .k { color: var(--muted); }
  .strip { position: relative; }
  .strip .track { position: relative; height: 34px; margin: 0 5px; }
  .strip .track::before { content: ""; position: absolute; left: 0; right: 0; top: 16px; height: 2px; background: var(--border); }
  .strip .track i { position: absolute; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--accent); opacity: .4; }
  .strip .track .med { position: absolute; top: 3px; bottom: 3px; width: 2px; margin-left: -1px; background: var(--text); }
  .strip .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .strip .ends b { color: var(--text); }
  .bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--panel-2); }
  .bar button { border: 0; border-radius: 0; padding: 0; min-width: 3px; height: 100%; cursor: pointer; }
  .bar button:hover { filter: brightness(1.1); }
  .bar button:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 5px; color: var(--muted); font-size: 12px; }
  .legend button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .legend button[aria-pressed="true"] { color: var(--text); font-weight: 700; }
  .legend b { color: var(--text); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .k-orig { background: var(--c-orig); } .k-babe { background: var(--c-babe); } .k-gen { background: var(--c-gen); } .k-bio { background: var(--c-bio); } .k-none { background: var(--border); }
  .k-paid { background: var(--accent); } .k-off { background: var(--c-off); }

  .dr-status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 4px 0 8px; font-size: 13px; color: var(--muted); }
  .dr-status .spacer { flex: 1; }

  /* result cards */
  ul.res { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
  ul.res > li { border-bottom: 1px solid var(--border); }
  .row { display: grid; grid-template-columns: 48px minmax(0, 1fr) 7.5em; gap: 4px 14px; align-items: center; width: 100%; white-space: normal; text-align: left; padding: 10px 6px; border: 0; border-radius: 0; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  .row:hover { background: var(--panel-2); color: var(--text); }
  .row[aria-expanded="true"] { background: var(--panel-2); }
  .thumb { width: 48px; height: 48px; border-radius: 8px; border: 1px solid var(--border); background: var(--figure); display: flex; align-items: center; justify-content: center; overflow: hidden; color: oklch(55% 0.03 250); }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .thumb svg { width: 26px; height: 26px; }
  .row .main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row .nm { font-weight: 700; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .row .en { color: var(--muted); font-size: 12.5px; font-weight: 400; overflow-wrap: anywhere; }
  .row .meta { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .meta .cd { font-family: var(--font-mono); color: var(--text); }
  .row .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .row .pr { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .row .pr b { font-size: 16px; }
  .row .pr small { font-size: 11px; color: var(--muted); }
  .pos { width: 72px; height: 6px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--border); position: relative; }
  .pos i { position: absolute; top: -3px; width: 4px; height: 10px; margin-left: -2px; border-radius: 2px; background: var(--accent); }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); line-height: 1.6; }
  .tag .dot { width: 7px; height: 7px; }
  .tag.off { background: var(--warn-bg); color: var(--warn-text); border-color: transparent; }
  .tag.ctrl { background: var(--accent-weak); color: var(--accent); border-color: transparent; }
  .tag.ok { background: var(--ok-bg); color: var(--ok-text); border-color: transparent; }
  .tag.pkg { border-style: dashed; }
  mark { background: var(--accent-weak); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* detail: a card on wide screens, a full screen on phones */
  .detail { margin: 0 6px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); overflow: hidden; }
  .d-back { display: none; }
  .d-head { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 14px 18px; padding: 14px 16px; align-items: center; border-bottom: 1px solid var(--border); }
  .d-pic { width: 112px; height: 96px; border-radius: 10px; border: 1px solid var(--border); background: var(--figure); display: flex; align-items: center; justify-content: center; overflow: hidden; color: oklch(55% 0.03 250); }
  .d-pic svg { width: 44px; height: 44px; }
  .d-pic .zoom { all: unset; box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
  .d-pic .zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .d-pic img { max-width: 100%; max-height: 100%; display: block; }
  .d-title h2 { margin: 0; font-size: 18px; line-height: 1.3; overflow-wrap: anywhere; }
  .d-title .en { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .d-title .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .d-price { text-align: right; font-variant-numeric: tabular-nums; }
  .d-price b { display: block; font-size: 26px; line-height: 1.1; font-family: var(--font-display); }
  .d-price small { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { border: 0; border-radius: 0; background: none; padding: 10px 10px 9px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .tabp { padding: 14px 16px 16px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .fact { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--panel-2); min-width: 0; }
  .fact .k { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .fact .v { font-size: 13.5px; overflow-wrap: anywhere; }
  .fact .v .cd, .cd { font-family: var(--font-mono); }
  .fact.wide { grid-column: 1 / -1; }
  .sib { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .sib button { font-family: var(--font-mono); font-size: 12px; padding: 1px 8px; }
  .note { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .acts button { font-size: 12.5px; padding: 6px 11px; }
  .sec { font-size: 13px; font-weight: 700; margin: 0 0 8px; }
  .sec small { font-weight: 400; color: var(--muted); }
  .sec + .sec, * + .sec { margin-top: 18px; }
  .kv { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 5px 12px; font-size: 13px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .ind { white-space: pre-wrap; }

  /* price history chart */
  .chart { max-width: 760px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .ax { stroke: var(--border); }
  .chart .lbl { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; }
  .chart .ln.gone { stroke: var(--c-off); stroke-dasharray: 4 3; }
  .chart .pt { fill: var(--accent); }
  .hist-tbl { margin-top: 8px; }
  .hist-tbl summary { font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .hist-tbl table { width: 100%; max-width: 360px; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .hist-tbl td { padding: 2px 0; border-bottom: 1px solid var(--border); }
  .hist-tbl td:last-child { text-align: right; }
  /* same-group comparison */
  .cmp { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .ci { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr) 5.2em; gap: 10px; align-items: center; }
  .cmp .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp .nm button { all: unset; cursor: pointer; }
  .cmp .nm button:hover { color: var(--accent); text-decoration: underline; }
  .cmp .nm button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cmp .track { height: 12px; border-radius: 3px; background: var(--panel-2); position: relative; overflow: hidden; }
  .cmp .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; opacity: .75; }
  .cmp .v { text-align: right; font-variant-numeric: tabular-nums; }
  .ci.me { font-weight: 700; }
  .ci.me .track i { opacity: 1; box-shadow: inset 0 0 0 2px var(--text); }
  .cmp-more { margin-top: 8px; }

  .looks { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 14px; align-items: start; }
  .looks + .looks { margin-top: 12px; }
  .looks figure { margin: 0; width: 150px; height: 126px; border: 1px solid var(--border); border-radius: 8px; background: var(--figure); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .looks img { max-width: 100%; max-height: 100%; display: block; }
  .looks .zoom { all: unset; box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: zoom-in; border-radius: 8px; }
  .looks .zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .looks figure span { font-size: 11.5px; color: var(--muted); padding: 6px; text-align: center; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .links a { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; text-decoration: none; }
  .links a:hover { border-color: var(--accent); }
  .rules-txt { border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
  .rules-txt h4 { margin: 0; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .rules-txt h4 a { font-weight: 400; font-size: 12.5px; }
  .rules-txt .txt { margin: 0; padding: 10px 12px; max-height: 460px; overflow-y: auto; white-space: pre-wrap; font: 13px/1.7 var(--font-body); }
  .rules-txt .txt + h4 { border-top: 1px solid var(--border); }
  .rules-txt + .rules-txt { margin-top: 10px; }

  .more { display: flex; justify-content: center; padding: 14px 0; }
  .empty-state { padding: 28px 6px; color: var(--muted); font-size: 14px; }
  .empty-state b { color: var(--text); }
  .loading { padding: 28px 6px; color: var(--muted); }
  .sec-h { font-size: 13px; font-weight: 700; color: var(--muted); margin: 22px 0 6px; }
  .foot { margin-top: 26px; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
  .foot p { margin: 0; }

  /* photo viewer */
  dialog.photo { border: 0; padding: 0; border-radius: 12px; background: var(--panel); color: var(--text); width: min(92vw, 760px); max-height: 92vh; box-shadow: 0 12px 40px oklch(0% 0 0 / 0.35); }
  dialog.photo::backdrop { background: oklch(15% 0.01 255 / 0.72); }
  dialog.photo .ph-img { background: var(--figure); display: flex; align-items: center; justify-content: center; max-height: calc(92vh - 96px); overflow: auto; }
  dialog.photo .ph-img img { max-width: 100%; max-height: calc(92vh - 96px); display: block; cursor: zoom-out; }
  dialog.photo .ph-bar { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--border); }
  dialog.photo .ph-cap { flex: 1; min-width: 0; font-size: 13px; white-space: pre-line; overflow-wrap: anywhere; }
  dialog.photo .ph-cap b { font-size: 14px; }
  dialog.photo .ph-bar a { font-size: 12.5px; white-space: nowrap; }
  dialog.photo .ph-bar button { padding: 4px 12px; font-size: 12.5px; }

  /* ---------- phones ---------- */
  @media (max-width: 760px) {
    .row { grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 2px; }
    .thumb { width: 44px; height: 44px; }
    .row .pr b { font-size: 15px; }
    .pos { width: 52px; }
    /* the open drug takes the whole screen; Back returns to the list */
    .detail { position: fixed; inset: 0; z-index: 40; margin: 0; border: 0; border-radius: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); }
    .d-back { display: flex; position: sticky; top: 0; z-index: 2; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .d-back button { padding: 6px 12px; font-size: 13px; }
    .d-back span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .d-head { grid-template-columns: 88px minmax(0, 1fr); padding: 14px 16px; }
    .d-pic { width: 88px; height: 80px; }
    .d-price { grid-column: 1 / -1; text-align: left; display: flex; align-items: baseline; gap: 10px; }
    .d-price b { display: inline; font-size: 24px; }
    .tabs { position: sticky; top: 49px; z-index: 1; background: var(--bg); }
    .tabp { padding: 14px 16px 28px; }
    .facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .ci { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "nm v" "tr tr"; row-gap: 3px; }
    .ci .nm { grid-area: nm; } .ci .v { grid-area: v; } .ci .track { grid-area: tr; height: 8px; margin-bottom: 4px; }
    .looks { grid-template-columns: 120px minmax(0, 1fr); }
    .looks figure { width: 120px; height: 104px; }
    body.sheet-open { overflow: hidden; }
  }
  @media (max-width: 640px) {
    .topbar .sub { display: none; }
    .dr { padding-top: 8px; }
    .dr-q { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 6px 0; margin: -6px 0 0; }
    .dr-filters { overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .dr-filters::-webkit-scrollbar { display: none; }
    .dr-filters .spacer { min-width: 4px; }

<script>
const TW = RT.twDrugs, N = TW.N, F = TW.F, T = RT.t, esc = RT.esc;
const KEY = 'drugs';
const ADV = { pmin: '', pmax: '', from: '', to: '', atc: '', cls: '', form: '', single: '', cat: '', ctrl: '', country: '', lic: '', pkg: '', who: '', rules: false, photo: false };
const DEF = { scope: 'paid', sort: 'rel', advOpen: false, adv: ADV };
let S = RT.merge(DEF, RT.load(KEY, {}));
// scopes before the four-way split: 'all' (with delisted) and 'lic' (everything) both become 'every'
if (S.scope === 'all' || (S.scope === 'lic' && !S.scope4)) S.scope = 'every';
S.scope4 = true;
// earlier versions kept a few filters at the top level
['cls', 'form'].forEach((k) => { if (S[k]) { S.adv[k] = S[k]; } delete S[k]; });
if (S.ctrl === true) S.adv.ctrl = 'any'; if (S.single === true) S.adv.single = '單方'; delete S.ctrl; delete S.single;
let Q = '', chips = [];            // chips: [{k: 'group'|'atc', v}]
let nhiD = null, fdaD = null, extraD = null, rulesD = null, shown = 50, open = new Set();
const tabOf = new Map();           // the tab each open drug shows
const $ = (id) => document.getElementById(id);
const phone = () => matchMedia('(max-width: 760px)').matches;
const fmtP = (p) => (p ? p.toLocaleString('en-US', { minimumFractionDigits: p < 100 ? 2 : 0, maximumFractionDigits: 2 }) : '0');
const CLS = ['研發廠', 'BA/BE學名藥', '一般學名藥', '生物製劑'];
const CLS_EN = { '研發廠': 'Originator', 'BA/BE學名藥': 'BA/BE generic', '一般學名藥': 'Generic', '生物製劑': 'Biologic' };
const CLS_KEY = { '研發廠': 'orig', 'BA/BE學名藥': 'babe', '一般學名藥': 'gen', '生物製劑': 'bio' };
const clsName = (c) => (RT.lang === 'en' ? CLS_EN[c] || c : c);
const COUNTRY = { TW: '台灣', IN: '印度', JP: '日本', DE: '德國', US: '美國', IT: '義大利', CN: '中國', CH: '瑞士', FR: '法國', GB: '英國', ES: '西班牙', BE: '比利時', KR: '韓國', AT: '奧地利', IE: '愛爾蘭', NL: '荷蘭', SE: '瑞典', DK: '丹麥', AU: '澳洲', CA: '加拿大', PR: '波多黎各', SI: '斯洛維尼亞', PT: '葡萄牙', GR: '希臘', HU: '匈牙利', PL: '波蘭', IL: '以色列', SG: '新加坡', TH: '泰國', MY: '馬來西亞', ID: '印尼', VN: '越南', FI: '芬蘭', NO: '挪威', CZ: '捷克', HR: '克羅埃西亞', BR: '巴西', AR: '阿根廷', MX: '墨西哥', TR: '土耳其', PK: '巴基斯坦', KE: '肯亞', ZA: '南非' };
const countryName = (c) => (RT.lang === 'en' ? c : (COUNTRY[c] ? `${COUNTRY[c]} ${c}` : c));

/* ---------- data ---------- */
function licOf(r) { return fdaD && r[N.licId] ? fdaD.byLicId.get(r[N.licId]) || null : null; }
// the same product in another pack: same first eight characters of the NHI code (…00 and …G0)
const siblings = (r) => { const p = r[N.code].slice(0, 8); return ['00', 'G0'].map((s) => p + s).filter((c) => c !== r[N.code] && nhiD.byCode.has(c)).map((c) => nhiD.byCode.get(c)); };
const hasFoilTwin = (r) => !TW.isFoil(r[N.code]) && nhiD.byCode.has(r[N.code].slice(0, 8) + 'G0');
const mcp = (p) => (/^https?:/.test(p) ? p : (extraD ? extraD.base : 'https://mcp.fda.gov.tw/') + p);
function looksOf(f) { return f && extraD ? extraD.looks[f[F.licence]] || [] : []; }
function photoOf(r) {
  const looks = looksOf(licOf(r)); if (!looks.length) return '';
  const i = extraD.lookCols.indexOf('photo'); const l = looks.find((x) => x[i]); return l ? mcp(l[i]) : '';
}
let hay = null;
function haystack() {

  hay = nhiD.rows.map((r) => {
    const f = licOf(r);
    return TW.fold([r[N.code], r[N.en], r[N.zh], r[N.ingredient], r[N.atc], r[N.vendor], r[N.maker], r[N.group], f ? f[F.licence] : '', f ? f[F.ingredients] : ''].join(' \u0001 '));
  });

}
let licOnly = null, licHay = null;
function licOnlyRows() {
  if (licOnly || !fdaD) return licOnly || [];
  const used = new Set(nhiD.rows.map((r) => r[N.licId]).filter(Boolean));
  licOnly = fdaD.rows.filter((f) => !f[F.status] && !(f[F.licId] && used.has(f[F.licId])));
  licHay = licOnly.map((f) => TW.fold([f[F.licence], f[F.zh], f[F.en], f[F.ingredients], f[F.applicant], f[F.maker]].join(' \u0001 ')));
  return licOnly;
}
const ATC_RE = /^[a-z]\d{2}([a-z]([a-z](\d{1,2})?)?)?$/;
function tokens() { return TW.fold(Q).split(/\s+/).filter(Boolean); }

/* ---------- dosage-form pictograms (when there is no photo) ---------- */
const ICON = {
  tab: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path d="M5.5 12h13"/></svg>',
  cap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="8" width="17" height="8" rx="4" transform="rotate(-35 12 12)"/><path d="m9.2 7.9 4.6 6.5"/></svg>',
  inj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m17 3 4 4M19 5l-9.5 9.5M14 6l4 4M7 13l4 4M5.5 18.5 3 21M8.5 11.5 5 15l4 4 3.5-3.5"/></svg>',
  liq: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 3h6M10 3v4l-3 3v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V10l-3-3V3"/><path d="M7 14h10"/></svg>',
  tube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 21h12l-2-14H8z"/><path d="M10 7V4h4v3"/></svg>',
  inh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3h6v10h4v5a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2z"/></svg>',
  drop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
};
function formIcon(form) {
  const f = String(form || '');
  if (/膠囊/.test(f)) return ICON.cap;
  if (/注射|輸注|針/.test(f)) return ICON.inj;
  if (/吸入|噴/.test(f)) return ICON.inh;
  if (/點眼|點耳|點鼻|滴/.test(f)) return ICON.drop;
  if (/膏|凝膠|乳|貼/.test(f)) return ICON.tube;
  if (/液|糖漿|懸|酏|溶|乳劑/.test(f)) return ICON.liq;
  return ICON.tab;
}

/* ---------- advanced filters ---------- */
const A = () => S.adv;
const advCount = () => Object.entries(A()).filter(([, v]) => v !== '' && v !== false).length;
const needsLic = () => !!(A().cat || A().ctrl || A().country || A().lic);
const num = (v) => { const n = parseFloat(String(v).replace(/,/g, '')); return Number.isFinite(n) ? n : null; };
function licPasses(f) {
  const a = A();
  if (!needsLic()) return true;
  if (!f) return false;
  if (a.cat && f[F.category] !== a.cat) return false;
  if (a.ctrl) { const lv = TW.ctrlLevel(f[F.controlled]); if (a.ctrl === 'any' ? !lv : a.ctrl === 'none' ? lv : lv !== +a.ctrl) return false; }
  if (a.country && f[F.country] !== a.country) return false;
  if (a.lic === 'valid' && f[F.status]) return false;
  if (a.lic === 'gone' && !f[F.status]) return false;
  return true;
}
function passes(r) {
  const a = A();
  if (a.cls && r[N.class] !== a.cls) return false;
  if (a.form && r[N.form] !== a.form) return false;
  if (a.single && r[N.single] !== a.single) return false;
  const lo = num(a.pmin), hi = num(a.pmax);
  if (lo != null && !(r[N.price] >= lo)) return false;
  if (hi != null && !(r[N.price] > 0 && r[N.price] <= hi)) return false;
  if (a.from && (r[N.firstListed] || '') < a.from) return false;
  if (a.to && (r[N.firstListed] || '9999') > a.to + '-31') return false;
  if (a.atc && !r[N.atc].startsWith(a.atc.trim().toUpperCase())) return false;
  if (a.pkg === 'g0' && !TW.isFoil(r[N.code])) return false;
  if (a.pkg === 'not' && TW.isFoil(r[N.code])) return false;
  if (a.who) { const w = TW.fold(a.who); if (!TW.fold(r[N.vendor] + ' ' + r[N.maker]).includes(w)) return false; }
  if (a.rules && !r[N.ruleChapters]) return false;

  if (a.photo && !photoOf(r)) return false;

function search() {
  const toks = tokens();
  const H = haystack();
  const out = [];
  for (let i = 0; i < nhiD.rows.length; i++) {
    const r = nhiD.rows[i];
    if (S.scope === 'lic') break;
    if (S.scope === 'paid' && !(r[N.price] > 0)) continue;
    if (S.scope === 'delisted' && r[N.price] > 0) continue;
    if (!passes(r)) continue;
    let ok = true;
    for (const c of chips) {
      if (c.k === 'group' && r[N.group] !== c.v) { ok = false; break; }
      if (c.k === 'atc' && !r[N.atc].startsWith(c.v)) { ok = false; break; }
    }
    if (!ok) continue;
    const h = H[i];
    let score = 0;
    for (const t of toks) {
      if (!h.includes(t)) { ok = false; break; }
      const code = r[N.code].toLowerCase(), atc = r[N.atc].toLowerCase();
      if (code === t) score += 100;
      else if (code.startsWith(t)) score += 60;
      if (ATC_RE.test(t) && atc.startsWith(t)) score += 50;
      if (TW.fold(r[N.zh]).startsWith(t) || TW.fold(r[N.en]).startsWith(t)) score += 30;
      if (TW.fold(r[N.ingredient]).startsWith(t)) score += 20;
      score += 1;
    }
    if (!ok) continue;
    out.push({ r, score: score + (r[N.price] > 0 ? 5 : 0) });
  }
  const by = {
    rel: (a, b) => b.score - a.score || (b.r[N.price] > 0) - (a.r[N.price] > 0) || a.r[N.zh].localeCompare(b.r[N.zh], 'zh-Hant'),
    pa: (a, b) => (a.r[N.price] || Infinity) - (b.r[N.price] || Infinity),
    pd: (a, b) => b.r[N.price] - a.r[N.price],
    code: (a, b) => (a.r[N.code] < b.r[N.code] ? -1 : 1),
    new: (a, b) => (a.r[N.firstListed] < b.r[N.firstListed] ? 1 : a.r[N.firstListed] > b.r[N.firstListed] ? -1 : 0),
  };
  // a price group is for comparing prices: cheapest first unless another order was chosen
  out.sort(S.sort === 'rel' && chips.some((c) => c.k === 'group') ? by.pa : by[S.sort] || by.rel);
  let lic = [];
  const nhiOnly = A().cls || A().form || A().pmin || A().pmax || A().from || A().to || A().atc || A().pkg || A().rules || A().single;
  if ((S.scope === 'lic' || S.scope === 'every') && fdaD && (toks.length || needsLic() || A().photo) && !chips.length && !nhiOnly) {
    const L = licOnlyRows();
    for (let i = 0; i < L.length; i++) {
      if (!licPasses(L[i])) continue;
      if (A().photo && !looksOf(L[i]).length) continue;
      if (toks.every((t) => licHay[i].includes(t))) lic.push(L[i]);
    }
  }
  return { rows: out.map((x) => x.r), lic };
}

/* ---------- price scale shared by the overview and the cards ---------- */
let scale = null;
function makeScale(rows) {
  const ps = rows.map((r) => r[N.price]).filter((p) => p > 0).sort((a, b) => a - b);
  if (!ps.length) return null;
  const lo = ps[0], hi = ps[ps.length - 1], log = hi / lo > 20;
  const f = (p) => (log ? Math.log(p) : p);
  const pos = (p) => (hi === lo ? 0.5 : (f(p) - f(lo)) / (f(hi) - f(lo)));
  return { ps, lo, hi, log, pos, med: ps[Math.floor(ps.length / 2)] };
}

/* ---------- render ---------- */
function hl(text) {
  const s = String(text || ''); const toks = tokens().filter((t) => t.length > 0);
  if (!toks.length) return esc(s);
  const f = TW.fold(s); const marks = new Array(s.length).fill(false);
  toks.forEach((t) => { let p = f.indexOf(t); while (p >= 0) { for (let k = p; k < p + t.length && k < s.length; k++) marks[k] = true; p = f.indexOf(t, p + t.length); } });
  let o = '', inM = false;
  for (let i = 0; i < s.length; i++) { if (marks[i] !== inM) { o += marks[i] ? '<mark>' : '</mark>'; inM = marks[i]; } o += esc(s[i]); }
  return o + (inM ? '</mark>' : '');
}

  const ctrl = {}; if (fdaD) rows.forEach((r) => { const lv = TW.ctrlLevel((licOf(r) || [])[F.controlled]); if (lv) ctrl[lv] = (ctrl[lv] || 0) + 1; });
  const pct = (n) => ((n / rows.length) * 100).toFixed(2) + '%';
  // price dots: every reimbursed item, on a log scale when prices span more than 20×
  let strip = '';

    // dots as positioned elements so they stay round at any width; a little vertical jitter shows where they pile up
    const dots = sc.ps.length > 1500 ? sc.ps.filter((_, i) => i % Math.ceil(sc.ps.length / 1500) === 0) : sc.ps;
    const left = (p) => (sc.pos(p) * 100).toFixed(2) + '%';
    strip = `<div class="strip"><div class="track" role="img" aria-label="${T(`支付價分布：最低 $${fmtP(sc.lo)}、中位數 $${fmtP(sc.med)}、最高 $${fmtP(sc.hi)}`, `Prices: lowest $${fmtP(sc.lo)}, median $${fmtP(sc.med)}, highest $${fmtP(sc.hi)}`)}">${dots.map((p, i) => `<i style="left:${left(p)};top:${10 + ((i * 7919) % 13)}px"></i>`).join('')}<b class="med" style="left:${left(sc.med)}"></b></div>
      <div class="ends"><span>$${fmtP(sc.lo)}</span><span>${T('中位數', 'median')} <b>$${fmtP(sc.med)}</b>${sc.log ? T('（對數刻度）', ' (log scale)') : ''}</span><span>$${fmtP(sc.hi)}</span></div></div>`;
  }
  const clsBar = ['研發廠', 'BA/BE學名藥', '一般學名藥', '生物製劑', ''].filter((c) => byCls[c]).map((c) => ({ c, n: byCls[c], key: CLS_KEY[c] || 'none', name: c ? clsName(c) : T('未分類', 'Unclassified') }));

  return `<details class="ov" id="ov"${open ? ' open' : ''}><summary><span><b>${rows.length.toLocaleString()}</b> ${T('筆', 'items')}</span>${sc ? `<span>${T('中位數', 'median')} <b>$${fmtP(sc.med)}</b></span><span>$${fmtP(sc.lo)} – $${fmtP(sc.hi)}</span>` : ''}<span>${T('給付中', 'reimbursed')} <b>${paid}</b></span><span class="car" aria-hidden="true">▾</span></summary>
    <div class="ov-body">
      ${sc ? `<span class="k">${T('支付價', 'Price')}</span>${strip}` : ''}
      <span class="k">${T('藥品分類', 'Class')}</span><div><div class="bar">${clsBar.map((b) => `<button type="button" class="k-${b.key}" style="width:${pct(b.n)}" data-ovcls="${esc(b.c)}" title="${esc(b.name)} ${b.n}" aria-label="${esc(b.name)} ${b.n}"></button>`).join('')}</div>
        <div class="legend">${clsBar.map((b) => `<button type="button" data-ovcls="${esc(b.c)}" aria-pressed="${on === b.c && !!b.c}"><span class="dot k-${b.key}"></span>${esc(b.name)} <b>${b.n}</b></button>`).join('')}</div></div>
      ${S.scope === 'every' || S.scope === 'delisted' ? `<span class="k">${T('給付狀態', 'Status')}</span><div><div class="bar"><button type="button" class="k-paid" style="width:${pct(paid)}" data-ovscope="paid" aria-label="${T('給付中', 'Reimbursed')} ${paid}"></button><button type="button" class="k-off" style="width:${pct(rows.length - paid)}" data-ovscope="delisted" aria-label="${T('已取消給付', 'Delisted')} ${rows.length - paid}"></button></div>
        <div class="legend"><button type="button" data-ovscope="paid"><span class="dot k-paid"></span>${T('給付中', 'Reimbursed')} <b>${paid}</b></button><button type="button" data-ovscope="delisted"><span class="dot k-off"></span>${T('已取消給付', 'Delisted')} <b>${rows.length - paid}</b></button></div></div>` : ''}
      ${Object.keys(ctrl).length ? `<span class="k">${T('管制藥品', 'Controlled')}</span><div class="legend" style="margin:0">${Object.entries(ctrl).sort().map(([lv, n]) => `<button type="button" data-ovctrl="${lv}" aria-pressed="${A().ctrl === lv}"><span class="tag ctrl">${T(`第${'一二三四'[lv - 1]}級`, `Schedule ${lv}`)}</span> <b>${n}</b></button>`).join('')}</div>` : ''}

function zoomBtn(src, cap, inner) { return `<button type="button" class="zoom" data-photo="${esc(src)}" data-cap="${esc(cap)}" aria-label="${T('放大照片', 'Enlarge photo')}" title="${T('點一下放大', 'Click to enlarge')}">${inner}</button>`; }
const TABS = [['sum', '概要', 'Overview'], ['price', '價格', 'Price'], ['rules', '給付規定', 'NHI rules'], ['looks', '外觀與仿單', 'Looks & leaflet'], ['lic', '許可證', 'Licence']];

function tabHTML(r, tab) {

    const pkg = TW.isFoil(r[N.code]) ? T('鋁箔包裝（代號末兩碼 G0）', 'Foil pack (code ends in G0)') : hasFoilTwin(r) ? T('一般包裝（同品項另有 G0 鋁箔包裝）', 'Standard pack (a G0 foil pack also exists)') : '';

// every item in the same NHI price group, cheapest first, this one highlighted
function groupBars(r, all) {
  const items = nhiD.rows.filter((x) => x[N.group] === r[N.group] && (x[N.price] > 0 || x === r)).sort((a, b) => a[N.price] - b[N.price]);

  return `<div class="cmp" role="list">${list.map((x) => `<div class="ci${x === r ? ' me' : ''}" role="listitem"><span class="nm" title="${esc(x[N.zh] || x[N.en])}"><button type="button" data-go="${esc(x[N.code])}">${esc(x[N.zh] || x[N.en])}</button></span><span class="track"><i class="k-${CLS_KEY[x[N.class]] || 'none'}" style="width:${((x[N.price] / max) * 100).toFixed(1)}%"></i></span><span class="v">${x[N.price] > 0 ? '$' + fmtP(x[N.price]) : T('取消', 'off')}</span></div>`).join('')}</div>

}

/* ---------- tabs that load something: price history, rules ---------- */

  try {
    const h = (await TW.hist(r[N.code])).filter((x) => x.date);
    const pts = h.length ? h : (r[N.priceSince] ? [{ date: r[N.priceSince], price: r[N.price] }] : []);
    if (!pts.length) { box.innerHTML = `<p class="hint">${T('沒有價格紀錄。', 'No price record.')}</p>`; return; }
    const W = 640, H = 190, L = 52, R = 14, Tp = 12, B = 26;
    const t = (d) => new Date(d).getTime();
    const x0 = t(pts[0].date), x1 = Math.max(Date.now(), t(pts[pts.length - 1].date) + 864e5);
    const ps = pts.map((p) => p.price).filter((p) => p > 0);
    const max = Math.max(...ps, 0.01), min = Math.min(...ps, max);
    // y axis: 0 when prices are close to it, else a little below the lowest
    const y0 = min < max * 0.35 ? 0 : Math.max(0, min - (max - min) * 0.25), y1 = max + (max - y0) * 0.08 || 1;
    const X = (d) => L + ((t(d) - x0) / (x1 - x0)) * (W - L - R), Y = (p) => Tp + (1 - (p - y0) / (y1 - y0)) * (H - Tp - B);
    const yt = [y0, (y0 + y1) / 2, y1].map((v) => ({ v, y: Y(v) }));
    const yrs = []; const ya = new Date(x0).getFullYear(), yb = new Date(x1).getFullYear(), step = Math.max(1, Math.ceil((yb - ya + 1) / 6));
    for (let y = ya + (ya === new Date(x0).getFullYear() && new Date(x0).getMonth() > 0 ? 1 : 0); y <= yb; y += step) yrs.push(y);
    let d = '', gone = '';
    pts.forEach((p, i) => {
      const xx = X(p.date).toFixed(1), yy = (p.price > 0 ? Y(p.price) : H - B).toFixed(1);
      if (p.price > 0) d += (i && pts[i - 1].price > 0 ? ` H${xx} V${yy}` : ` M${xx} ${yy}`);
      else if (i) gone += ` M${X(p.date).toFixed(1)} ${Y(pts[i - 1].price || max).toFixed(1)} V${yy} H${(W - R).toFixed(1)}`;
    });
    const last = pts[pts.length - 1];
    if (last.price > 0) d += ` H${(W - R).toFixed(1)}`;
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('支付價歷程圖', 'Price history chart')}">
      ${yt.map((g) => `<line class="ax" x1="${L}" x2="${W - R}" y1="${g.y.toFixed(1)}" y2="${g.y.toFixed(1)}" stroke-dasharray="${g.v === y0 ? '' : '2 4'}"/><text class="lbl" x="${L - 8}" y="${(g.y + 4).toFixed(1)}" text-anchor="end">$${fmtP(+g.v.toFixed(2)) || '0'}</text>`).join('')}
      ${yrs.map((y) => { const xx = X(`${y}-01-01`); return xx >= L && xx <= W - R ? `<line class="ax" x1="${xx.toFixed(1)}" x2="${xx.toFixed(1)}" y1="${H - B}" y2="${H - B + 4}"/><text class="lbl" x="${xx.toFixed(1)}" y="${H - 8}" text-anchor="middle">${y}</text>` : ''; }).join('')}
      <path class="ln" d="${d.trim()}"/>${gone ? `<path class="ln gone" d="${gone.trim()}"/>` : ''}
      ${pts.filter((p) => p.price > 0).map((p) => `<circle class="pt" cx="${X(p.date).toFixed(1)}" cy="${Y(p.price).toFixed(1)}" r="2.6"><title>${esc(p.date)} $${fmtP(p.price)}</title></circle>`).join('')}
    </svg>
    <details class="hist-tbl"><summary>${T(`${pts.length} 次價格變動`, `${pts.length} price changes`)}</summary><table>${pts.slice().reverse().map((p) => `<tr><td>${esc(p.date)}</td><td>${p.price ? '$' + fmtP(p.price) : T('取消給付', 'delisted')}</td></tr>`).join('')}</table></details>`;
  } catch (e) { box.innerHTML = `<p class="hint">${esc(e.message || e)}</p>`; }
}

}

function clearAdv() { S.adv = { ...ADV }; syncAdv(); shown = 50; save(); render(); }
$('advClear').onclick = clearAdv; $('advClear2').onclick = clearAdv;
$('tips').innerHTML = T('例如：', 'Try: ') + ['metformin', 'A10BA', 'AC368201G0', '衛署藥輸字第004858號', 'atorvastatin 10'].map((x) => `<button type="button" class="small" data-try="${esc(x)}">${esc(x)}</button>`).join(' ');
$('tips').addEventListener('click', (e) => { const b = e.target.closest('[data-try]'); if (b) { $('q').value = b.dataset.try; onQ(); } });

let fdaP = null, extraP = null;
function loadFda() {
  if (fdaP) return fdaP;
  fdaP = TW.fda().then((d) => {
    fdaD = d; hay = null;
    const cats = {}, countries = {};
    d.rows.forEach((f) => { if (f[F.category]) cats[f[F.category]] = (cats[f[F.category]] || 0) + 1; if (f[F.country]) countries[f[F.country]] = (countries[f[F.country]] || 0) + 1; });
    $('aCat').innerHTML = `<option value="">${T('不限', 'All')}</option>` + Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 14).map(([c]) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    $('aCountry').innerHTML = `<option value="">${T('不限', 'All')}</option>` + Object.entries(countries).sort((a, b) => b[1] - a[1]).slice(0, 40).map(([c]) => `<option value="${esc(c)}">${esc(countryName(c))}</option>`).join('');
    syncAdv(); render();
  }).catch((e) => { fdaP = null; RT.toast(String(e.message || e), 5000); });
  return fdaP;
}
function loadExtra() {
  if (extraP) return extraP;
  extraP = TW.extra().then((d) => { extraD = d; if (A().photo) render(); else refreshShown(); })
    .catch((e) => { extraP = null; RT.toast(String(e.message || e), 5000); });
  return extraP;
}

/* ---------- start ---------- */
$('srcNote').textContent = TW.sourceNote();
$('refs').innerHTML = RT.noticeHTML([T('資料來源：健保署「健保用藥品項」與藥品給付規定；食藥署「全部藥品許可證資料集」「藥品外觀資料集」「藥品仿單外盒資料集」（政府資料開放授權條款第 1 版）。外觀照片、仿單與外盒直接連到食藥署網站。', 'Sources: NHIA “NHI drug list” and reimbursement rules; TFDA “All drug licences”, “Drug appearance” and “Leaflets and cartons” datasets (Open Government Data License, Taiwan v1.0). Photos, leaflets and cartons link straight to the TFDA site.')]);
(() => {
  const p = new URLSearchParams(location.search);
  Q = p.get('q') || ''; $('q').value = Q;
  if (p.get('group')) chips.push({ k: 'group', v: p.get('group') });
  if (p.get('atc')) chips.push({ k: 'atc', v: p.get('atc').toUpperCase() });
})();
[...$('scope').children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.scope)));
$('fSort').value = S.sort;
// the filter sheet never opens by itself on a phone
showAdv(!!S.advOpen && !matchMedia('(max-width: 640px)').matches);
$('aCls').innerHTML = `<option value="">${T('不限', 'All')}</option>` + CLS.map((c) => `<option value="${esc(c)}">${esc(clsName(c))}</option>`).join('');
$('aCat').innerHTML = $('aCountry').innerHTML = `<option value="">${T('不限', 'All')}</option>`;
syncAdv();
TW.nhi().then((d) => {
  nhiD = d;
  const forms = {}; d.rows.forEach((r) => { if (r[N.price] > 0 && r[N.form]) forms[r[N.form]] = (forms[r[N.form]] || 0) + 1; });
  $('aForm').innerHTML = `<option value="">${T('不限', 'All')}</option>` + Object.entries(forms).sort((a, b) => b[1] - a[1]).slice(0, 40).map(([f]) => `<option value="${esc(f)}">${esc(f)}</option>`).join('');
  syncAdv();
  if (S.scope !== 'paid') loadAll();
  TW.meta().then((m) => { metaD = m; $('srcNote').textContent = TW.sourceNote() + T(` 本次資料整理於 ${m.built}。`, ` This copy was built on ${m.built}.`); });
  render();
  // licences come second: search works as soon as the NHI list is in
  loadFda();
  if (A().photo) loadExtra();
}).catch((e) => { $('out').innerHTML = `<div class="empty-state">${esc(e.message || e)}</div>`; });
</script>
</body>
</html>
