<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到頁面</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #0b1220; --muted: #5f6b7a; --line: #e3e7ed; --accent: #0d7d69; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #070e1a; --card: #101a2b; --text: #eef2f7; --muted: #98a2b3; --line: #22304a; --accent: #34d3b4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; line-height: 1.6; }
  main { width: 100%; max-width: 520px; }
  .code { font-family: ui-monospace, Consolas, monospace; color: var(--accent); font-weight: 700; letter-spacing: .08em; }
  h1 { font-size: 1.75rem; margin: 4px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li a { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); text-decoration: none; }
  li a:hover { border-color: var(--accent); }
  li small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>找不到這個頁面</h1>
  <p>網址可能打錯了，或頁面已經移動。英文網址有分大小寫，例如 <code>Research-toolkit</code>。</p>
  <ul>
    <li><a href="/personalcv/">個人網站 <small>CV · Blog</small></a></li>
    <li><a href="/Research-toolkit/">Research Toolkit <small>研究圖表小工具</small></a></li>
    <li><a href="/NMA/">貝氏 NMA 實作教學 <small>R · multinma</small></a></li>
  </ul>
</main>
</body>
</html>
