<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 找不到頁面</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { --bg: #f6f7f9; --text: #0b1220; --muted: #5f6b7a; --line: #e3e7ed; --accent: #0d7d69; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #070e1a; --text: #eef2f7; --muted: #98a2b3; --line: #22304a; --accent: #34d3b4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; line-height: 1.6; text-align: center; }
  main { width: 100%; max-width: 520px; }
  .code { font-family: ui-monospace, Consolas, monospace; font-size: 3rem; font-weight: 700; color: var(--accent); letter-spacing: .08em; line-height: 1; }
  h1 { font-size: 1.5rem; margin: 12px 0 8px; }
  p { color: var(--muted); margin: 0; }
  .path { display: inline-block; margin-top: 16px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; font-family: ui-monospace, Consolas, monospace; font-size: .9rem; word-break: break-all; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>找不到這個頁面</h1>
  <p>Page not found</p>
  <div class="path" id="path" hidden></div>
</main>
<script>
  // Show the address that was requested
  (function () {
    var el = document.getElementById('path');
    el.textContent = decodeURIComponent(location.pathname) + location.search;
    el.hidden = false;
  })();
</script>
</body>
</html>
