<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 找不到頁面</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Hallmark · macrostructure: Long Document · theme: Garden · genre: editorial
   * nav: none · footer: none · 加料: none · tone: 柔和 · 推斷: 受眾=走錯路的訪客 用途=說明網址不存在
   * pre-emit critique: P4 H5 E4 S4 R5 V4 · contrast: pass · mobile: pass
   */
  :root {
    --color-paper:  oklch(97% 0.010 145);
    --color-rule:   oklch(86% 0.016 145);
    --color-muted:  oklch(44% 0.018 155);
    --color-ink:    oklch(23% 0.025 160);
    --color-forest: oklch(35% 0.060 155);
    --color-accent: oklch(52% 0.115 48);
    --font-display: "Fraunces", ui-serif, Georgia, serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", ui-sans-serif, system-ui, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    --space-xs: 0.5rem; --space-md: 1rem; --space-lg: 1.5rem; --space-xl: 2.5rem; --space-3xl: 6rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-paper:  oklch(17% 0.014 155);
      --color-rule:   oklch(32% 0.018 155);
      --color-muted:  oklch(74% 0.016 150);
      --color-ink:    oklch(94% 0.010 145);
      --color-forest: oklch(84% 0.060 150);
      --color-accent: oklch(74% 0.110 55);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: clip; }
  body { background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); line-height: 1.6; }
  main { max-width: 44rem; margin-inline: auto; padding: var(--space-3xl) var(--space-lg); }
  .code { font-family: var(--font-display); font-size: clamp(4rem, 12vw, 6.5rem); font-weight: 700; line-height: 1; color: var(--color-forest); font-variant-numeric: tabular-nums; }
  h1 { margin-top: var(--space-lg); font-size: 1.25rem; font-weight: 700; }
  .en { margin-top: var(--space-xs); color: var(--color-muted); }
  .path { margin-top: var(--space-xl); padding-top: var(--space-md); border-top: 1px solid var(--color-rule); color: var(--color-muted); font-size: 0.875rem; }
  .path b { display: block; margin-top: var(--space-xs); font-family: var(--font-mono); font-weight: 400; color: var(--color-ink); overflow-wrap: anywhere; }
  .path b::before { content: ""; display: inline-block; width: 0.5rem; height: 0.5rem; margin-right: var(--space-xs); border-radius: 50%; background: var(--color-accent); vertical-align: 0.1em; }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>找不到這個頁面</h1>
  <p class="en">Page not found</p>
  <p class="path" id="path" hidden>請求的網址<b id="path-value"></b></p>
</main>
<script>
  // Show the address that was requested
  (function () {
    var p = location.pathname + location.search;
    try { p = decodeURIComponent(p); } catch (e) {}
    document.getElementById('path-value').textContent = p;
    document.getElementById('path').hidden = false;
  })();
</script>
</body>
</html>
