<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var t = localStorage.getItem("splitbill-theme");
    if(t !== "dark" && t !== "light"){
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splitbill｜固定收支</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F5F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://ofevarwtqzvzrvhbanmf.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=599a4d1bd5">
<link rel="stylesheet" href="shared.css?v=c939409d79">
<script src="holiday.js?v=2816c2cc17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="i18n.js?v=5bc99d90b2"></script>
<script src="currencies.js?v=1fe139e56b"></script>
<script src="version.js?v=9d0f04a6e1"></script>
<script src="shared-ui.js?v=6756a5811a"></script>
<script src="theme.js?v=01d7c0a8c1" defer></script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</head>
<body>
<svg class="svg-defs-hidden" aria-hidden="true">
  <defs>
    <linearGradient id="logoGrad" x1="90" y1="90" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop class="logo-stop-a" offset="0%"/>
      <stop class="logo-stop-b" offset="100%"/>
    </linearGradient>
  </defs>
</svg>
<div class="wrap">

  <div class="app-header">
    <div class="header-utility-row">
      <div id="notificationBellContainer"></div>
      <button type="button" class="btn secondary small" id="backBtn" data-i18n="settings.back">‹ 返回</button>
    </div>
    <div class="title-row">
      <svg class="app-logo" viewBox="0 0 512 512" aria-hidden="true">
        <path class="s1" d="M256,238 L118.5,138.1 A170,170 0 0,1 393.5,138.1 Z"/>
        <path class="s2" d="M271.6,265 L426.9,195.9 A170,170 0 0,1 289.4,434.1 Z"/>
        <path class="s3" d="M240.4,265 L222.6,434.1 A170,170 0 0,1 85.1,195.9 Z"/>
      </svg>
      <h1 data-i18n="recurring.title">固定收支</h1>
    </div>
  </div>

  <section class="fx-summary hidden" id="fxSummary" aria-live="polite"></section>

  <div class="sbf-toolbar">
    <p data-i18n="recurring.hint">房租、訂閱這類固定費用，到期會自動記一筆帳。</p>
    <button type="button" class="sbf-primary" id="recurringTemplateAddBtn"><span class="sb-ico" style="--ico:var(--ico-plus)" aria-hidden="true"></span><span data-i18n="recurring.add">新增</span></button>
  </div>

  <div class="fx-views hidden" id="fxViews" role="tablist">
    <button type="button" role="tab" data-view="list" data-i18n="recurring.viewList">全部</button>
    <button type="button" role="tab" data-view="category" data-i18n="recurring.viewCategory">依類別</button>
    <button type="button" role="tab" data-view="upcoming" data-i18n="recurring.viewUpcoming">接下來 30 天</button>
  </div>
  <div id="recurringTemplatesList"></div>
  <div class="sbf-empty hidden" id="recurringTemplatesEmpty">
    <span class="sb-ico" style="--ico:var(--ico-repeat)" aria-hidden="true"></span>
    <b data-i18n="recurring.emptyTitle">還沒有固定支出</b>
    <p data-i18n="recurring.emptyText">把房租、水電或訂閱加進來，到期就不用自己記。</p>
  </div>
</div>

<div class="calc-modal" id="recurringTemplateFormModal">
  <div class="calc-card card sbf-card">
    <div class="calc-header">
      <span class="calc-header-name" id="recurringTemplateFormTitle" data-i18n="settings.recurringFormTitleNew">新增週期性支出</span>
      <button type="button" class="calc-close" id="recurringTemplateFormCloseBtn" data-i18n-title="common.close" aria-label="關閉">✕</button>
    </div>

    <section class="sbf-sec">
      <h3 data-i18n="recurring.secWhat">這是什麼費用</h3>
      <label for="recurTmplDesc" data-i18n="settings.recurringFormDescLabel">品項名稱</label>
      <input type="text" id="recurTmplDesc" maxlength="60" data-i18n-placeholder="settings.recurringFormDescPlaceholder" placeholder="例如 房租、Netflix 訂閱">
      <div class="sbf-chips" id="recurTmplSuggest"></div>
      <label for="recurTmplCategory" data-i18n="recurring.categoryLabel">類別</label>
      <div class="select-wrap"><select id="recurTmplCategory"><option value="general" data-i18n="cat.general"></option><option value="food" data-i18n="cat.food"></option><option value="drink" data-i18n="cat.drink"></option><option value="transit" data-i18n="cat.transit"></option><option value="car" data-i18n="cat.car"></option><option value="flight" data-i18n="cat.flight"></option><option value="hotel" data-i18n="cat.hotel"></option><option value="ticket" data-i18n="cat.ticket"></option><option value="shopping" data-i18n="cat.shopping"></option><option value="medical" data-i18n="cat.medical"></option><option value="network" data-i18n="cat.network"></option></select></div>
    </section>

    <section class="sbf-sec">
      <h3 data-i18n="recurring.secMoney">金額</h3>
      <div class="sbf-row">
        <div>
          <label for="recurTmplCurrency" data-i18n="settings.recurringFormCurrencyLabel">幣別</label>
          <div class="select-wrap"><select id="recurTmplCurrency"></select></div>
        </div>
        <div>
          <label for="recurTmplAmount" id="recurTmplAmountLabel" data-i18n="settings.recurringFormAmountLabel">總金額</label>
          <input type="number" id="recurTmplAmount" min="1" step="any" inputmode="decimal" placeholder="0">
        </div>
      </div>
      <label class="sbf-switch-row">
        <span><b data-i18n="recurring.variableLabel">金額每期不同</b><small data-i18n="recurring.variableHint">像水電瓦斯。到期時再填實際金額，上面填大概的就好</small></span>
        <span class="switch-toggle"><input type="checkbox" id="recurTmplVariable"><span class="switch-slider"></span></span>
      </label>
      <div class="hidden" id="recurTmplFromWrap">
        <label for="recurTmplFrom" data-i18n="recurring.fromLabel">新金額從哪一期開始</label>
        <div class="select-wrap"><select id="recurTmplFrom"></select></div>
        <p class="sbf-note" data-i18n="recurring.fromHint">已經記過的帳不會改</p>
      </div>
    </section>

    <section class="sbf-sec">
      <h3 data-i18n="recurring.secWho">誰付、誰分</h3>
      <label data-i18n="settings.recurringFormPayerLabel">誰付的錢</label>
      <div class="checks" id="recurTmplPayer" role="radiogroup"></div>
      <div class="sbf-label-row">
        <label data-i18n="recurring.whoShares">誰要分攤</label>
        <button type="button" class="sbf-mini" id="recurTmplAll" data-i18n="recurring.everyone">全選</button>
      </div>
      <div class="checks" id="recurTmplParticipants"></div>
      <label data-i18n="recurring.splitHow">怎麼分</label>
      <div class="sbf-seg" role="radiogroup">
        <label><input type="radio" name="recurSplit" value="equal" checked><span data-i18n="recurring.splitEqual">平分</span></label>
        <label><input type="radio" name="recurSplit" value="ratio"><span data-i18n="recurring.splitRatio">照比例</span></label>
        <label><input type="radio" name="recurSplit" value="amount"><span data-i18n="recurring.splitAmount">指定金額</span></label>
      </div>
      <div class="sbf-split-rows hidden" id="recurTmplSplitRows"></div>
      <p class="sbf-note hidden" id="recurTmplSplitNote"></p>
    </section>

    <section class="sbf-sec">
      <h3 data-i18n="recurring.secWhen">什麼時候記</h3>
      <div class="sbf-seg" role="radiogroup">
        <label><input type="radio" name="recurUnit" value="monthly" checked><span data-i18n="currency.recurringUnitMonthly">每月</span></label>
        <label><input type="radio" name="recurUnit" value="weekly"><span data-i18n="currency.recurringUnitWeekly">每週</span></label>
        <label><input type="radio" name="recurUnit" value="yearly"><span data-i18n="recurring.unitYearly">每年</span></label>
      </div>
      <div class="sbf-row" id="recurTmplMonthlyWrap">
        <div class="hidden" id="recurTmplMonthWrap">
          <label for="recurTmplMonth" data-i18n="recurring.monthLabel">幾月</label>
          <div class="select-wrap"><select id="recurTmplMonth"></select></div>
        </div>
        <div>
          <label for="recurTmplMonthlyDay" id="recurTmplDayLabel" data-i18n="recurring.monthDayLabel">每月幾號</label>
          <div class="select-wrap"><select id="recurTmplMonthlyDay"></select></div>
        </div>
      </div>
      <div class="hidden" id="recurTmplWeeklyWrap">
        <label data-i18n="recurring.weekDayLabel">星期幾</label>
        <div class="sbf-seg sbf-days" id="recurTmplWeeklyDay" role="radiogroup"></div>
      </div>
      <label data-i18n="recurring.endLabel">什麼時候停</label>
      <div class="sbf-seg" role="radiogroup">
        <label><input type="radio" name="recurEnd" value="never" checked><span data-i18n="recurring.endNever">不會停</span></label>
        <label><input type="radio" name="recurEnd" value="date"><span data-i18n="recurring.endDate">到某天</span></label>
        <label><input type="radio" name="recurEnd" value="count"><span data-i18n="recurring.endCount">記幾次</span></label>
      </div>
      <div class="hidden" id="recurTmplEndDateWrap">
        <label for="recurTmplEndDate" data-i18n="recurring.endDateLabel">最後一天（這天之後就不記）</label>
        <input type="date" id="recurTmplEndDate">
      </div>
      <div class="hidden" id="recurTmplCountWrap">
        <label for="recurTmplCount" data-i18n="recurring.endCountLabel">總共記幾次</label>
        <input type="number" id="recurTmplCount" min="1" max="600" step="1" inputmode="numeric" placeholder="12">
        <p class="sbf-note hidden" id="recurTmplCountDone"></p>
      </div>
      <p class="sbf-preview hidden" id="recurTmplPreview"></p>
    </section>

    <div class="sbf-actions">
      <button type="button" class="sbf-primary sbf-wide" id="recurTmplSubmitBtn" data-i18n="settings.recurringFormSubmitNew">建立週期性支出</button>
      <div class="msg" id="recurTmplMsg"></div>
    </div>
  </div>
</div>

<div class="calc-modal" id="fxDetailModal">
  <div class="calc-card card sbf-card fx-detail">
    <div class="calc-header">
      <span class="calc-header-name" id="fxDetailTitle"></span>
      <button type="button" class="calc-close" id="fxDetailClose" data-i18n-title="common.close" aria-label="關閉">✕</button>
    </div>
    <div id="fxDetailBody"></div>
  </div>
</div>

<div class="calc-modal" id="fxFillModal">
  <div class="calc-card card sbf-card">
    <div class="calc-header">
      <span class="calc-header-name" id="fxFillTitle"></span>
      <button type="button" class="calc-close" id="fxFillClose" data-i18n-title="common.close" aria-label="關閉">✕</button>
    </div>
    <section class="sbf-sec">
      <p class="sbf-note" id="fxFillWhen"></p>
      <label for="fxFillAmount" data-i18n="recurring.fillLabel">這期實際金額</label>
      <input type="number" id="fxFillAmount" min="0" step="any" inputmode="decimal" placeholder="0">
      <p class="sbf-preview hidden" id="fxFillPreview"></p>
    </section>
    <div class="sbf-actions">
      <button type="button" class="sbf-primary sbf-wide" id="fxFillSubmit" data-i18n="recurring.fillSubmit">記這一期</button>
      <div class="msg" id="fxFillMsg"></div>
    </div>
  </div>
</div>

</html>
