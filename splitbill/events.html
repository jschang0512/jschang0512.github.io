<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var t = localStorage.getItem("splitbill-theme");
    if(t !== "dark" && t !== "light"){
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splitbill｜活動</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F5F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://ofevarwtqzvzrvhbanmf.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=599a4d1bd5">
<link rel="stylesheet" href="shared.css?v=85c49a3c55">
<script src="holiday.js?v=2816c2cc17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="i18n.js?v=9d34657fe1"></script>
<script src="currencies.js?v=cfe0f4b3a7"></script>
<script src="version.js?v=37d0e01d22"></script>
<script src="shared-ui.js?v=2217ad5f02"></script>
<script src="theme.js?v=01d7c0a8c1" defer></script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</head>
<body>
<svg class="svg-defs-hidden" aria-hidden="true">
  <defs>
    <linearGradient id="logoGrad" x1="90" y1="90" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop class="logo-stop-a" offset="0%"/>
      <stop class="logo-stop-b" offset="100%"/>
    </linearGradient>
  </defs>
</svg>
<div class="wrap">

  <div class="app-header">
    <div class="header-utility-row">
      <div id="notificationBellContainer"></div>
      <button type="button" class="btn secondary small" id="backBtn" data-i18n="settings.back">‹ 返回</button>
    </div>
    <div class="title-row">
      <svg class="app-logo" viewBox="0 0 512 512" aria-hidden="true">
        <path class="s1" d="M256,238 L118.5,138.1 A170,170 0 0,1 393.5,138.1 Z"/>
        <path class="s2" d="M271.6,265 L426.9,195.9 A170,170 0 0,1 289.4,434.1 Z"/>
        <path class="s3" d="M240.4,265 L222.6,434.1 A170,170 0 0,1 85.1,195.9 Z"/>
      </svg>
      <h1 data-i18n="events.title">活動</h1>
    </div>
  </div>

  <div class="sbf-toolbar">
    <p data-i18n="events.hint">揪團、聚餐、出遊，大家在這裡報名，結束後一鍵變成帳。</p>
    <button type="button" class="sbf-primary" id="eventAddBtn"><span class="sb-ico" style="--ico:var(--ico-plus)" aria-hidden="true"></span><span data-i18n="events.addShort">開活動</span></button>
  </div>

  <div id="eventList"><div class="sb-skel-bars" role="status"><i style="height:45%"></i><i style="height:75%"></i><i style="height:35%"></i></div></div>
  <div class="sbf-empty hidden" id="eventEmpty">
    <span class="sb-ico" style="--ico:var(--ico-calendar)" aria-hidden="true"></span>
    <b id="eventEmptyTitle" data-i18n="events.emptyTitle">還沒有活動</b>
    <p id="eventEmptyText" data-i18n="events.emptyText">開一個活動，看誰要來。</p>
  </div>
  <details class="ev-past hidden" id="eventPast">
    <summary id="eventPastTitle"></summary>
    <div id="eventPastList"></div>
  </details>
</div>

<div class="calc-modal" id="eventFormModal">
  <div class="calc-card card sbf-card">
    <div class="calc-header">
      <span class="calc-header-name" id="eventFormTitle" data-i18n="events.add">開新活動</span>
      <button type="button" class="calc-close" id="eventFormClose" data-i18n-title="common.close" aria-label="關閉">✕</button>
    </div>

    <section class="sbf-sec">
      <h3 data-i18n="events.secWhat">活動內容</h3>
      <label for="evTitle" data-i18n="events.fieldTitle">活動名稱</label>
      <input type="text" id="evTitle" maxlength="80" data-i18n-placeholder="events.fieldTitlePlaceholder" placeholder="例如 週末烤肉">
      <div class="sbf-chips" id="evTitleChips"></div>
    </section>

    <section class="sbf-sec">
      <h3 data-i18n="events.secWhen">時間地點</h3>
      <label for="evDate" data-i18n="events.fieldDate">日期</label>
      <input type="date" id="evDate" lang="en-CA">
      <div class="sbf-chips" id="evDateChips"></div>
      <p class="sbf-hint" id="evDateHint"></p>
      <label for="evLocation" data-i18n="events.fieldLocation">地點（選填）</label>
      <input type="text" id="evLocation" maxlength="120" data-i18n-placeholder="events.fieldLocationPlaceholder" placeholder="例如 河濱公園">
      <label for="evNote" data-i18n="events.fieldNote">備註（選填）</label>
      <textarea id="evNote" maxlength="500" rows="3" data-i18n-placeholder="events.fieldNotePlaceholder" placeholder="集合時間、要帶什麼"></textarea>
      <div class="sbf-chips" id="evNoteChips"></div>
    </section>

    <section class="sbf-sec">
      <h3 data-i18n="events.secFee">費用怎麼算</h3>
      <div class="sbf-choices" role="radiogroup">
        <label class="sbf-choice"><input type="radio" name="evFee" value="per_person" checked><span><b data-i18n="events.feePerPerson">每人固定金額</b><small data-i18n="events.feePerPersonHint">例如門票，每人都付一樣</small></span></label>
        <label class="sbf-choice"><input type="radio" name="evFee" value="split_total"><span><b data-i18n="events.feeSplitTotal">總額大家平分</b><small data-i18n="events.feeSplitTotalHint">例如包場，來的人越多越便宜</small></span></label>
      </div>
      <div class="sbf-row">
        <div>
          <label for="evCurrency" data-i18n="settings.recurringFormCurrencyLabel">幣別</label>
          <div class="select-wrap"><select id="evCurrency"></select></div>
        </div>
        <div>
          <label for="evAmount" id="evAmountLabel" data-i18n="events.amountEach">每人金額</label>
          <input type="number" id="evAmount" min="1" step="any" inputmode="decimal" placeholder="0">
        </div>
      </div>
    </section>

    <section class="sbf-sec">
      <h3 data-i18n="events.secSignup">報名設定（選填）</h3>
      <label for="evCapacity" data-i18n="events.fieldCapacityShort">人數上限</label>
      <div class="sbf-stepper">
        <button type="button" id="evCapMinus" data-i18n-title="events.capLess" title="少一位" aria-label="少一位">−</button>
        <input type="number" id="evCapacity" min="1" step="1" inputmode="numeric" data-i18n-placeholder="events.noLimit" placeholder="不限">
        <button type="button" id="evCapPlus" data-i18n-title="events.capMore" title="多一位" aria-label="多一位">+</button>
        <button type="button" class="sbf-mini" id="evCapClear" data-i18n="events.noLimit">不限</button>
      </div>
      <p class="sbf-hint hidden" id="evCapHint"></p>
      <label for="evDeadline" data-i18n="events.fieldDeadlineShort">報名截止日</label>
      <div class="sbf-chips" id="evDeadlineChips"></div>
      <input type="date" id="evDeadline" lang="en-CA">
      <p class="sbf-hint" id="evDeadlineHint"></p>
    </section>

    <section class="sbf-sec ev-preview-sec">
      <h3 data-i18n="events.previewTitle">大家會看到</h3>
      <div class="ev-preview" id="evCardPreview" aria-hidden="true"></div>
    </section>

    <div class="sbf-actions">
      <button type="button" class="sbf-primary sbf-wide" id="eventFormSubmit" data-i18n="events.create">建立活動</button>
      <div class="msg" id="eventFormMsg"></div>
    </div>
  </div>
</div>

<div class="calc-modal" id="eventCloseModal">
  <div class="calc-card card sbf-card">
    <div class="calc-header">
      <span class="calc-header-name" data-i18n="events.closeTitle">結算成帳目</span>
      <button type="button" class="calc-close" id="eventCloseClose" data-i18n-title="common.close" aria-label="關閉">✕</button>
    </div>
    <p class="sbf-note" data-i18n="events.closeHint">會新增一筆帳，由你付款、勾選的人分攤。結算後名單就不能再改。</p>
    <section class="sbf-sec">
      <h3 data-i18n="events.closeAttendees">實際參加的人</h3>
      <div class="checks" id="eventCloseAttendees"></div>
    </section>
    <section class="sbf-sec">
      <label for="eventCloseAmount" id="eventCloseAmountLabel"></label>
      <input type="number" id="eventCloseAmount" min="1" step="1" inputmode="decimal">
      <p class="sbf-preview" id="eventCloseSummary"></p>
    </section>
    <div class="sbf-actions">
      <button type="button" class="sbf-primary sbf-wide" id="eventCloseSubmit" data-i18n="events.closeSubmit">轉成帳目</button>
      <div class="msg" id="eventCloseMsg"></div>
    </div>
  </div>
</div>

<script>

const SUPABASE_ANON_KEY = "sb_publishable_pWT6foelsonrb1sLMXhnCw_oA3ytvaX";
</script>
<script src="events.js?v=4b96a36f77"></script>
</body>
</html>
