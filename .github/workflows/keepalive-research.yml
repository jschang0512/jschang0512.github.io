# Keeps the Research Toolkit Supabase project awake. Free projects pause after a week
# without requests; this calls a tiny public function (public.ping) every three days.
# The key below is the project's publishable key, which is meant to be public.
name: Keep tracker database awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # 03:17 UTC every third day
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST \
            "https://bskmkmhikmdhjyvzzocb.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_WKcTPORXCW40EcLsgI9UOA_tff77jVi" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat /tmp/out)"
          test "$code" = "200"
