# Weekly refresh of the Taiwan drug data behind Research-toolkit/drugs/ and Research-toolkit/codelist/.
# Downloads the NHI drug list and three TFDA datasets (licences, appearance, leaflets), trims them with
# .github/scripts/tw-drugs.mjs, converts the NHI reimbursement-rule PDFs to text with
# .github/scripts/tw-drug-rules.mjs (only new or revised ones), and force-pushes the result to the orphan
# branch "tw-drugs-data" (one commit, no history, so the JSON never piles up in main).
# The pages read it from raw.githubusercontent.com.
# Each source is downloaded on its own: one that cannot be reached (the NHI site may refuse servers outside
# Taiwan) keeps last week's data from tw-drugs-data while the others are refreshed. The same scripts can also
# run on a computer in Taiwan (.github/scripts/tw-drugs-local.sh) and push to the same branch.
name: Refresh Taiwan drug data

on:
  schedule:
    - cron: "40 19 * * 0"   # 03:40 Taipei time every Monday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tw-drugs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pdftotext
        # poppler-data carries the CJK CMaps (e.g. ETenms-B5-H) that older Big5-encoded rule PDFs need
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils poppler-data

      - name: Previous data
        run: |
          mkdir -p /tmp/prev
          git fetch origin tw-drugs-data --depth 1 || true
          for f in meta nhi nhi-paid nhi-rest hist fda fda-more extra rules; do
            git show origin/tw-drugs-data:$f.json > /tmp/prev/$f.json 2>/dev/null || rm -f /tmp/prev/$f.json
          done
          ls -l /tmp/prev

      - name: Download sources
        run: |
          mkdir -p /tmp/src
          get() { curl -fsSL --retry 4 --retry-all-errors --retry-delay 20 --connect-timeout 30 --max-time 900 -A "Mozilla/5.0" -o "$1" "$2"; }
          # NHI drug list (about 95 MB)
          if get /tmp/src/nhi.csv "https://info.nhi.gov.tw/api/iode0000s01/Dataset?rId=A21030000I-E41001-001" && [ "$(stat -c %s /tmp/src/nhi.csv)" -gt 20000000 ]; then
            echo "NHI=/tmp/src/nhi.csv" >> "$GITHUB_ENV"
          else
            echo "::warning::NHI drug list could not be downloaded; keeping last week's"
            if [ -f /tmp/prev/nhi-paid.json ]; then echo "NHI=/tmp/prev/nhi-paid.json"; else echo "NHI=/tmp/prev/nhi.json"; fi >> "$GITHUB_ENV"
          fi
          # TFDA: 36 licences, 42 appearance, 39 leaflets and cartons
          for pair in "36:LIC:fda.json:10000000" "42:LOOKS:extra.json:100000" "39:LEAF:extra.json:1000000"; do
            IFS=: read -r id var prev min <<< "$pair"
            csv=""
            if get /tmp/src/fda$id.zip "https://data.fda.gov.tw/data/opendata/export/$id/csv"; then
              mkdir -p /tmp/src/fda$id && unzip -o -q /tmp/src/fda$id.zip -d /tmp/src/fda$id || true
              csv=$(find /tmp/src/fda$id -name '*.csv' -size +${min}c 2>/dev/null | head -1)
            fi
            if [ -n "$csv" ]; then echo "$var=$csv" >> "$GITHUB_ENV"
            else echo "::warning::TFDA dataset $id could not be downloaded; keeping last week's"; echo "$var=/tmp/prev/$prev" >> "$GITHUB_ENV"; fi
          done
          ls -lR /tmp/src || true

      - name: Build JSON
        run: |
          set -e
          for f in "$NHI" "$LIC"; do test -f "$f" || { echo "::error::$f missing and no earlier data to fall back on"; exit 1; }; done
          node .github/scripts/tw-drugs.mjs "$NHI" "$LIC" /tmp/out "$LOOKS" "$LEAF"
          node .github/scripts/tw-drug-rules.mjs /tmp/out /tmp/prev/rules.json
          node -e "const m=require('/tmp/out/meta.json'); console.log('reused:', m.reused.join(', ') || 'none')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to tw-drugs-data
        run: |
          set -e
          if [ -f /tmp/prev/meta.json ] && [ "$(node -p "require('/tmp/prev/meta.json').v")" = "$(node -p "require('/tmp/out/meta.json').v")" ]; then
            echo "Data unchanged."; exit 0
          fi
          cd /tmp/out
          git init -q -b tw-drugs-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Taiwan drug data for Research Toolkit, rebuilt weekly by .github/workflows/tw-drugs.yml on main.\nSources: NHI 健保用藥品項 and 藥品給付規定; TFDA 全部藥品許可證資料集, 藥品外觀資料集, 藥品仿單外盒資料集 (Open Government Data License, Taiwan, v1.0).\n' > README.md
          git add -A
          git commit -q -m "Taiwan drug data $(node -p "require('./meta.json').built")"
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # a tag per version: the pages read the data files through jsDelivr at this fixed address
          TAG=$(node -p "require('./meta.json').tag")
          git tag "$TAG"
          git push -f "$URL" tw-drugs-data "refs/tags/$TAG"
          # keep the three newest data tags; older versions are no longer read by anyone
          git ls-remote --tags "$URL" 'refs/tags/tw-drugs-*' | awk '{print $2}' | grep -vF '^{}' | sed 's#refs/tags/##' | sort -r | tail -n +4 | while read -r t; do git push -q "$URL" --delete "$t" || true; done
